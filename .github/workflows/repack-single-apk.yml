name: Repack single arm64 APK artifact
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Source run whose spool-final-apk artifact holds spool.apk
        required: true
        default: '43815841443'
jobs:
  repack:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spool-final-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          cp "home/runner/work/_temp/apk-out/spool.apk" spool.apk
          sha256sum spool.apk
          ls -la spool.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spool-arm64-apk
          path: spool.apk
          compression-level: 0
          retention-days: 30
