name: Mood region emulator proof (no APK release)
on:
  workflow_dispatch:
  push:
    branches: [spool-mood-region]
    paths: [".github/workflows/mood-region-emulator.yml", "app/src/androidTest/java/com/music/bitchord/MoodRegionEmulatorTest.kt"]
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Android platform, NDK and compileSdk remap (same as the 2.1.1 build)
      shell: bash
      run: |
        set -euo pipefail
        SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SM" ] || SM="$(command -v sdkmanager)"
        "$SM" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
        cat > /tmp/platform.gradle <<'INIT'
        allprojects {
          afterEvaluate { p ->
            def android = p.extensions.findByName('android')
            if (android != null) android.compileSdkVersion('android-37.0')
          }
        }
        INIT
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Test script
      run: |
        cat > /tmp/run-mood.sh <<'RUNMOOD'
        #!/bin/bash
        mkdir -p proof
        timeout -k 20 1200 ./gradlew --init-script /tmp/platform.gradle :app:assembleDevDebug :app:assembleDevDebugAndroidTest --no-daemon --console=plain > /tmp/build.log 2>&1
        echo "BUILD_STATUS=$?" > proof/status.txt
        tail -40 /tmp/build.log | grep -vE "^\s+at |^w: " | cut -c1-300 > proof/build-tail.txt
        APK=$(find app/build/outputs/apk -name "*.apk" -path "*dev*" ! -path "*androidTest*" | head -1)
        TAPK=$(find app/build/outputs/apk/androidTest -name "*.apk" | head -1)
        { echo "app=$APK"; echo "test=$TAPK"; which adb; adb version; adb devices; } > proof/adb-info.txt 2>&1
        timeout -k 5 150 adb install -r -t "$APK" > proof/install.txt 2>&1
        timeout -k 5 150 adb install -r -t "$TAPK" >> proof/install.txt 2>&1
        timeout 30 adb shell pm list instrumentation > proof/instr.txt 2>&1
        RUNNER=$(sed -n 's/^instrumentation:\([^ ]*\) .*/\1/p' proof/instr.txt | grep -i spool | head -1)
        echo "runner=$RUNNER" >> proof/adb-info.txt
        timeout -k 5 480 adb shell am instrument -w -r -e class com.music.bitchord.MoodRegionEmulatorTest "$RUNNER" > proof/instrument.txt 2>&1
        echo "INSTRUMENT_STATUS=$?" >> proof/status.txt
        timeout 30 adb devices >> proof/adb-info.txt 2>&1
        timeout 60 adb pull /data/local/tmp/mood/. proof/ > proof/pull-log.txt 2>&1
        timeout 60 adb logcat -d -v time > /tmp/logcat-full.txt 2>&1
        grep -E "MOOD-PROOF|SHOT-SAVED|FATAL EXCEPTION|AndroidRuntime|am_crash|am_anr|ANR in|Process .* has died|INSTRUMENTATION|TestRunner" /tmp/logcat-full.txt | cut -c1-400 > proof/logcat-mood.txt
        tail -150 /tmp/logcat-full.txt | grep -E " E | F " | cut -c1-250 | tail -60 > proof/logcat-errors-tail.txt
        exit 0
        RUNMOOD
        chmod +x /tmp/run-mood.sh
    - name: Mood region on a real emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_6
        script: /tmp/run-mood.sh
    - name: Publish proof files to a proof branch
      if: always()
      run: |
        ls -la proof || true
        git config user.name spool-ci
        git config user.email spool-ci@users.noreply.github.com
        git checkout --orphan spool-mood-proof
        git rm -rf --cached . > /dev/null 2>&1 || true
        find . -mindepth 1 -maxdepth 1 ! -name proof ! -name .git -exec rm -rf {} + || true
        git add -f proof
        git commit -qm "Emulator proof for ${GITHUB_SHA}"
        git push -f origin spool-mood-proof
# v7
