name: Mood region emulator proof (no APK release)
on:
  workflow_dispatch:
  push:
    branches: [spool-mood-region]
    paths: [".github/workflows/mood-region-emulator.yml", "app/src/androidTest/java/com/music/bitchord/MoodRegionEmulatorTest.kt"]
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Android platform, NDK and compileSdk remap (same as the 2.1.1 build)
      shell: bash
      run: |
        set -euo pipefail
        SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SM" ] || SM="$(command -v sdkmanager)"
        "$SM" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
        cat > /tmp/platform.gradle <<'INIT'
        allprojects {
          afterEvaluate { p ->
            def android = p.extensions.findByName('android')
            if (android != null) android.compileSdkVersion('android-37.0')
          }
        }
        INIT
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Test script
      run: |
        cat > /tmp/run-mood.sh <<'RUNMOOD'
        #!/bin/bash
        mkdir -p proof
        D=/sdcard/Android/data/app.spool.music.dev/files
        timeout 1700 ./gradlew --init-script /tmp/platform.gradle :app:connectedDevDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.MoodRegionEmulatorTest --no-daemon --console=plain > /tmp/emu-gradle.log 2>&1
        echo "GRADLE_STATUS=$?" > proof/status.txt
        sleep 5
        timeout 30 adb devices > proof/adb-devices.txt 2>&1
        timeout 60 adb pull /data/local/tmp/mood/. proof/ > proof/pull-log.txt 2>&1
        timeout 60 adb logcat -d -v time > /tmp/logcat-full.txt 2>&1
        grep -E "MOOD-PROOF|SHOT-SAVED|FATAL EXCEPTION|AndroidRuntime|am_crash|am_anr|ANR in|Process .* has died|INSTRUMENTATION|TestRunner" /tmp/logcat-full.txt > proof/logcat-mood.txt 2>/dev/null
        tail -400 /tmp/emu-gradle.log | grep -vE "^\s+at |^w: " > proof/gradle-tail.txt
        { ls -la /tmp/emu-gradle.log; wc -l /tmp/emu-gradle.log; grep -n -E "FAILED|failed|What went wrong|BUILD|Tests |tests completed|INSTRUMENTATION|Expected|Exception|Killed|OutOfMemory" /tmp/emu-gradle.log | cut -c1-300 | tail -60; echo ---RAWTAIL; tail -40 /tmp/emu-gradle.log | cut -c1-300; echo ---OOM; (dmesg 2>/dev/null || sudo dmesg 2>/dev/null) | grep -i -E "killed process|out of memory" | tail -5; free -m; } > proof/gradle-diagnosis.txt 2>&1
        for x in $(find app/build -name "TEST-*.xml" 2>/dev/null | head -2); do grep -v "^\s*at " "$x" | cut -c1-500 | head -80 > proof/test-result-$(basename $x).txt; done
        tail -150 /tmp/logcat-full.txt | grep -E " E | F " | cut -c1-250 | tail -60 > proof/logcat-errors-tail.txt
        exit 0
        RUNMOOD
        chmod +x /tmp/run-mood.sh
    - name: Mood region on a real emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_6
        script: /tmp/run-mood.sh
    - name: Publish proof files to a proof branch
      if: always()
      run: |
        ls -la proof || true
        git config user.name spool-ci
        git config user.email spool-ci@users.noreply.github.com
        git checkout --orphan spool-mood-proof
        git rm -rf --cached . > /dev/null 2>&1 || true
        find . -mindepth 1 -maxdepth 1 ! -name proof ! -name .git -exec rm -rf {} + || true
        git add -f proof
        git commit -qm "Emulator proof for ${GITHUB_SHA}"
        git push -f origin spool-mood-proof
# v6
