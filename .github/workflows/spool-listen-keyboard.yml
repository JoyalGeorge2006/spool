name: Verify approved Listen search keyboard (no release)
on:
  workflow_dispatch:
  push:
    branches: [spool-song-menu-cleanup]
    paths: [.github/workflows/spool-listen-keyboard.yml]
permissions:
  contents: write
jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact approved one-tap callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('app/src/main/java/com/music/bitchord/MainActivity.kt')
          b=p.read_bytes()
          assert hashlib.sha256(b).hexdigest() == '081acc99f630f44860e4997771fa9e1907ff26527852f26403d907ba136743a8'
          s=b.decode()
          old='onSearchClick = { selectedTab = TAB_SEARCH },'
          new='onSearchClick = { searchFocusRequested = true; selectedTab = TAB_SEARCH },'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          import base64
          Path('app/src/androidTest/java/com/music/bitchord/ListenSearchKeyboardTest.kt').write_bytes(base64.b64decode(''))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/music/bitchord/MainActivity.kt app/src/androidTest/java/com/music/bitchord/ListenSearchKeyboardTest.kt
          git commit -m 'Connect Listen search tap to existing one-shot keyboard focus'
          git push origin HEAD:spool-song-menu-cleanup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          cat > /tmp/platform.gradle <<'INIT'
          allprojects { afterEvaluate { p -> def a = p.extensions.findByName('android'); if(a != null) a.compileSdkVersion('android-37.0') } }
          INIT
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            ./gradlew --init-script /tmp/platform.gradle :app:connectedDevDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.ListenSearchKeyboardTest --no-daemon --stacktrace
      - name: Retain actual screen evidence
        if: always()
        run: |
          mkdir -p keyboard-screens
          adb pull /sdcard/Android/data/app.spool.music.dev/files/. keyboard-screens/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listen-search-keyboard-proof
          path: |
            keyboard-screens/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
