    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare platform and native dependency
      shell: bash
      run: |
        set -euo pipefail
        sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
        cat > /tmp/platform.gradle <<'INIT'
        allprojects {
          afterEvaluate { p ->
            def android = p.extensions.findByName('android')
            if (android != null) android.compileSdkVersion('android-37.0')
          }
        }
        INIT
        curl -fL -o /tmp/lame.tar.gz https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
        mkdir -p "$SRC_DIR/native/lame"
        tar xzf /tmp/lame.tar.gz -C "$SRC_DIR/native/lame" --strip-components=1
    - name: Restore persisted signing key, fail closed on missing secrets
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        cd "$SRC_DIR"
        test -n "$SPOOL_DEBUG_KEYSTORE_B64"
        test -n "$SPOOL_DEBUG_STORE_PASSWORD"
        test -n "$SPOOL_DEBUG_KEY_PASSWORD"
        printf '%s' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore
        chmod 600 spool-debug.keystore
        keytool -list -keystore spool-debug.keystore -storepass "$SPOOL_DEBUG_STORE_PASSWORD" -alias spooldebug | grep -qi spooldebug
        {
          echo 'storeFile=spool-debug.keystore'
          echo "storePassword=$SPOOL_DEBUG_STORE_PASSWORD"
          echo 'keyAlias=spooldebug'
          echo "keyPassword=$SPOOL_DEBUG_KEY_PASSWORD"
        } > keystore.properties
        chmod 600 keystore.properties
    - name: Build signed R8 production APKs, no release or publication
      id: compile
      run: |
        set -euo pipefail
        cd "$SRC_DIR"
        test "$(grep -c 'SEPARATELY_PROVIDED_UPDATES", "false"' app/build.gradle.kts)" -eq 2
        ./gradlew --init-script /tmp/platform.gradle :app:assembleProdRelease -Pbitchord.bundleWear=false
    - name: Verify all APK package/version/signatures and preserve exact source
      id: verify
      run: |
        set -euo pipefail
        cd "$SRC_DIR"
        mkdir -p "$RUNNER_TEMP/apk-out" "$RUNNER_TEMP/source-out"
        cp app/build/outputs/apk/prod/release/*-arm64-v8a-release.apk "$RUNNER_TEMP/apk-out/Spool-2.1.1-arm64-v8a.apk"
        cp app/build/outputs/apk/prod/release/*-universal-release.apk "$RUNNER_TEMP/apk-out/Spool-2.1.1-universal.apk"
        aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
        signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
        for apk in "$RUNNER_TEMP/apk-out/"*.apk; do
          "$aapt" dump badging "$apk" > /tmp/badging.txt
          grep -q "package: name='app.spool.music'" /tmp/badging.txt
          grep -q "versionCode='58'" /tmp/badging.txt
          grep -q "versionName='2.1.1'" /tmp/badging.txt
          "$signer" verify --verbose --print-certs "$apk" > /tmp/certs.txt
          grep -qi 'a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee' /tmp/certs.txt
          cp /tmp/badging.txt "$apk.badging.txt"
          cp /tmp/certs.txt "$apk.certs.txt"
        done
        git archive --format=tar --prefix=spool-v2.1.1-source/ fe206e9944efc644f593c1149152d31b57b510fa | gzip -n > "$RUNNER_TEMP/source-out/spool-v2.1.1-source.tar.gz"
        sha256sum "$RUNNER_TEMP/apk-out/"*.apk "$RUNNER_TEMP/source-out/"*.tar.gz | tee "$RUNNER_TEMP/apk-out/SHA256SUMS.txt"
    - name: Download and verify the published 2.1.0 universal for upgrade test
      run: |
        set -euo pipefail
        curl -fL -o "$RUNNER_TEMP/spool-v2.1.0.apk" https://github.com/JoyalGeorge2006/spool/releases/download/v2.1.0-theme-preview/Spool-2.1.0-universal.apk
        echo '4a5993dc5cd3947c1f11ecc4bf1da1796e2db1c98ea539be924f0399b21da933  '"$RUNNER_TEMP/spool-v2.1.0.apk" | sha256sum -c -
