name: OTA workflow_call gate integration test

# Temporary integration test for the publisher wiring: invokes the OTA delta
# patch publisher exactly the way a release publisher's final gating job does
# (workflow_call with an explicit release_tag). Success proves the call
# mechanism, the input plumbing and the patch-verification gate all work
# against a live release without creating any release or APK. Deleted after
# the passing run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-deltas:
    uses: ./.github/workflows/ota-delta-publish.yml
    with:
      release_tag: v2.1.1
