name: Verify selected Spark rating motion (no release)
on:
  push:
    branches: [spool-song-menu-cleanup]
    paths: [.github/workflows/spool-spark-motion.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved presentation-only change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,gzip
          p=Path('app/src/main/java/com/music/bitchord/ui/components/SongActionsMenu.kt')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'b2ef6c7ddbcf7052ead951942cbfe17b18d1a7aefe28526c15fa7b4efa00b09f'
          Path('app/src/main/java/com/music/bitchord/ui/components/SongActionsMenu.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          Path('app/src/main/java/com/music/bitchord/ui/components/SparkRatingAction.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          Path('app/src/main/res/values/spark_rating.xml').write_bytes(gzip.decompress(base64.b64decode('H4sIAGwhBGsC/7MpSi3OLy1KTi2241IAApvikqLMvHSFvMTcVFul4oLEouz4nMzs1BQlOx8QZaMPUYBbdUpmMVSDC5SF0GOjj2QdAFmpvMN7AAAA')))
          Path('app/src/test/java/com/music/bitchord/SparkRatingMotionTest.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/music/bitchord/ui/components/SongActionsMenu.kt app/src/main/java/com/music/bitchord/ui/components/SparkRatingAction.kt app/src/main/res/values/spark_rating.xml app/src/test/java/com/music/bitchord/SparkRatingMotionTest.kt
          git commit -m 'Add selected Spark Burst rating presentation with single icon and label'
          git push origin HEAD:spool-song-menu-cleanup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          cat > /tmp/platform.gradle <<'INIT'
          allprojects { afterEvaluate { p -> def a = p.extensions.findByName('android'); if(a != null) a.compileSdkVersion('android-37.0') } }
          INIT
      - name: Render actual Compose motion frames and regressions
        run: |
          ./gradlew --init-script /tmp/platform.gradle :app:testDevDebugUnitTest --tests com.music.bitchord.SparkRatingMotionTest --tests com.music.bitchord.OverflowScrollScreenshotTest --tests com.music.bitchord.DislikeSkipPolicyTest --tests com.music.bitchord.FloatingSearchFlowTest --no-daemon --stacktrace 2>&1 | tee motion-test.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-motion-proof
          path: |
            **/build/outputs/roborazzi/
            **/build/test-results/
            **/build/reports/tests/
            motion-test.log
