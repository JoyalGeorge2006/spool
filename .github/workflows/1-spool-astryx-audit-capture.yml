name: Spool Astryx audit - frozen v75 screenshots only
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
        - group: 1
          cases: IntegratedRootHeaderScreenshotTest StationArtworkScreenshotTest HeaderControlsScreenshotTest RootInsetContractTest
        - group: 2
          cases: SettingsLargeTextAuditTest AccountSettingsScreenshotTest AboutDeveloperScreenshotTest
        - group: 3
          cases: SettingsSecondaryViewportTest SettingsTertiaryViewportTest RemainingMobileDestinationTest
        - group: 4
          cases: BroadRouteScreenshotTest BroadDialogScreenshotTest ReplayAuditScreenshotTest
        - group: 5
          cases: PlayerGesturePagingTest_dark PlayerGesturePagingTest_light PlayerGesturePagingTest_large PlayerGesturePagingTest_reduced PlayerGestureCollapseTest_main PlayerGestureCollapseTest_header PlayerGestureMenuUndoTest LandscapePlayerFrameTest
        - group: 6
          cases: V6ScreenshotTest.onboarding_light V6ScreenshotTest.onboarding_dark V6ScreenshotTest.party_landing_light V6ScreenshotTest.party_landing_dark V6ScreenshotTest.settings_wear_os_light V6ScreenshotTest.settings_wear_os_dark V6ScreenshotTest.import_dialog_light V6ScreenshotTest.import_dialog_dark
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Restore byte-verified frozen v75 source
      id: source
      run: 'set -euo pipefail

        git fetch origin 9f40c70e614d4e4d978d58295f59ab12ee07b493

        git checkout FETCH_HEAD -- . '':!.github''

        test "$(git rev-parse FETCH_HEAD)" = 9f40c70e614d4e4d978d58295f59ab12ee07b493

        python3 - <<''PATCH''

        import base64,lzma

        open(''/tmp/frozen-v75.patch'',''wb'').write(lzma.decompress(base64.b64decode('''')))

        PATCH

        echo "b41c138b5d63507ee7fc1d16032f6c94e3d6d06de1fb8dafb327eb6f17d21bb5  /tmp/frozen-v75.patch" | sha256sum -c -

        git apply --check /tmp/frozen-v75.patch

        git apply /tmp/frozen-v75.patch

        git diff --stat > /tmp/frozen-diff-stat.txt

        curl -fLsS -o /tmp/lame.tar.gz https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz

        mkdir -p native/lame

        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

        '
    - name: Prepare checks
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Render actual current components only - NO APK
      run: "set -euo pipefail\nchmod +x gradlew\ncat > /tmp/audit-isolation.gradle <<'INIT'\nallprojects { tasks.withType(Test).configureEach { forkEvery = 1; maxParallelForks = 1 } }\nINIT\nmkdir -p verification\nstatus=0\nfor case in ${{ matrix.cases }}; do\n  timeout --signal=TERM --kill-after=30s 12m ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false -I /tmp/audit-isolation.gradle --tests \"com.music.bitchord.$case\" > \"verification/$case.log\" 2>&1 || status=1\n  tail -15 \"verification/$case.log\"\n  mkdir -p \"verification/$case\"\n  cp -R app/build/test-results \"verification/$case/\" || true\ndone\nexit \"$status\"\n"
    - name: Upload audit evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spool-astryx-current-v75-${{ matrix.group }}
        path: 'verification

          app/build/outputs/roborazzi

          /tmp/frozen-diff-stat.txt'
        if-no-files-found: error
        retention-days: 7
