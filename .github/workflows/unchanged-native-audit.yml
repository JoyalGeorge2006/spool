name: Unchanged v72 offline routes and trace corrected native selectors
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
    - name: Download unchanged verified candidate and archived CI seed
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh run download 43931709128 -n raw-apk-splits -D "$RUNNER_TEMP/target" --repo JoyalGeorge2006/spool
        cp "$RUNNER_TEMP/target"/*-x86_64-debug.apk "$RUNNER_TEMP/target.apk"
        echo 'f017bda8850ce374266634a501d01462852861bf6b8f1c04c13e92374d91dcfb  '"$RUNNER_TEMP/target.apk" | sha256sum -c -
        gh run download 43891330383 -n upgrade-evidence -D "$RUNNER_TEMP/seed" --repo JoyalGeorge2006/spool
        seed=$(find "$RUNNER_TEMP/seed" -name before.tar -type f | head -1)
        cp "$seed" "$RUNNER_TEMP/archived-seed.tar"
        echo '100ad5fe1977f765db7ecaaeba6e0ba427256152d4f6b9e4a5d5ead41cc785ac  '"$RUNNER_TEMP/archived-seed.tar" | sha256sum -c -
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Offline native routes, no app rebuild or provider sign-in
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_6
        ram-size: 2048M
        heap-size: 256M
        disk-size: 4096M
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader -camera-back none -no-snapshot -memory 2048 -cores 2
        force-avd-creation: true
        script: |
          adb install -r "$RUNNER_TEMP/target.apk"
          adb shell am force-stop app.spool.music
          adb exec-in run-as app.spool.music tar xf - < "$RUNNER_TEMP/archived-seed.tar"
          echo  |echo  | base64 -d > /tmp/bounded-native.py
          python3 /tmp/bounded-native.py
    - name: Save diagnostic evidence regardless of outcomes
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unchanged-v72-bounded-native
        path: |
          ${{ runner.temp }}/bounded/
          /tmp/android-runner/
