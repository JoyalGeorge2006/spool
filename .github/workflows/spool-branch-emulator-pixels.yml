      run: |
        set -euo pipefail
        mkdir -p remaining10-evidence
        ./gradlew --init-script /tmp/platform.gradle --init-script /tmp/no-heavy-recompile.gradle :app:assembleDevDebug :app:assembleDevDebugAndroidTest --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true' -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee remaining10-evidence/prebuild.log
        python3 - <<'PYTHON'
        import datetime
        import json
        import pathlib
        import subprocess
        import time


        def await_shutdown(read_processes, monotonic, sleep, emit, timeout=60, interval=1):
            started = monotonic()
            while True:
                try:
                    text = read_processes()
                except Exception as error:
                    emit({'timestamp_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                          'elapsed_seconds': round(monotonic() - started, 3),
                          'error': type(error).__name__ + ': ' + str(error)})
                    raise
                remaining = [line for line in text.splitlines()
                             if 'java' in line and ('GradleDaemon' in line or 'KotlinCompileDaemon' in line)]
                elapsed = monotonic() - started
                emit({'timestamp_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      'elapsed_seconds': round(elapsed, 3), 'remaining': remaining})
                if not remaining:
                    return
                if elapsed >= timeout:
                    raise RuntimeError('Build daemons still present after bounded shutdown grace')
                sleep(min(interval, timeout - elapsed))


        if __name__ == '__main__':
            path = pathlib.Path('remaining10-evidence/build-daemon-shutdown.jsonl')
            path.parent.mkdir(parents=True, exist_ok=True)
            with path.open('w', encoding='utf-8', buffering=1) as evidence:
                def emit(row):
                    line = json.dumps(row, sort_keys=True)
                    evidence.write(line + '\n')
                    print('BUILD-DAEMON-SNAPSHOT ' + line, flush=True)
                def read_processes():
                    return subprocess.check_output(['ps', '-eo', 'pid,comm,rss,stat,args'], text=True, timeout=5)
                await_shutdown(read_processes, time.monotonic, time.sleep, emit)
        PYTHON
