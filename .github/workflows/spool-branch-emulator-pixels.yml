        #!/usr/bin/env python3
        """One supported direct AndroidJUnitRunner invocation of immutable prebuilt APKs."""
        import hashlib,importlib.util,json,os,re,signal,subprocess,sys,time
        import xml.etree.ElementTree as ET
        from pathlib import Path
        
        PKG='app.spool.music.dev';TEST=PKG+'.test';ADB=['adb','-s','emulator-5554']
        OUT=Path('app/build/outputs/androidTest-results/direct');OUT.mkdir(parents=True,exist_ok=False)
        DIAG=Path('emulator-diagnostics');DIAG.mkdir(exist_ok=True)
        SDK=Path(os.environ['ANDROID_HOME']);BT=SDK/'build-tools/35.0.0'
        NAMESPACE='{http://schemas.android.com/apk/res/android}'
        process=None;logcat=None;status=1;failure=None
        
        def sha(p):
            h=hashlib.sha256()
            with Path(p).open('rb') as f:
                for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
            return h.hexdigest()
        
        def run(args,name,timeout=60,allow_absent=False):
            # Commands contain only fixed arguments or validated metadata paths.
            with (DIAG/(name+'.txt')).open('wb') as f:
                p=subprocess.Popen([str(x) for x in args],stdout=f,stderr=subprocess.STDOUT)
                try:p.wait(timeout=timeout)
                except BaseException:
                    p.kill();p.wait(timeout=5);raise
            b=(DIAG/(name+'.txt')).read_bytes()
            assert len(b)<=8*1024*1024,'Command output cap exceeded'
            if allow_absent:
                assert p.returncode in (0,1) and not b.strip(),'Package unexpectedly installed or absence probe failed'
            else:assert p.returncode==0,(name,p.returncode,b[-1000:])
            return b
        
        def installed_identity(package,apk,label):
            lines=run(ADB+['shell','pm','path',package],label+'-installed-path').decode().splitlines()
            assert len(lines)==1 and re.fullmatch(r'package:/data/app/[A-Za-z0-9_./=+~-]+/base\.apk',lines[0]),lines
            path=lines[0][8:];copy=Path('/tmp')/('spool-'+label+'-installed.apk')
            try:
                run(ADB+['pull',path,copy],label+'-installed-pull',120)
                assert sha(copy)==sha(apk),'Installed APK bytes differ from selected metadata APK'
                return {'package':package,'device_path':path,'sha256':sha(copy)}
            finally:
                if copy.exists():copy.unlink()
        
        def on_signal(sig,frame):raise KeyboardInterrupt('Direct runner canceled by signal '+str(sig))
        for sig in (signal.SIGTERM,signal.SIGINT):signal.signal(sig,on_signal)
        
        try:
            assert run(ADB+['shell','getprop','ro.product.cpu.abi'],'device-abi').decode().strip()=='x86_64'
            appdir=Path('app/build/outputs/apk/dev/debug');testdir=Path('app/build/outputs/apk/androidTest/dev/debug')
            appmeta=json.loads((appdir/'output-metadata.json').read_text());testmeta=json.loads((testdir/'output-metadata.json').read_text())
            assert (appmeta['applicationId'],appmeta['variantName'])==(PKG,'devDebug')
            assert (testmeta['applicationId'],testmeta['variantName'])==(TEST,'devDebugAndroidTest')
            apps=[e for e in appmeta['elements'] if e['filters']==[{'filterType':'ABI','value':'x86_64'}]]
            assert len(apps)==1 and len(testmeta['elements'])==1
            app=appdir/apps[0]['outputFile'];test=testdir/testmeta['elements'][0]['outputFile']
            validated=json.loads((Path('remaining10-evidence')/os.environ['SPOOL_SHARD']/'inventory-before/validated.json').read_text())['apks']
            assert validated[str(app)]==sha(app) and validated[str(test)]==sha(test)
            for package,apk,label in [(PKG,app,'app'),(TEST,test,'test')]:
                b=run([BT/'aapt','dump','badging',apk],label+'-badging')
                assert re.search(rb"^package: name='"+package.encode()+rb"' ",b,re.M)
                manifest=ET.fromstring(run([SDK/'cmdline-tools/latest/bin/apkanalyzer','manifest','print',apk],label+'-manifest',120))
                assert manifest.attrib['package']==package
                if label=='app':
                    assert int(manifest.attrib[NAMESPACE+'versionCode'])==int(apps[0]['versionCode'])
                    assert manifest.attrib[NAMESPACE+'versionName']==apps[0]['versionName']
                    assert set(re.findall(rb"'([^']+)'",re.search(rb'^native-code: (.+)$',b,re.M)[1]))=={b'x86_64'}
                else:
                    entries=manifest.findall('instrumentation');assert len(entries)==1
                    assert entries[0].attrib[NAMESPACE+'targetPackage']==PKG
                    assert entries[0].attrib[NAMESPACE+'name']=='androidx.test.runner.AndroidJUnitRunner'
            runner=TEST+'/androidx.test.runner.AndroidJUnitRunner'
            certs=[]
            for apk,label in [(app,'app'),(test,'test')]:
                b=run([BT/'apksigner','verify','--print-certs',apk],label+'-signer',120)
                c=re.findall(rb'^Signer #\d+ certificate SHA-256 digest: ([0-9a-f]{64})$',b,re.M);assert len(c)==1;certs.append(c[0])
            assert certs[0]==certs[1],'App and test signer mismatch'
            for package,apk,label in [(PKG,app,'app'),(TEST,test,'test')]:
                run(ADB+['shell','pm','path',package],label+'-fresh-absence',allow_absent=True)
                assert b'Success' in run(ADB+['install','-t',apk],label+'-install',180)
            identities=[installed_identity(PKG,app,'app'),installed_identity(TEST,test,'test')]
            registrations=run(ADB+['shell','pm','list','instrumentation'],'instrumentation-registration').decode().splitlines()
            assert registrations==['instrumentation:'+runner+' (target='+PKG+')'],registrations
            (DIAG/'direct-installed-identity.json').write_text(json.dumps({'runner':runner,'installed':identities,'cert':certs[0].decode()},indent=2))
            run(ADB+['logcat','-c'],'clear-logcat')
            with (OUT/'logcat-direct.txt').open('wb') as log, (DIAG/'raw-instrumentation.txt').open('wb') as raw:
                logcat=subprocess.Popen(ADB+['logcat','-v','threadtime'],stdout=log,stderr=subprocess.STDOUT)
                process=subprocess.Popen(ADB+['shell','am','instrument','-w','-r','-e','class',os.environ['SPOOL_CASE_SELECTORS'],runner],stdout=raw,stderr=subprocess.STDOUT)
                deadline=time.monotonic()+1800
                while process.poll() is None:
                    assert time.monotonic()<deadline,'Direct instrumentation safety timeout1800s'
                    assert (DIAG/'raw-instrumentation.txt').stat().st_size<=16*1024*1024,'Raw status output cap exceeded'
                    assert (OUT/'logcat-direct.txt').stat().st_size<=64*1024*1024,'Logcat cap exceeded'
                    assert logcat.poll() is None,'Continuous logcat collector exited before instrumentation'
                    time.sleep(.1)
                status=process.returncode
            assert status==0,'adb instrumentation command failed'
            spec=importlib.util.spec_from_file_location('raw_results','/tmp/raw-results.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
            m.reconcile((DIAG/'raw-instrumentation.txt').read_bytes(),os.environ['SPOOL_CASE_SELECTORS'],OUT)
            # Verify the executed application and test packages are still those installed.
            after=[installed_identity(PKG,app,'app-after'),installed_identity(TEST,test,'test-after')]
            assert [x['sha256'] for x in after]==[x['sha256'] for x in identities]
            (DIAG/'direct-installed-after.json').write_text(json.dumps(after,indent=2))
            status=0
        except BaseException as error:
            failure=repr(error);status=1
        finally:
            for child in [process,logcat]:
                if child is not None and child.poll() is None:
                    child.terminate()
                    try:child.wait(timeout=5)
                    except subprocess.TimeoutExpired:child.kill();child.wait(timeout=5)
            # Leave APKs/files installed for the shared screenshot drain and diagnostics.
            # No pm clear/uninstall can erase a failing case's evidence.
            for package in [PKG,TEST]:
                try:run(ADB+['shell','am','force-stop',package],package+'-cleanup-stop',10)
                except BaseException as error:failure=(failure or '')+' cleanup '+repr(error);status=1
            (DIAG/'direct-exit.json').write_text(json.dumps({'status':status,'failure':failure,'raw':'raw-instrumentation.txt','derived_xml':'app/build/outputs/androidTest-results/direct/TEST-direct-runner.xml'},indent=2))
        sys.exit(status)
        DIRECT_REVIEWED_SCRIPT
        cat > /tmp/raw-results.py <<'DIRECT_REVIEWED_SCRIPT'
        """Strict AndroidJUnitRunner raw status reconciliation. No inferred test passes."""
        import hashlib,json,re
        import xml.etree.ElementTree as ET
        from pathlib import Path
        
        
        def reconcile(raw, selectors, destination):
            destination=Path(destination);destination.mkdir(parents=True,exist_ok=True)
            expected=selectors.split(',')
            assert expected and len(expected)==len(set(expected))
            assert all(re.fullmatch(r'com\.music\.bitchord\.StatusStripEmulatorTest#[A-Za-z0-9_]+',x) for x in expected)
            starts=[];finished=[];events=[];fields={};final=[];errors=[]
            for line in raw.decode('utf-8',errors='strict').splitlines():
                if line.startswith('INSTRUMENTATION_STATUS: '):
                    key,sep,value=line[len('INSTRUMENTATION_STATUS: '):].partition('=')
                    if not sep:errors.append('Malformed status field');continue
                    if key in fields:errors.append('Duplicate field in one status block: '+key)
                    fields[key]=value
                elif line.startswith('INSTRUMENTATION_STATUS_CODE: '):
                    try:
                        code=int(line.split(': ',1)[1]);event={**fields,'code':code};events.append(event)
                        identity=fields['class']+'#'+fields['test']
                        assert fields['id']=='AndroidJUnitRunner'
                        assert identity in expected
                        assert int(fields['numtests'])==len(expected)
                        current=int(fields['current']);assert 1<=current<=len(expected)
                        if code==1:
                            assert identity not in starts and identity not in finished
                            assert current==len(starts)+1 and len(starts)==len(finished)
                            starts.append(identity)
                        elif code==0:
                            assert starts and starts[-1]==identity and identity not in finished
                            assert current==len(finished)+1
                            assert 'stack' not in fields
                            finished.append(identity)
                        else:raise AssertionError('Non-pass terminal status '+str(code))
                    except Exception as error:errors.append(type(error).__name__+': '+str(error))
                    fields={}
                elif line.startswith('INSTRUMENTATION_CODE: '):
                    try:final.append(int(line.split(': ',1)[1]))
                    except ValueError:errors.append('Malformed final code')
                elif line.startswith('INSTRUMENTATION_FAILED:') or line.startswith('INSTRUMENTATION_ABORTED:'):
                    errors.append(line)
            if fields:errors.append('Unterminated status fields')
            if final!=[-1]:errors.append('Missing/duplicate/non-OK final Android result code')
            if set(starts)!=set(expected) or set(finished)!=set(expected) or len(starts)!=len(expected) or len(finished)!=len(expected):errors.append('Missing/extra/duplicate/zero test records')
            summaries=re.findall(rb'^OK \((\d+) tests?\)\s*$',raw,re.M)
            if summaries!=[str(len(expected)).encode()]:errors.append('Missing/duplicate/wrong runner summary')
            if re.search(rb'FAILURES!!!|Process crashed|INSTRUMENTATION_RESULT: (?:shortMsg|longMsg)=',raw):errors.append('Runner failure/crash evidence')
            report={'provenance':'Derived only from exact AndroidJUnitRunner raw START+PASS status records and final summary, not Gradle XML',
                    'raw_sha256':hashlib.sha256(raw).hexdigest(),'expected':expected,'starts':starts,'passes':finished,'events':events,'errors':errors,'pass':not errors}
            (destination/'raw-runner-reconciliation.json').write_text(json.dumps(report,indent=2))
            assert not errors,errors
            suite=ET.Element('testsuite',name='direct-AndroidJUnitRunner',tests=str(len(finished)),failures='0',errors='0',skipped='0')
            properties=ET.SubElement(suite,'properties')
            ET.SubElement(properties,'property',name='raw_sha256',value=report['raw_sha256'])
            ET.SubElement(properties,'property',name='result_provenance',value=report['provenance'])
            for identity in finished:
                cls,name=identity.split('#');ET.SubElement(suite,'testcase',classname=cls,name=name)
            ET.ElementTree(suite).write(destination/'TEST-direct-runner.xml',encoding='utf-8',xml_declaration=True)
            return report
        DIRECT_REVIEWED_SCRIPT
        cat > /tmp/no-heavy-recompile.gradle <<'REVIEWED_SCRIPT'
        import groovy.json.JsonOutput

        // AGP8.10.1 TaskManager.assetGenTask + TaskFactoryImpl.register(name)
        // create these five selected graph anchors without actions. No other task is
        // exempted based on a prefix, project, task type or its observed action count.
        def sourceProvenAssetAnchors = [
            ':wearos:generateDevDebugAssets',
            ':app:generateDevDebugAssets',
            ':shared:generateDebugAssets',
            ':sharedUi:generateDebugAssets',
            ':app:generateDevDebugAndroidTestAssets',
        ] as Set

        def heavyName = { t ->
            def n = t.name.toLowerCase(java.util.Locale.ROOT)
            n.contains('compile') || n.contains('dex') || n.contains('package') || n.contains('cmake') || n.startsWith('merge') || n.startsWith('strip') || n.startsWith('generate') || n.startsWith('process')
        }

        gradle.taskGraph.whenReady { graph ->
            // Snapshot after configuration, before adding any guard action. This is
            // original task action evidence, not an inventory of our own doFirst hooks.
            def selected = graph.allTasks.findAll { heavyName(it) }
            def inventory = selected.collect { t ->
                [path: t.path, type: t.class.name,
                 originalActionCount: t.actions.size(),
                 originalActionTypes: t.actions.collect { it.class.name },
                 sourceProvenActionlessAnchor: sourceProvenAssetAnchors.contains(t.path)]
            }
            def evidence = new File(gradle.rootProject.projectDir, 'remaining10-evidence')
            evidence.mkdirs()
            def phase = gradle.rootProject.findProperty('spool.requirePrebuilt') == 'true' ? 'connected' : 'prebuild'
            new File(evidence, "task-action-inventory-${phase}.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(inventory))
            def invalidAnchors = selected.findAll { t ->
                sourceProvenAssetAnchors.contains(t.path) &&
                    (!(t instanceof org.gradle.api.DefaultTask) || !t.actions.empty)
            }
            if (!invalidAnchors.empty) throw new GradleException('SOURCE-PROVEN-ANCHOR-HAS-UNEXPECTED-ACTIONS: ' + invalidAnchors.collect { it.path })
            selected.findAll { !sourceProvenAssetAnchors.contains(it.path) }.each { t ->
                // Original heavy action guard, unchanged for every other selected task.
                t.doFirst {
                    if (project.findProperty('spool.requirePrebuilt') == 'true') throw new GradleException('UNEXPECTED-HEAVY-ACTION before instrumentation: ' + t.path + '; prebuilt task must be UP-TO-DATE or NO-SOURCE')
                }
            }
        }

        // Recheck immediately before execution too. Do not attach a task action to an
        // actionless anchor, which would itself make the anchor execute every time.
        gradle.taskGraph.beforeTask { t ->
            if (sourceProvenAssetAnchors.contains(t.path) &&
                (!(t instanceof org.gradle.api.DefaultTask) || !t.actions.empty)) {
                throw new GradleException('SOURCE-PROVEN-ANCHOR-GAINED-UNEXPECTED-ACTIONS: ' + t.path)
            }
        }
        REVIEWED_SCRIPT
