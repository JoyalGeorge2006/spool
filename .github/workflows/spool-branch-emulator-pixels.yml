        #!/usr/bin/env python3
        import json,sys
        from pathlib import Path
        EXPECTED={'connections': ['finalMoodRowPhysicalTapReachability']}
        root=Path(sys.argv[1]);report={};all_actual=[];ok=True
        for shard,names in EXPECTED.items():
            results=list(root.rglob(shard+'/exact-selector-result.json'));statuses=list(root.rglob(shard+'/wrapper-exit.json'));retentions=list(root.rglob(shard+'/emulator-diagnostics/full24-reconciliation.json'))
            entry={'result_files':len(results),'status_files':len(statuses),'retention_files':len(retentions)}
            good=len(results)==len(statuses)==len(retentions)==1
            try:
                if good:
                    r=json.loads(results[0].read_text());s=json.loads(statuses[0].read_text());t=json.loads(retentions[0].read_text());all_actual.extend(t['name'] for t in r['actual'])
                    good=len(r['actual'])==len(names) and {t['name'] for t in r['actual']}==set(names) and all(t['classname']=='com.music.bitchord.StatusStripEmulatorTest' for t in r['actual']) and r['failures']==r['errors']==r['skips']==0 and s['same_apks'] and s['test_and_retention_status']==0 and t['retention_status']==t['test_status']==0
                    entry.update(result=r,status=s,retention_status=t['retention_status'],retained=len(t['retained']),pixel_scope=t.get('pixel_scope'))
            except BaseException as e:
                good=False;entry['failure']=repr(e)
            entry['pass']=good;ok=ok and good;report[shard]=entry
        expected=sum(EXPECTED.values(),[]);ok=ok and len(all_actual)==len(expected) and set(all_actual)==set(expected)
        report['aggregate']={'pass':ok,'expected':expected,'actual':all_actual,'missing':sorted(set(expected)-set(all_actual)),'duplicates':sorted({n for n in all_actual if all_actual.count(n)>1})}
        Path('remaining-ten-aggregate.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2));sys.exit(0 if ok else 1)
