name: Disposable one-tap updater Android fixture, no distribution
# Branch-only fixture cycle. No default branch or publisher changes.
on:
  push:
    branches: [taste-aware-moods]
    paths: ['.github/workflows/spool-branch-emulator-pixels.yml']
permissions:
  contents: read
jobs:
  updater-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e290e8c945cc51d744445ebffb3cdf6c483eff17
          path: product
      - uses: actions/checkout@v4
        with:
          ref: 060cbf34bd90c451082b9277158c9f424ab93da9
          path: fixture-source
      - name: Select exact reviewed fixture source
        shell: bash
        run: |
          set -euo pipefail
          cp -r fixture-source/tools/updater-fixture fixture-src
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Prepare platform and KVM
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build isolated same-key fixtures, no upload
        shell: bash
        run: |
          set -euo pipefail
          test -f fixture-src/fixture-host.py
          python3 fixture-src/fixture-host.py build "$PWD/product" "$PWD/local-fixture"
      - name: Bounded real system UI cases
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: python3 fixture-src/fixture-host.py device "$PWD/product" "$PWD/local-fixture"
      - name: Upload evidence only, never APKs or delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-real-android-evidence
          path: |
            local-fixture/**/*.txt
            local-fixture/**/*.log
            local-fixture/**/*.json
            local-fixture/**/*.png
          if-no-files-found: warn
