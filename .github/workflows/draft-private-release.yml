name: spool draft private release (not public)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID carrying the spool-final-apk artifact'
        required: true
        default: '43786851121'
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download final APK artifact
      uses: actions/download-artifact@v4
      with:
        name: spool-final-apk
        run-id: ${{ inputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: /tmp/apk
    - name: Download launch evidence artifact
      uses: actions/download-artifact@v4
      with:
        name: prod-launch-evidence
        run-id: ${{ inputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: /tmp/evidence
    - name: Create draft release with the arm64 APK
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        apk=$(find /tmp/apk -name 'spool.apk' -print -quit)
        test -n "$apk"
        sha256sum "$apk" | tee /tmp/sha.txt
        grep -q c7d3e9ada9e2848bee0ee32089545423b11255f09d035f8016fdd083151dbb5c /tmp/sha.txt
        tag="v6-separate-$(date -u +%Y%m%d-%H%M%S)"
        gh release create "$tag" \
          --repo JoyalGeorge2006/spool \
          --draft \
          --title "spool private build (draft, not public)" \
          --notes "Private draft for direct install alongside the existing app. Package app.spool.music, arm64, signed with the persisted spool debug key. In-app updater disabled in this build; updates arrive as separately provided APKs." \
          "$apk"
    - name: Emit launch screenshot for out-of-band review
      run: |
        set -euo pipefail
        png=$(find /tmp/evidence -name '*.png' -print -quit)
        test -n "$png"
        echo 'LAUNCH_PNG_SHA256:'
        sha256sum "$png"
        echo 'LAUNCH_PNG_B64_BEGIN'
        base64 "$png"
        echo 'LAUNCH_PNG_B64_END'
