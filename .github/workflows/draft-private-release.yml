name: spool private ARM64 test APK (draft only)
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download final APK artifact
      uses: actions/download-artifact@v4
      with:
        name: spool-final-apk
        run-id: ${{ inputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: /tmp/apk
    - name: Create draft release with the arm64 APK
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\napk=$(find /tmp/apk -name 'spool.apk' -print -quit)\ntest -n \"$apk\"\nsha256sum \"$apk\" | tee /tmp/sha.txt\ngrep -q 6e2b52e2cd80950ef9d8ed475271cc4d26145c2eca28b3449ff316f1f270e089 /tmp/sha.txt\ncp \"$apk\" /tmp/Spool-Pixel-ARM64-test-v53.apk\ntag=\"private-test-v53-$(date -u +%Y%m%d-%H%M%S)\"\ngh release create \"$tag\" \\\n  --repo JoyalGeorge2006/spool \\\n  --draft \\\n  --title \"Spool Pixel ARM64 test v53 (private draft)\" \\\n  --notes \"Interim test build, not final. ARM64 only for Pixel. Package app.spool.music 1.9.2 code40, persisted signer matches original delivered code39. Install as update, never uninstall or clear data. Lyrics first-glyph clipping remains. Online Song/Video switching, live Google sign-in, full-page review and performance acceptance incomplete. Source candidate run43907358215. Same-source seeded emulator upgrade retained15files and saved settings; not phone data proof. No public release.\" \\\n  /tmp/Spool-Pixel-ARM64-test-v53.apk\n"
'on':
  workflow_dispatch:
    inputs:
      run_id:
        description: Run ID carrying the spool-final-apk artifact
        required: true
        default: '43907358215'
