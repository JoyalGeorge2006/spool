name: Approved mobile v74 private draft delivery only
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download final APK artifact
      uses: actions/download-artifact@v4
      with:
        name: spool-mobile-audio-only-test-v74
        run-id: '44066523740'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: /tmp/apk
    - name: Create separate private draft and upload verified mobile APK
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\napk=$(find /tmp/apk -name spool.apk -print -quit)\n\
        test -n \"$apk\"\necho \"a555e20bec2b6fe9c845137ed2b8f41a12c3877419af611bf9b1b11108779685\
        \  $apk\" | sha256sum -c -\ntag=spool-mobile-audio-test-v74-20261117\nif gh\
        \ release view \"$tag\" --repo JoyalGeorge2006/spool --json isDraft >/tmp/existing.json\
        \ 2>/tmp/existing.err; then\n  echo \"::error::Draft tag already exists; refusing\
        \ duplicate mutation\"\n  exit 1\nfi\ncp \"$apk\" /tmp/Spool-Pixel-ARM64-audio-only-test-v74.apk\n\
        gh release create \"$tag\" --repo JoyalGeorge2006/spool --draft --target spool-audio-only-20261117\
        \ --title \"Spool mobile audio-only test v74 (private draft)\" --notes \"\
        Private mobile test APK. Same app.spool.music identity and signer. Android\
        \ version 1.9.2/code40. Device acceptance pending. Current release and v73\
        \ untouched.\" /tmp/Spool-Pixel-ARM64-audio-only-test-v74.apk\ntest \"$(gh\
        \ release view \"$tag\" --repo JoyalGeorge2006/spool --json isDraft --jq .isDraft)\"\
        \ = true\ngh release view \"$tag\" --repo JoyalGeorge2006/spool --json isDraft,url,assets,tagName\
        \ > /tmp/private-route.json\ncat /tmp/private-route.json\n"
    - name: Upload private delivery metadata
      uses: actions/upload-artifact@v4
      with:
        name: spool-v74-private-delivery-metadata
        path: /tmp/private-route.json
        if-no-files-found: error
'on':
  workflow_dispatch: {}
