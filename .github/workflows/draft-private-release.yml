name: spool approved v73 private draft asset only
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download final APK artifact
      uses: actions/download-artifact@v4
      with:
        name: spool-phone-test-v73
        run-id: ${{ inputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: /tmp/apk
    - name: Add approved ARM64 APK to existing private draft
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        apk=$(find /tmp/apk -name spool.apk -print -quit)

        test -n "$apk"

        echo "0d7bc6e68d14a41af44d27c33d29b10ee73bdbf9318f819dae91ec144b92cdfa  $apk" | sha256sum -c -

        tag=untagged-1576f0eacf874835d0dc

        test "$(gh release view "$tag" --repo JoyalGeorge2006/spool --json isDraft --jq .isDraft)" = true

        cp "$apk" /tmp/Spool-Pixel-ARM64-test-v73.apk

        gh release upload "$tag" --repo JoyalGeorge2006/spool /tmp/Spool-Pixel-ARM64-test-v73.apk

        gh release view "$tag" --repo JoyalGeorge2006/spool --json isDraft,url,assets

        '
'on':
  workflow_dispatch:
    inputs:
      run_id:
        description: Approved build carrying spool-phone-test-v73 artifact
        required: true
        default: '44012759499'
