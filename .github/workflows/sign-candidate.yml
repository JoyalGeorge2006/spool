name: Spool reviewed UI test APK only, no release
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-ui-test-20261122
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/spool-ui-test-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Bind exact reviewed source patch and isolated CI helpers
      shell: bash
      run: |
        python3 - <<'BIND'
        import base64,gzip,json,hashlib,pathlib
        raw=gzip.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(raw).hexdigest()=='8f49d8dbf7bf81fa5db39d53be9f8b3fbf062a0cf5c3699800e6642f96e5ea70'
        files=json.loads(raw);out=pathlib.Path('/tmp/ui-ci');out.mkdir()
        assert set(files)=={'ui_build.py','artifact.py','candidate_inputs.py','verify.py','r8_diagnostics.py','platform.gradle','approved-ui.patch','patch.sha256','reviewed-files.json'}
        for name,content in files.items():
         assert pathlib.PurePosixPath(name).name==name
         (out/name).write_text(content)
        BIND
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare exact compatible Android SDK
      run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
    - name: Verify accepted source, apply29 reviewed files and test-only version metadata
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_ARTIFACT_ID: '14743033926'
        EXPECTED_ARTIFACT_DIGEST: 262d19e105d963b458ff6514b45cefe4e6d87ed4baaa299e8ba6e42453f992cf
      run: python3 /tmp/ui-ci/ui_build.py prepare
    - name: Compile and run existing shared and Android unit-test gates before signing
      run: |-
        cd candidate-tree
        timeout 1800 bash gradlew --no-daemon --console=plain --init-script /tmp/ui-ci/platform.gradle --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m' -Pkotlin.compiler.execution.strategy=in-process -Pbitchord.bundleWear=false :shared:jvmTest :app:testDevDebugUnitTest
    - name: Build signed TEST APKs and verify accepted signer package and versions
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: python3 /tmp/ui-ci/ui_build.py build
    - name: Upload verified test APKs and source only, never publish release or OTA
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-ui-test-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          test-output/manifest.json
          test-output/Spool-2.1.2-ui-test1-arm64-v8a.apk
          test-output/Spool-2.1.2-ui-test1-universal.apk
          test-output/source.tar.gz
        if-no-files-found: error
        retention-days: 7
    - name: Cleanup private build material even on failure
      if: always()
      run: rm -f candidate-tree/spool-debug.keystore candidate-tree/keystore.properties build.log
    - name: Guard structured diagnostic output
      if: always()
      run: if test -f /tmp/ui-ci/r8_diagnostics.py; then python3 /tmp/ui-ci/r8_diagnostics.py --guard evidence/r8-diagnostics.json;
        fi
    - name: Upload only source bindings verification and guarded diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-ui-test-verification-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          evidence/ui-source-binding.json
          evidence/test-apk-verification.json
          evidence/*.cert.txt
          evidence/*.badging.txt
          evidence/*.manifest.txt
          evidence/gradle-task-status.txt
          evidence/resource-settings.json
          evidence/jvm-resource-settings.json
          evidence/r8-diagnostics.json
          candidate-tree/shared/build/test-results/jvmTest/TEST-*.xml
          candidate-tree/app/build/test-results/testDevDebugUnitTest/TEST-*.xml
        if-no-files-found: warn
        retention-days: 7
