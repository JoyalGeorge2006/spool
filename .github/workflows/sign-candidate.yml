name: Spool immutable candidate44994216959 device-only inspection
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-reviewed-continuous58to59-artifact-device-only
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 1452681c4059ee6e7bb809bc82ec961eba2399e4
        path: proposal
        persist-credentials: false
    - name: Bind exact immutable reviewed source bundle
      shell: bash
      run: |
        set -euo pipefail
        test "$(git -C proposal rev-parse HEAD)" = 1452681c4059ee6e7bb809bc82ec961eba2399e4
        test "$(git -C proposal rev-parse HEAD^{tree})" = b2e08e4750638904e1d14ca542040333600bff6e
        python3 - <<'BIND'
        import pathlib,json,hashlib,os
        p=pathlib.Path('proposal');raw=(p/'release-prep/spool-2.1.2/device-source.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='a6b1bba0382f53782e36366805dfb16a5ae4e78b97c453e45757dc1ecf721954'
        expected={"baseline.py": "275655ee82b2c6621300c3d86a3d67f807f35541b12a3fba7b3fe0b45d2c1288", "navigator.py": "803615988dc19f85ade68c5fcc440e69ced6a5bbaae1942d87d59d26fb0d74b0", "candidate59.py": "6a0c8371fee070635fdc279021a3f7f546e9ff6e39873dfc31b94f688f700f0c", "continuous59.py": "c85e312af4f17b551e222865efaa8b768dcee25c069f9b4dd18d5f672e95600a", "candidate_inputs.py": "04044a4e1f25060a939b6b153085d2ffaa24e7149646804fae57b2b186aff4c6", "verify.py": "7058ca08e9f3f0604427bf32c3f287f9ba769ab0d90f917de8aeeb0c31255437", "inspect-inputs.py": "a560f557bb19d7880994a574af9e0352f5d6ea23463e347479912fce2cc60ea1", "inspection-resources.json": "0e6e81de2ee5f72222e757f3c4409218a6b08c752420cade510f25f79dcd8479", "inspect-evidence.py": "11e39584c7090959ee495778960ba91918c5b3cc8274f807955d70d781d8b323", "artifact.py": "8ea52336cfd47725d406e93ca22d8e6e129f17b817ef8a2ed11a85bb45b31bc3", "build.py": "6d15c132eab88022afc2cfa77327a4957b7c47a42088a7079d29c2a00eb2b427", "platform.gradle": "0a3cd89d7c96724e3167fc2f9b226aa2c7a62b49ff887da6605e8466a10076c2", "metadata-only.patch": "f36d76dec3a5fc8c713e215f0653957cffec0c03a825ed9d8295073a6c609340", "latest_after.py": "b5c4befa08d435290941664461bade32d64497672ca4fb0607a22dd2c72d664d", "r8_diagnostics.py": "855ab92ce4c124f839c00d4bd23bf0d2dd1380f41afe6791cdcf6b2fcb222afe"}
        def unique(pairs):
         d={}
         for k,v in pairs:
          assert k not in d;d[k]=v
         return d
        j=json.loads(raw,object_pairs_hook=unique);assert set(j)=={'schema','purpose','files','sha256'}and j['schema']==1 and j['sha256']==expected and set(j['files'])==set(expected)
        for name,digest in expected.items():
         assert pathlib.PurePosixPath(name).name==name and isinstance(j['files'][name],str)and hashlib.sha256(j['files'][name].encode()).hexdigest()==digest
         assert not(p/name).exists()
        for name in expected:(p/name).write_text(j['files'][name])
        e=pathlib.Path('evidence');e.mkdir(exist_ok=True)
        (e/'artifact-binding-source.json').write_text(json.dumps(dict(source_commit='1452681c4059ee6e7bb809bc82ec961eba2399e4',source_tree='b2e08e4750638904e1d14ca542040333600bff6e',bundle_sha256=hashlib.sha256(raw).hexdigest(),files=expected,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT']),indent=2))
        BIND
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - run: sdkmanager 'build-tools;35.0.0'
    - name: Fetch exact accepted producer44994216959 immutable candidate, no build
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_ARTIFACT_ID: '14743033926'
        EXPECTED_ARTIFACT_DIGEST: 262d19e105d963b458ff6514b45cefe4e6d87ed4baaa299e8ba6e42453f992cf
      run: python3 proposal/artifact.py
    - name: Verify source, bytes, package, flags and signer before device
      run: python3 proposal/candidate_inputs.py
    - name: Recheck live stable monotonicity and cryptographically verify predecessor
      run: python3 proposal/inspect-inputs.py
      env:
        INSPECTION_METADATA_TOKEN: ${{ github.token }}
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Verify actual host capacity, read-only environment probe
      shell: bash
      run: |
        set -euo pipefail
        nproc
        free -h
        df -h /
        swapon --show || true
    - name: Install pinned pixel decoder before continuous device session
      run: python3 -m pip install Pillow==11.3.0
    - name: ONE continuous same-instance58-to59 session, no Gradle/rebuild/retry
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_6
        ram-size: 3072M
        heap-size: 512M
        disk-size: 4096M
        disable-animations: false
        emulator-options: -no-window -no-audio -no-boot-anim -gpu lavapipe -camera-back none -no-snapshot -memory 3072
          -cores 2
        force-avd-creation: true
        script: python3 proposal/continuous59.py
    - name: Capture host kernel log after device session, diagnostics only
      if: always()
      shell: bash
      run: sudo dmesg --time-format iso 2>/dev/null | tail -n 80 || sudo dmesg | tail -n 80 || true
    - name: Collect emulator crash forensics after device session, diagnostics only
      if: always()
      shell: bash
      run: |
        sudo coredumpctl list --no-pager 2>/dev/null | tail -n 20 || true
        sudo coredumpctl info --no-pager 2>/dev/null | head -n 60 || true
        ls -la /tmp/android-runner/ 2>/dev/null || true
        for f in /tmp/android-runner/emu-crash-*.db; do test -e "$f" && strings "$f" | tail -n 40 || true; done
        true
    - name: Recheck live predecessor race after device, no account effect
      run: python3 proposal/latest_after.py
      env:
        INSPECTION_METADATA_TOKEN: ${{ github.token }}
    - name: Evidence cleanup and file allowlist, even failures
      if: always()
      run: |-
        rm -f predecessor.apk installed.apk bundle.zip
        python3 proposal/inspect-evidence.py
    - name: Upload upgrade evidence only, never APKs or user delivery
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-continuous58to59-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: inspection-upload/
        if-no-files-found: error
        retention-days: 14
'on':
  workflow_dispatch: {}
