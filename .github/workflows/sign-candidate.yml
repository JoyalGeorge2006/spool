name: Spool scoped runtime and native visual verification
run-name: Existing APK focus comparison plus internal cumulative native visuals, no release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-scoped-verification-20261122
  cancel-in-progress: false
jobs:
  native-visuals:
    if: github.ref == 'refs/heads/spool-ui-test-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
    - name: Bind exact74-path source patch and diagnostic helpers
      run: |
        python3 - <<'BIND'
        import base64,gzip,json,hashlib,pathlib
        raw=gzip.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(raw).hexdigest()=='a345be6cc5f113573b0f9e57db8ee27191a1b7fe9f2bec614e38a6c79255f639'
        files=json.loads(raw);out=pathlib.Path('/tmp/cumulative-ci');out.mkdir()
        assert set(files)=={'cumulative-source.patch', 'prepare.py', 'native_build.py', 'artifact.py', 'reviewed-files.json', 'r8_diagnostics.py', 'candidate_inputs.py', 'patch.sha256', 'platform.gradle', 'NativeStatusFrostTest.kt', 'verify.py'}
        for name,value in files.items():
         assert pathlib.PurePosixPath(name).name==name
         (out/name).write_text(value)
        BIND
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare exact compatible Android SDK
      run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
    - name: Bind cumulative74 app sources and isolated Android test only
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_ARTIFACT_ID: '14743033926'
        EXPECTED_ARTIFACT_DIGEST: 262d19e105d963b458ff6514b45cefe4e6d87ed4baaa299e8ba6e42453f992cf
      run: |-
        python3 /tmp/cumulative-ci/prepare.py
        python3 /tmp/cumulative-ci/native_build.py prepare-test
      id: prepare
    - name: Record actual footer and lyrics regression pixels
      shell: bash
      run: |-
        cd candidate-tree
        timeout 2100 bash gradlew --no-daemon --console=plain --init-script /tmp/cumulative-ci/platform.gradle --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m' -Pkotlin.compiler.execution.strategy=in-process -Pbitchord.bundleWear=false :app:testDevDebugUnitTest -Proborazzi.test.record=true --tests com.music.bitchord.ApprovedDesignChangesTest --tests com.music.bitchord.SettingsTertiaryViewportTest --tests com.music.bitchord.LyricsSourcesDialogScrollTest --tests com.music.bitchord.StatusAreaFrostGeometryTest
    - name: Require rendered PNG evidence instead of a JUnit-only success
      if: always()
      run: |-
        python3 - <<'PY'
        from pathlib import Path
        import hashlib,json
        r=Path('candidate-tree/app/build/outputs/roborazzi')
        required=['approved_addon_false_false_false.png','approved_addon_false_true_false.png','approved_addon_false_true_true.png','tertiary_LYRICS_SOURCES_false_top.png','tertiary_LYRICS_SOURCES_true_top.png']
        assert all((r/n).is_file()and(r/n).stat().st_size>0 for n in required),'Required actual rendered PNG missing'
        files=sorted(r.glob('*.png'));e=Path('evidence');e.mkdir(exist_ok=True)
        (e/'rendered-capture-manifest.json').write_text(json.dumps({p.name:dict(bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest())for p in files},indent=2))
        PY
    - name: Build ephemeral dev/debug app and instrumentation, never production sign
      id: native_build
      if: always() && steps.prepare.outcome == 'success'
      run: |-
        cd candidate-tree
        timeout 2100 bash gradlew --no-daemon --console=plain --init-script /tmp/cumulative-ci/platform.gradle --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m' -Pkotlin.compiler.execution.strategy=in-process -Pbitchord.bundleWear=false :app:assembleDevDebug :app:assembleDevDebugAndroidTest
        cd ..
        python3 /tmp/cumulative-ci/native_build.py verify-apks
    - name: Retain JUnit and actual PNGs, free compiler-only space before emulator
      if: always()
      run: |-
        python3 - <<'PY'
        from pathlib import Path
        import shutil
        p=Path('candidate-tree/app/build');e=Path('evidence')
        for source,target in [(p/'test-results/testDevDebugUnitTest',e/'recorded-junit'),(p/'outputs/roborazzi',e/'recorded-layouts')]:
         if source.exists():shutil.copytree(source,target,dirs_exist_ok=True)
        PY
        rm -rf candidate-tree/app/build/intermediates candidate-tree/.gradle accepted-input bundle.zip "$HOME/.gradle/caches" "$ANDROID_HOME/ndk/27.0.12077973"
        df -h .
    - name: Enable disposable emulator acceleration
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Hardware-window Haze component and actual Home/Settings captures
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: '34'
        system-image-api-level: '34'
        target: google_apis
        arch: x86_64
        profile: pixel_6
        ram-size: 3072M
        heap-size: 512M
        disk-size: 4096M
        disable-animations: false
        force-avd-creation: true
        emulator-options: -no-window -no-audio -no-boot-anim -gpu lavapipe -camera-back none -no-snapshot -memory 3072 -cores
          2
        script: python3 /tmp/cumulative-ci/native_build.py device
      if: always() && steps.native_build.outcome == 'success'
    - name: Remove ephemeral APKs and generated signing key, no APK publication
      if: always()
      run: |-
        rm -rf private-emulator-apks candidate-tree/app/build/outputs/apk
        rm -f "$HOME/.android/debug.keystore"
    - name: Upload test results and visual evidence only, never app APK
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-status-recorded-layouts-${{ github.run_id }}-${{ github.run_attempt }}
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  existing-focus:
    if: github.ref == 'refs/heads/spool-ui-test-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
        - '34'
        - '37.0'
    env:
      EXPECTED_ARTIFACT_ID: '14743033926'
      EXPECTED_ARTIFACT_DIGEST: 262d19e105d963b458ff6514b45cefe4e6d87ed4baaa299e8ba6e42453f992cf
    steps:
    - name: Bind isolated no-build test harness
      run: |-
        python3 - <<'PY'
        import base64,hashlib,io,tarfile,pathlib
        raw=base64.b64decode('')
        assert hashlib.sha256(raw).hexdigest()=='6fcf56bfc493fb4fc2f4835c4657b6098cdee766dfefc19a9d8d0a1ef651de09'
        with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz')as a:
         assert set(a.getnames())=={'focus_prepare.py', 'focus_device.py', 'artifact.py', 'FocusProbe.java', 'candidate_inputs.py', 'focus_ab.py', 'version_labels.json', 'verify.py'}
         assert all(m.isfile()and '/'not in m.name for m in a.getmembers())
         a.extractall(pathlib.Path.cwd())
        PY
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare test-companion SDK only
      run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0'
    - name: Verify exact existing production APKs and build disposable focus companion only
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 focus_prepare.py
    - name: Enable disposable emulator acceleration
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: One same-instance public58-to-delivered59 focus experiment
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      env:
        EXPECTED_EMULATOR_API: ${{ matrix.image == '34' && '34' || '37' }}
      with:
        api-level: ${{ matrix.image }}
        system-image-api-level: ${{ matrix.image }}
        target: google_apis
        arch: x86_64
        profile: pixel_6
        ram-size: 3072M
        heap-size: 512M
        disk-size: 4096M
        disable-animations: false
        force-avd-creation: true
        emulator-options: -no-window -no-audio -no-boot-anim -gpu lavapipe -camera-back none -no-snapshot -memory 3072 -cores
          2
        script: python3 focus_ab.py
    - name: Remove disposable keys and input APKs, never publish a build
      if: always()
      run: |-
        rm -f probe-debug.keystore FocusProbe.apk probe-unsigned.apk public211.apk bundle.zip SpoolFocusFixture.wav
        rm -rf accepted-input candidate-tree probe-classes probe-dex
        python3 - <<'PY'
        from pathlib import Path
        p=Path('evidence');p.mkdir(exist_ok=True)
        assert all(f.is_file()and f.suffix in {'.txt','.json','.png','.xml'}for f in p.iterdir())
        PY
    - name: Upload test evidence only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: existing-apk-focus-api${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: evidence/
        if-no-files-found: error
        retention-days: 7
