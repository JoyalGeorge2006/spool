name: Spool stable58 offline navigation inspection only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-stable58-navigation-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bde164bf6c399cf8d6733b1180cff52267be39da
          persist-credentials: false
          path: proposal
      - name: Bind immutable source commit, raw JSON and exact six files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C proposal rev-parse HEAD)" = bde164bf6c399cf8d6733b1180cff52267be39da
          test "$(git -C proposal rev-parse HEAD^{tree})" = 188a1126bb1127d9a1f67b6b4a3ad66875399cce
          python3 - <<'PYBIND'
          import json,pathlib,hashlib,os
          root=pathlib.Path('proposal')
          p=root/'release-prep/spool-2.1.2/inspection-source.json'
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='2d5ffc3d02f45d50335ad7bf629bc33ea84e91851e54463c7b6794e57e1fafd8'
          def unique(pairs):
              result={}
              for k,v in pairs:
                  assert k not in result, 'Duplicate JSON key'
                  result[k]=v
              return result
          j=json.loads(raw,object_pairs_hook=unique)
          assert set(j)=={'schema','purpose','files','sha256'} and j['schema']==1
          expected={'inspect-stable.py': 'a7e775f815ef186a016dc324c52fcc945800a1e21c7d73bcc1d57292e647e76c', 'inspect-inputs.py': 'bace616c2e0f051acd57489798baf2ac40507323e28e281e5d9395cd67ae8016', 'inspect-evidence.py': 'f163e06d40e96ddac64ac722b92550b5805cd166d1d8a871fa137da35a386100', 'inspection-resources.json': '19e93683afce941a48c93dee2edf940cc6284b926184f67cd4f10393a1ad4cc5', 'navigator.py': '0d27f66fae6fbf245b62b676755df575d3e6d812509d7f685686808323bfed5f', 'verify.py': '250d7275f08dac7fbb5ddaee0f67ca1d0401a780046a8ce3a6bfe3badf8ae815'}
          assert set(j['files'])==set(expected) and j['sha256']==expected
          # Validate every file before writing any. Only known plain basenames.
          for name,digest in expected.items():
              assert pathlib.PurePosixPath(name).name==name and isinstance(j['files'][name],str)
              assert hashlib.sha256(j['files'][name].encode('utf-8')).hexdigest()==digest
              assert not (root/name).exists()
          for name in expected:
              path=root/name
              with path.open('xb') as f:f.write(j['files'][name].encode('utf-8'))
              assert hashlib.sha256(path.read_bytes()).hexdigest()==expected[name]
          out=pathlib.Path('source-binding');out.mkdir(exist_ok=True)
          (out/'inspection-source-binding.json').write_text(json.dumps(dict(source_commit='bde164bf6c399cf8d6733b1180cff52267be39da',source_tree='188a1126bb1127d9a1f67b6b4a3ad66875399cce',bundle_sha256=hashlib.sha256(raw).hexdigest(),files=expected,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT']),indent=2))
          PYBIND
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install manifest/signature tools only, no Gradle/native compile
        run: sdkmanager 'build-tools;35.0.0'
      - name: Fetch+cryptographically verify hosted stable58 and immutable EN resources
        run: python3 proposal/inspect-inputs.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: One bounded offline UI inspection, stop first ambiguity
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader -camera-back none -no-snapshot -memory 2048 -cores 2
          force-avd-creation: true
          script: python3 proposal/inspect-stable.py
      - name: Install pinned PNG decoder
        if: always()
        run: python3 -m pip install Pillow==11.3.0
      - name: Validate captured bytes/pixels and stage only diagnostic allowlist
        if: always()
        run: python3 proposal/inspect-evidence.py
      - name: Remove downloaded APK even on inspection stop
        if: always()
        run: rm -f predecessor.apk
      - name: Upload evidence only, no APK/source/key/distribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spool-stable58-navigation-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: inspection-upload/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload exact source-binding proof separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spool-stable58-source-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-binding/inspection-source-binding.json
          if-no-files-found: warn
          retention-days: 14
