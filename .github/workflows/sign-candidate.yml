name: Compact lyric interaction probes (no release)
on:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Apply the spool patch
      run: |
        git fetch origin 9f40c70e614d4e4d978d58295f59ab12ee07b493
        git checkout FETCH_HEAD -- . ':!.github'
        test "$(git rev-parse FETCH_HEAD)" = 9f40c70e614d4e4d978d58295f59ab12ee07b493
        echo  | base64 -d > /tmp/inline-lyrics.patch
        git apply /tmp/inline-lyrics.patch
        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1


    - name: Compile and run non-capture regression suites
      run: |
        chmod +x gradlew
        cat > /tmp/no-capture.gradle <<'GRADLE'
        allprojects { tasks.withType(Test).configureEach { exclude '**/V6ScreenshotTest*' } }
        GRADLE
        ./gradlew --init-script /tmp/no-capture.gradle :sharedUi:jvmTest --tests 'com.music.bitchord.ui.player.InlineLyricsInteractionTest' -Pbitchord.bundleWear=false
    - name: Upload regression evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lyric129-regressions
        path: |
          app/build/test-results/**/*.xml
          shared/build/test-results/**/*.xml
          sharedUi/build/test-results/**/*.xml
        if-no-files-found: ignore
