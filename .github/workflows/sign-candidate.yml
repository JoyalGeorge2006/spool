name: Qualify existing prod flavor beside original dev (emulator only)
on:
  workflow_dispatch:
jobs:
  coexistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Apply the spool patch
      run: |
        git fetch origin 9f40c70e614d4e4d978d58295f59ab12ee07b493
        git checkout FETCH_HEAD -- . ':!.github'
        test "$(git rev-parse FETCH_HEAD)" = 9f40c70e614d4e4d978d58295f59ab12ee07b493
        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1


    - name: Restore persisted key for ephemeral test APKs
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: |
        test -n "$SPOOL_DEBUG_KEYSTORE_B64"
        printf '%s' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore
        chmod 600 spool-debug.keystore
    - name: Download exact original dev splits without re-signing
      uses: actions/download-artifact@v4
      with:
        name: raw-apk-splits
        run-id: 43715105855
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: /tmp/original-dev
    - name: Compile existing prod debug flavor for qualification only
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleProdDebug -Pbitchord.bundleWear=false
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Qualify coexistence and sandbox separation
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        script: |
          adb install "$(find /tmp/original-dev -name '*-x86_64-debug.apk' -print -quit)"
          adb shell 'run-as app.spool.music.dev sh -c "mkdir -p files; echo original-state > files/coexistence-marker"' 
          adb install "$(find app/build/outputs/apk/prod/debug -name '*-x86_64-debug.apk' -print -quit)"
          adb shell run-as app.spool.music.dev cat files/coexistence-marker | tee /tmp/old-marker-after.txt
          grep original-state /tmp/old-marker-after.txt
          adb shell 'run-as app.spool.music sh -c "test ! -e files/coexistence-marker"' 
          adb shell 'run-as app.spool.music sh -c "mkdir -p files; echo new-state > files/coexistence-marker"' 
          adb shell run-as app.spool.music.dev cat files/coexistence-marker | grep original-state
          adb shell am start -W -n app.spool.music.dev/com.music.bitchord.LauncherDefault | tee /tmp/original-launch.txt
          adb shell pidof app.spool.music.dev
          adb shell am start -W -n app.spool.music/com.music.bitchord.LauncherSpool | tee /tmp/side-launch.txt
          adb shell pidof app.spool.music
          adb shell cmd package query-activities --brief -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d https://music.youtube.com/watch?v=fixture | tee /tmp/handler-youtube.txt
          adb shell cmd package query-activities --brief -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d bitchord://party/TESTAB | tee /tmp/handler-party.txt
          adb shell dumpsys package app.spool.music.dev > /tmp/original-package.txt
          adb shell dumpsys package app.spool.music > /tmp/side-package.txt
          adb exec-out screencap -p > /tmp/side-launch.png
          adb uninstall app.spool.music
          adb shell run-as app.spool.music.dev cat files/coexistence-marker | grep original-state
          adb shell am start -W -n app.spool.music.dev/com.music.bitchord.LauncherDefault
          adb shell pidof app.spool.music.dev
          adb exec-out screencap -p > /tmp/original-retained.png
    - name: Upload qualification evidence only, never an installable candidate
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: emulator-coexistence-evidence
        path: |
          /tmp/*marker-after.txt
          /tmp/*launch.txt
          /tmp/handler-*.txt
          /tmp/*package.txt
          /tmp/side-launch.png
          /tmp/original-retained.png
        if-no-files-found: ignore
