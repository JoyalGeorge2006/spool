name: Spool 2.1.3 exact-artifact release with explicit OTA verification
'on':
  workflow_dispatch:
    inputs:
      publish_now:
        description: Request publication only after code-level gate and release review are complete
        type: boolean
        required: true
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: spool-final-v213-release
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published: ${{ steps.execute.outputs.published }}
    steps:
    - name: Extract checksum-bound release packet
      run: |
        python3 - <<'PY'
        import base64,hashlib,io,tarfile,pathlib
        b=base64.b64decode('',validate=True)
        assert hashlib.sha256(b).hexdigest()=='e17cdd9a1978becf86602404d3a5ef870beeeeac187866f15d8a32e370369ea3'
        with tarfile.open(fileobj=io.BytesIO(b),mode='r:gz')as t:
         assert all(m.isfile() and '/'not in m.name for m in t.getmembers())
         t.extractall(pathlib.Path.cwd())
        PY
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools build-tools;35.0.0
        log-accepted-android-sdk-licenses: false
    - name: Verify original artifacts or honor closed publication gate
      id: execute
      run: python3 prepare_release.py '${{ inputs.publish_now && 'publish' || 'verify-only' }}'
    - name: Upload verification only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-213-release-verification-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          preflight-verification.json
          published-release-initial.json
          evidence/
          ota-input-source-verification.json
          audio77-release-gate-verification.json
        if-no-files-found: warn
        retention-days: 7
  ota:
    needs:
    - publish
    if: needs.publish.outputs.published == 'true'
    uses: JoyalGeorge2006/spool/.github/workflows/ota-delta-publish.yml@d55ff585f5886c93162c3e65d414ac5c0f53049c
    with:
      release_tag: v2.1.3
  postverify:
    needs:
    - publish
    - ota
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Extract identical verification pins
      run: |
        python3 - <<'PY'
        import base64,hashlib,io,tarfile,pathlib
        b=base64.b64decode('',validate=True)
        assert hashlib.sha256(b).hexdigest()=='e17cdd9a1978becf86602404d3a5ef870beeeeac187866f15d8a32e370369ea3'
        with tarfile.open(fileobj=io.BytesIO(b),mode='r:gz')as t:
         assert all(m.isfile() and '/'not in m.name for m in t.getmembers())
         t.extractall(pathlib.Path.cwd())
        PY
    - name: Verify live public assets and actual catalog binding
      run: python3 postverify.py
    - name: Upload final public verification
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-213-public-verification-${{ github.run_id }}-${{ github.run_attempt }}
        path: final-public-verification.json
        if-no-files-found: warn
        retention-days: 7
run-name: Spool 2.1.3 exact signed release, audio77 bound, explicit OTA verification
