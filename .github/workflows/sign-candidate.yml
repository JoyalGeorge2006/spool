name: Spool candidate dialog-disposal regression and runtime evidence
run-name: Cumulative75 dialog-disposal and30-minute lifecycle regression plus existing-APK focus observations, no release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-cumulative75-regression-20261122
  cancel-in-progress: false
jobs:
  cumulative-soak:
    if: github.ref == 'refs/heads/spool-ui-test-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Bind cumulative75 source and exact lifecycle regression diagnostics
      run: |
        python3 - <<'BIND'
        import base64,gzip,json,hashlib,pathlib
        raw=gzip.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(raw).hexdigest()=='fe7bbe6f2fafffd0b305b2aa46604c1322aa56e7d40b888188a74e951f2f7711'
        files=json.loads(raw);out=pathlib.Path('/tmp/cumulative-ci');out.mkdir()
        assert set(files)=={'platform.gradle', 'r8_diagnostics.py', 'verify.py', 'patch.sha256', 'native_build.py', 'artifact.py', 'cumulative-source.patch', 'SpoolLifecycleSoakTest.kt', 'NativeStatusFrostTest.kt', 'prepare.py', 'NativePlayerEvidenceTest.kt', 'candidate_inputs.py', 'reviewed-files.json', 'native_soak.py'}
        for name,value in files.items():
         assert pathlib.PurePosixPath(name).name==name
         (out/name).write_text(value)
        BIND
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare exact compatible Android SDK
      run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
    - name: Bind cumulative75 production tree plus isolated lifecycle-soak instrumentation
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_ARTIFACT_ID: '14743033926'
        EXPECTED_ARTIFACT_DIGEST: 262d19e105d963b458ff6514b45cefe4e6d87ed4baaa299e8ba6e42453f992cf
      run: |-
        python3 /tmp/cumulative-ci/prepare.py
        python3 /tmp/cumulative-ci/native_soak.py prepare-test
      id: prepare
    - name: Build ephemeral dev/debug app and instrumentation, never production sign
      id: native_build
      if: always() && steps.prepare.outcome == 'success'
      run: |-
        cd candidate-tree
        timeout 2100 bash gradlew --no-daemon --console=plain --init-script /tmp/cumulative-ci/platform.gradle --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m' -Pkotlin.compiler.execution.strategy=in-process -Pbitchord.bundleWear=false :app:assembleDevDebug :app:assembleDevDebugAndroidTest
        cd ..
        python3 /tmp/cumulative-ci/native_soak.py verify-apks
    - name: Free compiler-only space before the real-time emulator exercise
      if: always()
      run: |-
        rm -rf candidate-tree/app/build/intermediates candidate-tree/.gradle accepted-input bundle.zip "$HOME/.gradle/caches" "$ANDROID_HOME/ndk/27.0.12077973"
        df -h .
    - name: Enable disposable emulator acceleration
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Actual native Haze, Home/Settings and local-player checks before soak
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: ${{ matrix.image }}
        system-image-api-level: ${{ matrix.image }}
        target: google_apis
        arch: x86_64
        profile: pixel_6
        ram-size: 3072M
        heap-size: 512M
        disk-size: 4096M
        disable-animations: false
        force-avd-creation: true
        emulator-options: -no-window -no-audio -no-boot-anim -gpu lavapipe -camera-back none -no-snapshot -memory 3072 -cores
          2
        script: python3 /tmp/cumulative-ci/native_build.py device
      if: always() && steps.native_build.outcome == 'success' && matrix.image == '37.0'
      id: native_visuals
      continue-on-error: true
    - name: Retain native evidence before the long runtime exercise
      if: always() && steps.native_build.outcome == 'success' && matrix.image == '37.0'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-before-soak-api${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    - name: At least30minutes of real playback and repeated open/close exercise
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: ${{ matrix.image }}
        system-image-api-level: ${{ matrix.image }}
        target: google_apis
        arch: x86_64
        profile: pixel_6
        ram-size: 3072M
        heap-size: 512M
        disk-size: 4096M
        disable-animations: false
        force-avd-creation: true
        emulator-options: -no-window -no-audio -no-boot-anim -gpu lavapipe -camera-back none -no-snapshot -memory 3072 -cores
          2
        script: python3 /tmp/cumulative-ci/native_soak.py device
      if: always() && steps.native_build.outcome == 'success'
      env:
        EXPECTED_EMULATOR_API: ${{ matrix.image == '34' && '34' || '37' }}
    - name: Native visual checks after the prioritized API34 runtime exercise
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: ${{ matrix.image }}
        system-image-api-level: ${{ matrix.image }}
        target: google_apis
        arch: x86_64
        profile: pixel_6
        ram-size: 3072M
        heap-size: 512M
        disk-size: 4096M
        disable-animations: false
        force-avd-creation: true
        emulator-options: -no-window -no-audio -no-boot-anim -gpu lavapipe -camera-back none -no-snapshot -memory 3072 -cores
          2
        script: python3 /tmp/cumulative-ci/native_build.py device
      if: always() && steps.native_build.outcome == 'success' && matrix.image == '34'
      id: native_visuals_after_soak
      continue-on-error: true
    - name: Require both native checks and completed30-minute exercise, never suppress a native failure
      if: always() && steps.native_build.outcome == 'success'
      run: |-
        python3 - <<'PY'
        from pathlib import Path
        import json,re
        p=Path('evidence');text=(p/'native-instrumentation.txt').read_bytes()
        assert re.search(rb'OK \(4 tests\)',text)and b'FAILURES!!!'not in text,'Native verification failed independently of soak'
        assert len(list((p/'native-status-frost').glob('*.png')))>=10
        assert json.loads((p/'independent-soak-check.json').read_text())['passed']
        PY
    - name: Remove ephemeral APKs and generated signing key, no APK publication
      if: always()
      run: |-
        rm -rf private-emulator-apks candidate-tree/app/build/outputs/apk
        rm -f "$HOME/.android/debug.keystore"
    - name: Upload measured runtime, screenshots and crash/ANR evidence only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cumulative-lifecycle-soak-api${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    strategy:
      fail-fast: false
      matrix:
        image:
        - '34'
        - '37.0'
  existing-focus:
    if: github.ref == 'refs/heads/spool-ui-test-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
        - '34'
        - '37.0'
    env:
      EXPECTED_ARTIFACT_ID: '14743033926'
      EXPECTED_ARTIFACT_DIGEST: 262d19e105d963b458ff6514b45cefe4e6d87ed4baaa299e8ba6e42453f992cf
    steps:
    - name: Bind isolated no-build test harness
      run: |-
        python3 - <<'PY'
        import base64,hashlib,io,tarfile,pathlib
        raw=base64.b64decode('')
        assert hashlib.sha256(raw).hexdigest()=='9966d827437a344219aae7eb7782ad0dd18e2bce1ff975e18b83ad701235a357'
        with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz')as a:
         assert set(a.getnames())=={'focus_device.py', 'verify.py', 'candidate_inputs.py', 'artifact.py', 'focus_prepare.py', 'focus_ab.py', 'FocusProbe.java', 'version_labels.json'}
         assert all(m.isfile()and '/'not in m.name for m in a.getmembers())
         a.extractall(pathlib.Path.cwd())
        PY
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare companion SDK and supported MP3 fixture encoder
      run: |-
        sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0'
        command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
        ffmpeg -version | head -n 3
    - name: Verify exact existing production APKs and build disposable focus companion only
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 focus_prepare.py
    - name: Enable disposable emulator acceleration
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: One same-instance public58-to-delivered59 focus experiment
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      env:
        EXPECTED_EMULATOR_API: ${{ matrix.image == '34' && '34' || '37' }}
      with:
        api-level: ${{ matrix.image }}
        system-image-api-level: ${{ matrix.image }}
        target: google_apis
        arch: x86_64
        profile: pixel_6
        ram-size: 3072M
        heap-size: 512M
        disk-size: 4096M
        disable-animations: false
        force-avd-creation: true
        emulator-options: -no-window -no-audio -no-boot-anim -gpu lavapipe -camera-back none -no-snapshot -memory 3072 -cores
          2
        script: python3 focus_ab.py
    - name: Remove disposable keys and input APKs, never publish a build
      if: always()
      run: |-
        rm -f probe-debug.keystore FocusProbe.apk probe-unsigned.apk public211.apk bundle.zip SpoolFocusFixture.wav SpoolFocusFixture.mp3
        rm -rf accepted-input candidate-tree probe-classes probe-dex
        python3 - <<'PY'
        from pathlib import Path
        p=Path('evidence');p.mkdir(exist_ok=True)
        assert all(f.is_file()and f.suffix in {'.txt','.json','.png','.xml'}for f in p.iterdir())
        PY
    - name: Upload test evidence only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: existing-apk-focus-api${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: evidence/
        if-no-files-found: error
        retention-days: 7
