name: Spool final candidate62 build, no publication
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-final-candidate62-v213-20261122
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/spool-ui-test-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Bind exact source75 and metadata-only final version62
      shell: bash
      run: |
        python3 - <<'BIND'
        import base64,gzip,json,hashlib,pathlib
        raw=gzip.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(raw).hexdigest()=='b2c6699b8b7dacb91f7a48ea205120f2514ee39e44705c300cf1c5a26025f429'
        files=json.loads(raw);out=pathlib.Path('/tmp/ui-ci');out.mkdir()
        assert set(files)=={'candidate_inputs.py', 'verify.py', 'approved-ui.patch', 'r8_diagnostics.py', 'reviewed-files.json', 'patch.sha256', 'artifact.py', 'test-version-binding.json', 'platform.gradle', 'ui_build.py'}
        for name,content in files.items():
         assert pathlib.PurePosixPath(name).name==name
         (out/name).write_text(content)
        BIND
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare exact compatible Android SDK
      run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
    - name: Verify source75 and only final versionCode62 metadata
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_ARTIFACT_ID: '14743033926'
        EXPECTED_ARTIFACT_DIGEST: 262d19e105d963b458ff6514b45cefe4e6d87ed4baaa299e8ba6e42453f992cf
      run: python3 /tmp/ui-ci/ui_build.py prepare
    - name: Build final signed candidate APKs, verify accepted signer and version62
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: python3 /tmp/ui-ci/ui_build.py build
    - name: Upload final candidate APKs and exact source, no release or OTA publication
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-final-candidate62-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          test-output/manifest.json
          test-output/Spool-2.1.3-arm64-v8a.apk
          test-output/Spool-2.1.3-universal.apk
          test-output/source.tar.gz
        if-no-files-found: error
        retention-days: 7
    - name: Cleanup private build material even on failure
      if: always()
      run: rm -f candidate-tree/spool-debug.keystore candidate-tree/keystore.properties build.log
    - name: Guard structured diagnostic output
      if: always()
      run: if test -f /tmp/ui-ci/r8_diagnostics.py; then python3 /tmp/ui-ci/r8_diagnostics.py --guard evidence/r8-diagnostics.json;
        fi
    - name: Upload only source bindings verification and guarded diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-final-candidate62-verification-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          evidence/ui-source-binding.json
          evidence/test-apk-verification.json
          evidence/*.cert.txt
          evidence/*.badging.txt
          evidence/*.manifest.txt
          evidence/gradle-task-status.txt
          evidence/resource-settings.json
          evidence/jvm-resource-settings.json
          evidence/r8-diagnostics.json
          candidate-tree/shared/build/test-results/jvmTest/TEST-*.xml
          candidate-tree/app/build/test-results/testDevDebugUnitTest/TEST-*.xml
        if-no-files-found: warn
        retention-days: 7
run-name: Source75 final candidate 2.1.3 code62, newer than installed2.1.2, build only
