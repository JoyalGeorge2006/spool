name: Spool immutable candidate44967542544 device-only inspection
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-reviewed-continuous58to59-artifact-device-only
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 8047231bbdf7f7adf40ab1fa581553d8b17e8f92
        path: proposal
        persist-credentials: false
    - name: Bind exact immutable reviewed source bundle
      shell: bash
      run: |
        set -euo pipefail
        test "$(git -C proposal rev-parse HEAD)" = 8047231bbdf7f7adf40ab1fa581553d8b17e8f92
        test "$(git -C proposal rev-parse HEAD^{tree})" = 14a3028c8ca3edb4164d699c041fa0c193aeceb8
        python3 - <<'BIND'
        import pathlib,json,hashlib,os
        p=pathlib.Path('proposal');raw=(p/'release-prep/spool-2.1.2/device-source.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='d46fe01886ada5a2f8e702c934b34235bf9e48802ad7481985ba11b18933b9b4'
        expected={'baseline.py': '275655ee82b2c6621300c3d86a3d67f807f35541b12a3fba7b3fe0b45d2c1288', 'navigator.py': 'fc36b07e4b44dfdb78f30f88c76ce6c95ef8f43b9f07c65286856c2899248dd4', 'candidate59.py': 'c318db299690a4c40851bf925911c25df09f333c2ad67d0b925c97236a19aab2', 'continuous59.py': '893e672f56cf0fe22a46cecc4db14adec6fd1505a49c7c82fc663ead989a6765', 'candidate_inputs.py': 'c2afec943bc4a36143e10ea62ba91c494e03f0edeff71aa162420aecc381d89c', 'verify.py': 'bdc2e23dd4eaa9219912276760aded355f1ec5118050c310becebc87ff7ffb51', 'inspect-inputs.py': 'a560f557bb19d7880994a574af9e0352f5d6ea23463e347479912fce2cc60ea1', 'inspection-resources.json': '0e6e81de2ee5f72222e757f3c4409218a6b08c752420cade510f25f79dcd8479', 'inspect-evidence.py': '11e39584c7090959ee495778960ba91918c5b3cc8274f807955d70d781d8b323', 'artifact.py': '765ff87f4902cf89cc65cb276166bc799f97b1302424a59934a5988d7f338b36', 'build.py': 'a3711fc6ef5581ece9236d8b2b335e8de820bd693a21e7e9ca3fbb1285819245', 'platform.gradle': '0a3cd89d7c96724e3167fc2f9b226aa2c7a62b49ff887da6605e8466a10076c2', 'metadata-only.patch': 'f36d76dec3a5fc8c713e215f0653957cffec0c03a825ed9d8295073a6c609340', 'latest_after.py': 'b5c4befa08d435290941664461bade32d64497672ca4fb0607a22dd2c72d664d', 'r8_diagnostics.py': '855ab92ce4c124f839c00d4bd23bf0d2dd1380f41afe6791cdcf6b2fcb222afe'}
        def unique(pairs):
         d={}
         for k,v in pairs:
          assert k not in d;d[k]=v
         return d
        j=json.loads(raw,object_pairs_hook=unique);assert set(j)=={'schema','purpose','files','sha256'}and j['schema']==1 and j['sha256']==expected and set(j['files'])==set(expected)
        for name,digest in expected.items():
         assert pathlib.PurePosixPath(name).name==name and isinstance(j['files'][name],str)and hashlib.sha256(j['files'][name].encode()).hexdigest()==digest
         assert not(p/name).exists()
        for name in expected:(p/name).write_text(j['files'][name])
        e=pathlib.Path('evidence');e.mkdir(exist_ok=True)
        (e/'artifact-binding-source.json').write_text(json.dumps(dict(source_commit='8047231bbdf7f7adf40ab1fa581553d8b17e8f92',source_tree='14a3028c8ca3edb4164d699c041fa0c193aeceb8',bundle_sha256=hashlib.sha256(raw).hexdigest(),files=expected,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT']),indent=2))
        BIND
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - run: sdkmanager 'build-tools;35.0.0'
    - name: Fetch exact accepted producer44967542544 immutable candidate, no build
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_ARTIFACT_ID: '14732856791'
        EXPECTED_ARTIFACT_DIGEST: 8fd55d2d3f6abf89b2837ce7be67cab054f9fee3b5f545c58d8b7b1e79c604c6
      run: python3 proposal/artifact.py
    - name: Verify source, bytes, package, flags and signer before device
      run: python3 proposal/candidate_inputs.py
    - name: Recheck live stable monotonicity and cryptographically verify predecessor
      run: python3 proposal/inspect-inputs.py
      env:
        INSPECTION_METADATA_TOKEN: ${{ github.token }}
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Install pinned pixel decoder before continuous device session
      run: python3 -m pip install Pillow==11.3.0
    - name: ONE continuous same-instance58-to59 session, no Gradle/rebuild/retry
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_6
        ram-size: 2048M
        heap-size: 256M
        disk-size: 4096M
        disable-animations: false
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader -camera-back none -no-snapshot -memory 2048
          -cores 2
        force-avd-creation: true
        script: python3 proposal/continuous59.py
    - name: Recheck live predecessor race after device, no account effect
      run: python3 proposal/latest_after.py
      env:
        INSPECTION_METADATA_TOKEN: ${{ github.token }}
    - name: Evidence cleanup and file allowlist, even failures
      if: always()
      run: |-
        rm -f predecessor.apk installed.apk bundle.zip
        python3 proposal/inspect-evidence.py
    - name: Upload upgrade evidence only, never APKs or user delivery
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-continuous58to59-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: inspection-upload/
        if-no-files-found: error
        retention-days: 14
'on':
  workflow_dispatch: {}
