name: Spool stable58 offline navigation inspection only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-stable58-navigation-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f0b816db91a3a4d2cd67aa6844c26ff59cca1def
          persist-credentials: false
          path: proposal
      - name: Bind immutable source commit, raw JSON and exact six files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C proposal rev-parse HEAD)" = f0b816db91a3a4d2cd67aa6844c26ff59cca1def
          test "$(git -C proposal rev-parse HEAD^{tree})" = b7471357d335ff8b888050650bab5493d03f1020
          python3 - <<'PYBIND'
          import json,pathlib,hashlib,os
          root=pathlib.Path('proposal')
          p=root/'release-prep/spool-2.1.2/inspection-source.json'
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='1993c0563fb70e3b852443d695be307cf824ea6d7c3b6466fc7acaad016a8f35'
          def unique(pairs):
              result={}
              for k,v in pairs:
                  assert k not in result, 'Duplicate JSON key'
                  result[k]=v
              return result
          j=json.loads(raw,object_pairs_hook=unique)
          assert set(j)=={'schema','purpose','files','sha256'} and j['schema']==1
          expected={'inspect-stable.py': '105d846d72313a08746ad1f83067f066742eb26001a2862d1353aff7870691fe', 'inspect-inputs.py': '648cb5494fffb54fcf525a02604e5e926ffe33c048994a9d32db3a1e5efcf08e', 'inspect-evidence.py': '64c1a959d3d4d10d1f50be4ebad337da8df8e13b087fc0c5f0154e6f76125310', 'inspection-resources.json': '19e93683afce941a48c93dee2edf940cc6284b926184f67cd4f10393a1ad4cc5', 'navigator.py': 'cdb38392bf18596c65674d04114905d78a75ac61a6f3e829ffbcacac7e3a9a1f', 'verify.py': '250d7275f08dac7fbb5ddaee0f67ca1d0401a780046a8ce3a6bfe3badf8ae815'}
          assert set(j['files'])==set(expected) and j['sha256']==expected
          # Validate every file before writing any. Only known plain basenames.
          for name,digest in expected.items():
              assert pathlib.PurePosixPath(name).name==name and isinstance(j['files'][name],str)
              assert hashlib.sha256(j['files'][name].encode('utf-8')).hexdigest()==digest
              assert not (root/name).exists()
          for name in expected:
              path=root/name
              with path.open('xb') as f:f.write(j['files'][name].encode('utf-8'))
              assert hashlib.sha256(path.read_bytes()).hexdigest()==expected[name]
          out=pathlib.Path('source-binding');out.mkdir(exist_ok=True)
          (out/'inspection-source-binding.json').write_text(json.dumps(dict(source_commit='f0b816db91a3a4d2cd67aa6844c26ff59cca1def',source_tree='b7471357d335ff8b888050650bab5493d03f1020',bundle_sha256=hashlib.sha256(raw).hexdigest(),files=expected,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT']),indent=2))
          PYBIND
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install manifest/signature tools only, no Gradle/native compile
        run: sdkmanager 'build-tools;35.0.0'
      - name: Fetch+cryptographically verify hosted stable58 and immutable EN resources
        env:
          INSPECTION_METADATA_TOKEN: ${{ github.token }}
        run: python3 proposal/inspect-inputs.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: One bounded verified launcher-alias transition and persistence inspection
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader -camera-back none -no-snapshot -memory 2048 -cores 2
          force-avd-creation: true
          script: python3 proposal/inspect-stable.py
      - name: Install pinned PNG decoder
        if: always()
        run: python3 -m pip install Pillow==11.3.0
      - name: Validate captured bytes/pixels and stage only diagnostic allowlist
        if: always()
        run: python3 proposal/inspect-evidence.py
      - name: Remove downloaded APK even on inspection stop
        if: always()
        run: rm -f predecessor.apk
      - name: Upload evidence only, no APK/source/key/distribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spool-stable58-navigation-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: inspection-upload/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload exact source-binding proof separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spool-stable58-source-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-binding/inspection-source-binding.json
          if-no-files-found: warn
          retention-days: 14
