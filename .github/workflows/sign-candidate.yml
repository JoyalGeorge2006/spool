name: Spool calibrated emulator-output evidence
run-name: Known host and Android tone calibration before exact candidate61 focus, API34 only, no release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-calibrated-output70-20261122
  cancel-in-progress: false
jobs:
  calibrated-focus:
    if: github.ref == 'refs/heads/spool-ui-test-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image:
        - '34'
    env: {}
    steps:
    - name: Bind calibrated output and exact existing signed candidate61, no app build
      run: |
        python3 - <<'PY'
        import base64,hashlib,io,tarfile,pathlib
        raw=base64.b64decode('',validate=True)
        assert hashlib.sha256(raw).hexdigest()=='2295e478c7b741d7769930fbcd3e531beb3dc626f029239274ebb6a46b642f3f'
        with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz')as a:
         assert all(m.isfile()and '/'not in m.name for m in a.getmembers())
         a.extractall(pathlib.Path.cwd())
        PY
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare companion SDK and supported MP3 fixture encoder
      run: |-
        sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0'
        command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
        ffmpeg -version | head -n 3
    - name: Verify exact existing production APKs and build disposable focus companion only
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 focus_prepare.py
    - name: Enable disposable emulator acceleration
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Set up controlled virtual output sink, never a microphone
      run: |
        sudo apt-get update
        sudo apt-get install -y pulseaudio pulseaudio-utils libasound2-plugins alsa-utils
        mkdir -p evidence
        pulseaudio --start --exit-idle-time=-1 --log-target=file:$RUNNER_TEMP/spool-pulse.log
        pactl load-module module-null-sink sink_name=spool format=s16le rate=48000 channels=2
        pactl set-default-sink spool
        pactl set-sink-mute spool 0
        pactl set-sink-volume spool 100%
        pactl info | tee evidence/pulse-info.txt
        pactl list short sinks | tee evidence/pulse-sinks.txt
        parec --help | tee evidence/parec-help.txt
        python3 - <<'CONF'
        from pathlib import Path
        import os,subprocess,re
        Path.home().joinpath('.asoundrc').write_text('pcm.!default { type pulse }\nctl.!default { type pulse }\n')
        p=Path(os.environ['GITHUB_ENV'])
        with p.open('a')as f:
         server=re.search(r'^Server String: (.+)$',subprocess.check_output(['pactl','info']).decode(),re.M).group(1)
         f.write('PULSE_SERVER='+(server if server.startswith('unix:')else 'unix:'+server)+'\nPULSE_SINK=spool\n')
        CONF
    - name: Calibrate host and Android tones, stop on failure, then exact58 to61 focus comparison
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      env:
        EXPECTED_EMULATOR_API: ${{ matrix.image == '34' && '34' || '37' }}
        QEMU_AUDIO_DRV: alsa
        QEMU_AUDIO_OUT_DRV: alsa
        QEMU_AUDIO_IN_DRV: none
        PULSE_SINK: spool
      with:
        api-level: ${{ matrix.image }}
        system-image-api-level: ${{ matrix.image }}
        target: google_apis
        arch: x86_64
        profile: pixel_6
        ram-size: 3072M
        heap-size: 512M
        disk-size: 4096M
        disable-animations: false
        force-avd-creation: true
        emulator-options: -no-window  -no-boot-anim -gpu lavapipe -camera-back none -no-snapshot -memory 3072 -cores 2
        script: python3 focus_ab.py
        pre-emulator-launch-script: |-
          python3 - <<'PRE'
          from pathlib import Path
          import os,subprocess,json
          E=Path('evidence');E.mkdir(exist_ok=True)
          configs=list((Path.home()/'.android/avd').glob('*.avd/config.ini'));assert len(configs)==1,configs
          p=configs[0];text=p.read_text();lines=[l for l in text.splitlines()if l.partition('=')[0].strip()not in {'hw.audioInput','hw.audioOutput'}];p.write_text('\n'.join(lines)+'\nhw.audioInput=no\nhw.audioOutput=yes\n');(E/'emulator-calibrated-config.ini').write_text(p.read_text())
          exe=Path(os.environ['ANDROID_HOME'])/'emulator/emulator'
          for label,args in [('version',['-version']),('audio-help',['-help-audio']),('environment-help',['-help-environment'])]:
           r=subprocess.run([str(exe),*args],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=20);(E/('emulator-'+label+'.txt')).write_bytes(r.stdout)
          (E/'audio-environment.json').write_text(json.dumps({k:os.environ.get(k)for k in ['PULSE_SERVER','PULSE_SINK','QEMU_AUDIO_DRV','QEMU_AUDIO_OUT_DRV','QEMU_AUDIO_IN_DRV','XDG_RUNTIME_DIR']},indent=2))
          PRE
      id: output_probe
    - name: Require both calibrated paths and eighteen valid phase-window measurements
      if: always() && steps.output_probe.outcome == 'success'
      run: |
        python3 - <<'GATE'
        from pathlib import Path
        import json
        p=Path('evidence');o=json.loads((p/'emulator-output-analysis.json').read_text())
        assert o['calibrations_passed'],'Both known-tone calibration paths must pass'
        assert o['steady_state_clock_usable'],'Received PCM clock must satisfy unchanged0.5second whole-stream drift bound'
        assert len(o['episodes'])==18 and o['all_episode_windows_usable'],'Every baseline and phase timing window must be usable'
        GATE
    - name: Remove disposable keys and input APKs, never publish a build
      if: always()
      run: |
        rm -f probe-debug.keystore FocusProbe.apk probe-unsigned.apk public211.apk bundle.zip SpoolFocusFixture.wav SpoolFocusFixture.mp3
        rm -rf accepted-input candidate-tree probe-classes probe-dex
        python3 - <<'PY'
        from pathlib import Path
        p=Path('evidence');p.mkdir(exist_ok=True)
        assert all(f.is_file()and f.suffix in {'.txt','.json','.png','.xml','.pcm','.jsonl','.ini'}for f in p.iterdir())
        PY
        rm -f candidate61-bundle.zip

        rm -f host-997Hz-calibration.wav
    - name: Upload test evidence only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: calibrated-output70-api${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: evidence/
        if-no-files-found: error
        retention-days: 7
