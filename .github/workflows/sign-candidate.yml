name: Spool actual candidate61 focus and emulator output
run-name: Actual source75 signed candidate61 focus and controlled output capture, no app build or release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-candidate61-focus-output68-20261122
  cancel-in-progress: false
jobs:
  candidate-focus:
    if: github.ref == 'refs/heads/spool-ui-test-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image:
        - '34'
        - '37.0'
    env: {}
    steps:
    - name: Bind exact candidate61 and controlled host-output observation drivers
      run: |
        python3 - <<'PY'
        import base64,hashlib,io,tarfile,pathlib
        raw=base64.b64decode('',validate=True)
        assert hashlib.sha256(raw).hexdigest()=='e7f372d9dbe4da51e4918ca70cca26dc432e3203d48530d6f01507925f0af3d7'
        with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz')as a:
         assert all(m.isfile()and '/'not in m.name for m in a.getmembers())
         a.extractall(pathlib.Path.cwd())
        PY
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare companion SDK and supported MP3 fixture encoder
      run: |-
        sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0'
        command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
        ffmpeg -version | head -n 3
    - name: Verify exact existing production APKs and build disposable focus companion only
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 focus_prepare.py
    - name: Enable disposable emulator acceleration
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Set up controlled virtual output sink, never a microphone
      run: |
        sudo apt-get update
        sudo apt-get install -y pulseaudio pulseaudio-utils libasound2-plugins
        mkdir -p evidence
        pulseaudio --start --exit-idle-time=-1 --log-target=file:$RUNNER_TEMP/spool-pulse.log
        pactl load-module module-null-sink sink_name=spool format=s16le rate=48000 channels=2
        pactl set-default-sink spool
        pactl set-sink-mute spool 0
        pactl set-sink-volume spool 100%
        pactl info | tee evidence/pulse-info.txt
        pactl list short sinks | tee evidence/pulse-sinks.txt
        parec --help | tee evidence/parec-help.txt
    - name: Same-instance public58 to actual candidate61 focus and output-signal observations
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      env:
        EXPECTED_EMULATOR_API: ${{ matrix.image == '34' && '34' || '37' }}
        QEMU_AUDIO_DRV: pa
        SDL_AUDIODRIVER: pulse
      with:
        api-level: ${{ matrix.image }}
        system-image-api-level: ${{ matrix.image }}
        target: google_apis
        arch: x86_64
        profile: pixel_6
        ram-size: 3072M
        heap-size: 512M
        disk-size: 4096M
        disable-animations: false
        force-avd-creation: true
        emulator-options: -no-window  -no-boot-anim -gpu lavapipe -camera-back none -no-snapshot -memory 3072 -cores 2
        script: python3 focus_ab.py
    - name: Remove disposable keys and input APKs, never publish a build
      if: always()
      run: |
        rm -f probe-debug.keystore FocusProbe.apk probe-unsigned.apk public211.apk bundle.zip SpoolFocusFixture.wav SpoolFocusFixture.mp3
        rm -rf accepted-input candidate-tree probe-classes probe-dex
        python3 - <<'PY'
        from pathlib import Path
        p=Path('evidence');p.mkdir(exist_ok=True)
        assert all(f.is_file()and f.suffix in {'.txt','.json','.png','.xml'}for f in p.iterdir())
        PY
        rm -f candidate61-bundle.zip
    - name: Upload test evidence only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: candidate61-focus-output-api${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: evidence/
        if-no-files-found: error
        retention-days: 7
