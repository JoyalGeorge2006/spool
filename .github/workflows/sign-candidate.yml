name: Spool reviewed continuous58to59 artifact and device only
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-reviewed-continuous58to59-artifact-device-only
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 7bfe98c5ea28fad9df4f52350da95a87a0f73397
        path: proposal
        persist-credentials: false
    - name: Bind exact immutable reviewed source bundle
      shell: bash
      run: |
        set -euo pipefail
        test "$(git -C proposal rev-parse HEAD)" = 7bfe98c5ea28fad9df4f52350da95a87a0f73397
        test "$(git -C proposal rev-parse HEAD^{tree})" = 52cec6081fddf04eed1870add11476eba6ecbdf3
        python3 - <<'BIND'
        import pathlib,json,hashlib,os
        p=pathlib.Path('proposal');raw=(p/'release-prep/spool-2.1.2/continuous-source.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='e6e8d3330059496297d7b389278957dfd1c98d7a724f4d00cf040dd39d63915f'
        expected={'baseline.py': '275655ee82b2c6621300c3d86a3d67f807f35541b12a3fba7b3fe0b45d2c1288', 'navigator.py': '9f48b4bd3dc5ebccd702c2748746f3b8a02e8e432ba5e7f3ed07235bc0ca39e2', 'candidate59.py': 'c318db299690a4c40851bf925911c25df09f333c2ad67d0b925c97236a19aab2', 'continuous59.py': '7c6b6e21805e78671f875543a592df0f27c94c863ce81ea18c50fcead3d3b2b8', 'candidate_inputs.py': '300dcbb287fda6d99a4f0ffb282e2add3ceee981bd126f5c3ae0fa7aaa92481d', 'verify.py': '7058ca08e9f3f0604427bf32c3f287f9ba769ab0d90f917de8aeeb0c31255437', 'inspect-inputs.py': 'a560f557bb19d7880994a574af9e0352f5d6ea23463e347479912fce2cc60ea1', 'inspection-resources.json': '0e6e81de2ee5f72222e757f3c4409218a6b08c752420cade510f25f79dcd8479', 'inspect-evidence.py': '11e39584c7090959ee495778960ba91918c5b3cc8274f807955d70d781d8b323', 'artifact.py': '27d9f6e61eabd5f7c0ae7576b91a730a6335e81badbb5d258f7c556d0eed4010', 'build.py': '6d15c132eab88022afc2cfa77327a4957b7c47a42088a7079d29c2a00eb2b427', 'platform.gradle': '0a3cd89d7c96724e3167fc2f9b226aa2c7a62b49ff887da6605e8466a10076c2', 'metadata-only.patch': 'f36d76dec3a5fc8c713e215f0653957cffec0c03a825ed9d8295073a6c609340', 'latest_after.py': 'b5c4befa08d435290941664461bade32d64497672ca4fb0607a22dd2c72d664d', 'r8_diagnostics.py': '855ab92ce4c124f839c00d4bd23bf0d2dd1380f41afe6791cdcf6b2fcb222afe', 'test_evidence.py': 'e90fc8544d6cd72d649678db7e5e4c0a8a1b5bfaf950545ffd9421c0b2d5168f'}
        def unique(pairs):
         d={}
         for k,v in pairs:
          assert k not in d;d[k]=v
         return d
        j=json.loads(raw,object_pairs_hook=unique);assert set(j)=={'schema','purpose','files','sha256'}and j['schema']==1 and j['sha256']==expected and set(j['files'])==set(expected)
        for name,digest in expected.items():
         assert pathlib.PurePosixPath(name).name==name and isinstance(j['files'][name],str)and hashlib.sha256(j['files'][name].encode()).hexdigest()==digest
         assert not(p/name).exists()
        for name in expected:(p/name).write_text(j['files'][name])
        e=pathlib.Path('evidence');e.mkdir(exist_ok=True)
        (e/'artifact-binding-source.json').write_text(json.dumps(dict(source_commit='7bfe98c5ea28fad9df4f52350da95a87a0f73397',source_tree='52cec6081fddf04eed1870add11476eba6ecbdf3',bundle_sha256=hashlib.sha256(raw).hexdigest(),files=expected,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT']),indent=2))
        BIND
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 497507fabd0930e2801413a28f82f06363ee954c
        path: product
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare exact SDK build environment
      run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
    - name: Pinned unit-test gate, blocks build and signing on any failure
      run: |
        cd product
        timeout 1500 bash gradlew --no-daemon --console=plain --init-script ../proposal/platform.gradle '--max-workers=1' '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m' :shared:jvmTest :app:testDevDebugUnitTest
    - name: Materialize metadata-only source and build existing-key prod artifacts
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: python3 proposal/build.py
    - name: Verify final APK identity and indexed source archive
      run: python3 proposal/candidate_inputs.py
    - name: Upload only verified candidate inputs, not distribution
      id: upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-2.1.2-reviewed-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          accepted-input/manifest.json
          accepted-input/Spool-2.1.2-universal.apk
          accepted-input/Spool-2.1.2-arm64-v8a.apk
          accepted-input/source.tar.gz
        if-no-files-found: error
        retention-days: 14
    - name: Private cleanup, even failures
      if: always()
      run: |
        rm -f product/spool-debug.keystore product/keystore.properties
        # Raw build log is deliberately not uploaded: Gradle/plugin errors could
        # mention local signing properties. No failure fallback uploads APKs.
        rm -f build.log
    - name: Upload verification evidence allowlist only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-2.1.2-build-verification-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          evidence/*.cert.txt
          evidence/*.badging.txt
          evidence/*.manifest.txt
          evidence/candidate-verified.json
          evidence/candidate-inventory.json
          evidence/gradle-task-status.txt
          evidence/daemon-stop.json
          evidence/output-provenance.json
          evidence/mapping.txt

          evidence/artifact-binding-source.json
        if-no-files-found: warn
    - name: Guard test evidence before upload
      id: test_guard
      if: always()
      continue-on-error: true
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: python3 proposal/test_evidence.py
    - name: Upload guarded test evidence only
      if: ${{ always() && steps.test_guard.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-2.1.2-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          evidence/test-summary.json
          evidence/test-results/
          evidence/jvm-resource-settings.json
        if-no-files-found: warn
        retention-days: 14
    - name: Guard structured diagnostics before upload
      id: r8_guard
      if: always()
      continue-on-error: true
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: python3 proposal/r8_diagnostics.py --guard evidence/r8-diagnostics.json
    - name: Upload guarded structured diagnostics only
      if: ${{ always() && steps.r8_guard.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-r8-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: evidence/r8-diagnostics.json
        if-no-files-found: warn
        retention-days: 14
  upgrade:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 7bfe98c5ea28fad9df4f52350da95a87a0f73397
        path: proposal
        persist-credentials: false
    - name: Bind exact immutable reviewed source bundle
      shell: bash
      run: |
        set -euo pipefail
        test "$(git -C proposal rev-parse HEAD)" = 7bfe98c5ea28fad9df4f52350da95a87a0f73397
        test "$(git -C proposal rev-parse HEAD^{tree})" = 52cec6081fddf04eed1870add11476eba6ecbdf3
        python3 - <<'BIND'
        import pathlib,json,hashlib,os
        p=pathlib.Path('proposal');raw=(p/'release-prep/spool-2.1.2/continuous-source.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='e6e8d3330059496297d7b389278957dfd1c98d7a724f4d00cf040dd39d63915f'
        expected={'baseline.py': '275655ee82b2c6621300c3d86a3d67f807f35541b12a3fba7b3fe0b45d2c1288', 'navigator.py': '9f48b4bd3dc5ebccd702c2748746f3b8a02e8e432ba5e7f3ed07235bc0ca39e2', 'candidate59.py': 'c318db299690a4c40851bf925911c25df09f333c2ad67d0b925c97236a19aab2', 'continuous59.py': '7c6b6e21805e78671f875543a592df0f27c94c863ce81ea18c50fcead3d3b2b8', 'candidate_inputs.py': '300dcbb287fda6d99a4f0ffb282e2add3ceee981bd126f5c3ae0fa7aaa92481d', 'verify.py': '7058ca08e9f3f0604427bf32c3f287f9ba769ab0d90f917de8aeeb0c31255437', 'inspect-inputs.py': 'a560f557bb19d7880994a574af9e0352f5d6ea23463e347479912fce2cc60ea1', 'inspection-resources.json': '0e6e81de2ee5f72222e757f3c4409218a6b08c752420cade510f25f79dcd8479', 'inspect-evidence.py': '11e39584c7090959ee495778960ba91918c5b3cc8274f807955d70d781d8b323', 'artifact.py': '27d9f6e61eabd5f7c0ae7576b91a730a6335e81badbb5d258f7c556d0eed4010', 'build.py': '6d15c132eab88022afc2cfa77327a4957b7c47a42088a7079d29c2a00eb2b427', 'platform.gradle': '0a3cd89d7c96724e3167fc2f9b226aa2c7a62b49ff887da6605e8466a10076c2', 'metadata-only.patch': 'f36d76dec3a5fc8c713e215f0653957cffec0c03a825ed9d8295073a6c609340', 'latest_after.py': 'b5c4befa08d435290941664461bade32d64497672ca4fb0607a22dd2c72d664d', 'r8_diagnostics.py': '855ab92ce4c124f839c00d4bd23bf0d2dd1380f41afe6791cdcf6b2fcb222afe', 'test_evidence.py': 'e90fc8544d6cd72d649678db7e5e4c0a8a1b5bfaf950545ffd9421c0b2d5168f'}
        def unique(pairs):
         d={}
         for k,v in pairs:
          assert k not in d;d[k]=v
         return d
        j=json.loads(raw,object_pairs_hook=unique);assert set(j)=={'schema','purpose','files','sha256'}and j['schema']==1 and j['sha256']==expected and set(j['files'])==set(expected)
        for name,digest in expected.items():
         assert pathlib.PurePosixPath(name).name==name and isinstance(j['files'][name],str)and hashlib.sha256(j['files'][name].encode()).hexdigest()==digest
         assert not(p/name).exists()
        for name in expected:(p/name).write_text(j['files'][name])
        e=pathlib.Path('evidence');e.mkdir(exist_ok=True)
        (e/'artifact-binding-source.json').write_text(json.dumps(dict(source_commit='7bfe98c5ea28fad9df4f52350da95a87a0f73397',source_tree='52cec6081fddf04eed1870add11476eba6ecbdf3',bundle_sha256=hashlib.sha256(raw).hexdigest(),files=expected,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT']),indent=2))
        BIND
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - run: sdkmanager 'build-tools;35.0.0'
    - name: Fetch exact same-run immutable candidate artifact
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      run: python3 proposal/artifact.py
    - name: Verify source, bytes, package, flags and signer before device
      run: python3 proposal/candidate_inputs.py
    - name: Recheck live stable monotonicity and cryptographically verify predecessor
      run: python3 proposal/inspect-inputs.py
      env:
        INSPECTION_METADATA_TOKEN: ${{ github.token }}
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Install pinned pixel decoder before continuous device session
      run: python3 -m pip install Pillow==11.3.0
    - name: ONE continuous same-instance58-to59 session, no Gradle/rebuild/retry
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_6
        ram-size: 2048M
        heap-size: 256M
        disk-size: 4096M
        disable-animations: false
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader -camera-back none -no-snapshot -memory 2048
          -cores 2
        force-avd-creation: true
        script: python3 proposal/continuous59.py
    - name: Recheck live predecessor race after device, no account effect
      run: python3 proposal/latest_after.py
      env:
        INSPECTION_METADATA_TOKEN: ${{ github.token }}
    - name: Evidence cleanup and file allowlist, even failures
      if: always()
      run: |-
        rm -f predecessor.apk installed.apk bundle.zip
        python3 proposal/inspect-evidence.py
    - name: Upload upgrade evidence only, never APKs or user delivery
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-continuous58to59-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: inspection-upload/
        if-no-files-found: error
        retention-days: 14
    if: ${{ inputs.run_continuous_device }}
'on':
  workflow_dispatch:
    inputs:
      run_continuous_device:
        description: Only after separate parent-reviewed runtime authority; false is artifact-only build, not release
        type: boolean
        default: false
        required: true
