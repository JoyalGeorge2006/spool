name: Emulator service and limited-backup probes (no release)
on:
  workflow_dispatch:
jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Apply the spool patch
      run: |
        git fetch origin 9f40c70e614d4e4d978d58295f59ab12ee07b493
        git checkout FETCH_HEAD -- . ':!.github'
        test "$(git rev-parse FETCH_HEAD)" = 9f40c70e614d4e4d978d58295f59ab12ee07b493
        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1


    - name: Restore persisted key for ephemeral test APKs
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: |
        test -n "$SPOOL_DEBUG_KEYSTORE_B64"
        printf '%s' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore
        chmod 600 spool-debug.keystore
    - name: Compile target and instrumentation APKs
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDevDebug :app:assembleDevDebugAndroidTest -Pbitchord.bundleWear=false
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run real-service and limited-backup integration tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        script: |
          adb install "$(find app/build/outputs/apk/dev/debug -name '*-x86_64-debug.apk' -print -quit)"
          adb install "$(find app/build/outputs/apk/androidTest -name '*.apk' -print -quit)"
          adb shell am instrument -w -r -e class com.music.bitchord.SpoolServiceIntegrationTest,com.music.bitchord.SpoolBackupIntegrationTest app.spool.music.dev.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/spool-instrumentation.txt
          grep -E 'OK \(3 tests\)' /tmp/spool-instrumentation.txt
          adb logcat -d > /tmp/spool-device-logcat.txt
          adb exec-out screencap -p > /tmp/spool-device.png
    - name: Upload emulator evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spool-service-backup-evidence
        path: |
          /tmp/spool-instrumentation.txt
          /tmp/spool-device-logcat.txt
          /tmp/spool-device.png
          app/build/reports/**
        if-no-files-found: ignore
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Apply the spool patch
      run: |
        git fetch origin 9f40c70e614d4e4d978d58295f59ab12ee07b493
        git checkout FETCH_HEAD -- . ':!.github'
        test "$(git rev-parse FETCH_HEAD)" = 9f40c70e614d4e4d978d58295f59ab12ee07b493
        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1


    - name: Execute real Compose queue and menu-effect interactions
      run: |
        chmod +x gradlew
        xvfb-run -a ./gradlew :sharedUi:jvmTest --tests '*InlineQueueInteractionTest' --tests '*PlayerMenuRequestTest' --stacktrace
    - name: Upload interaction evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spool-compose-interactions
        path: |
          sharedUi/build/test-results/jvmTest/*.xml
          sharedUi/build/reports/tests/jvmTest/**
        if-no-files-found: ignore
