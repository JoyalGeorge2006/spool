name: Spool cumulative75 dialog-cleanup source and unit gates
run-name: Cumulative75 deferred decor-disposal fix and full unit tests, no APK or release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-cumulative75-unit-20261122
  cancel-in-progress: false
jobs:
  compile-tests:
    if: github.ref == 'refs/heads/spool-ui-test-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Bind exact cumulative75 source and cleanup ordering regression
      run: |
        python3 - <<'BIND'
        import base64,gzip,json,hashlib,pathlib
        raw=gzip.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(raw).hexdigest()=='a99c93e5bdc9f21b830f1c20552c5bb3928eac705bb4b46076bb332d83e122fa'
        files=json.loads(raw);out=pathlib.Path('/tmp/cumulative-ci');out.mkdir()
        assert set(files)=={'reviewed-files.json', 'candidate_inputs.py', 'verify.py', 'artifact.py', 'cumulative-source.patch', 'patch.sha256', 'prepare.py', 'platform.gradle', 'r8_diagnostics.py'}
        for name,value in files.items():
         assert pathlib.PurePosixPath(name).name==name
         (out/name).write_text(value)
        BIND
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare exact compatible Android SDK
      run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
    - name: Verify cumulative75 source including narrow decor-disposal fix
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_ARTIFACT_ID: '14743033926'
        EXPECTED_ARTIFACT_DIGEST: 262d19e105d963b458ff6514b45cefe4e6d87ed4baaa299e8ba6e42453f992cf
      run: python3 /tmp/cumulative-ci/prepare.py
    - name: Compile and run shared plus Android unit-test gates only
      shell: bash
      run: |-
        cd candidate-tree
        timeout 1800 bash gradlew --no-daemon --console=plain --init-script /tmp/cumulative-ci/platform.gradle --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m' -Pkotlin.compiler.execution.strategy=in-process -Pbitchord.bundleWear=false :shared:jvmTest :app:testDevDebugUnitTest
    - name: Upload source bindings, test results and selected rendered regression evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: spool-cumulative75-unit-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          evidence/cumulative-source-binding.json
          evidence/jvm-resource-settings.json
          evidence/resource-settings.json
          candidate-tree/shared/build/test-results/jvmTest/TEST-*.xml
          candidate-tree/app/build/test-results/testDevDebugUnitTest/TEST-*.xml
          candidate-tree/app/build/outputs/roborazzi/approved_addon_*.png
          candidate-tree/app/build/outputs/roborazzi/tertiary_LYRICS_SOURCES_*.png
        if-no-files-found: warn
        retention-days: 7
