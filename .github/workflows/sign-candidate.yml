name: Spool existing public58 versus delivered59 audio-focus diagnostics
run-name: Dedicated existing-APK focus driver, API34 and API37, no app build or release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-existing-apk-focus-ab
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/spool-ui-test-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
        - '34'
        - '37.0'
    env:
      EXPECTED_ARTIFACT_ID: '14743033926'
      EXPECTED_ARTIFACT_DIGEST: 262d19e105d963b458ff6514b45cefe4e6d87ed4baaa299e8ba6e42453f992cf
    steps:
    - name: Bind isolated no-build test harness
      run: |-
        python3 - <<'PY'
        import base64,hashlib,io,tarfile,pathlib
        raw=base64.b64decode('')
        assert hashlib.sha256(raw).hexdigest()=='b5aaeae49a780d3db568dae27b2e7cd37104f1941e54f15f0df64a0c44777a84'
        with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz')as a:
         assert set(a.getnames())=={'FocusProbe.java', 'focus_ab.py', 'verify.py', 'focus_device.py', 'candidate_inputs.py', 'focus_prepare.py', 'artifact.py'}
         assert all(m.isfile()and '/'not in m.name for m in a.getmembers())
         a.extractall(pathlib.Path.cwd())
        PY
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare test-companion SDK only
      run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0'
    - name: Verify exact existing production APKs and build disposable focus companion only
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 focus_prepare.py
    - name: Enable disposable emulator acceleration
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: One same-instance public58-to-delivered59 focus experiment
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      env:
        EXPECTED_EMULATOR_API: ${{ matrix.image == '34' && '34' || '37' }}
      with:
        api-level: ${{ matrix.image }}
        system-image-api-level: ${{ matrix.image }}
        target: google_apis
        arch: x86_64
        profile: pixel_6
        ram-size: 3072M
        heap-size: 512M
        disk-size: 4096M
        disable-animations: false
        force-avd-creation: true
        emulator-options: -no-window -no-audio -no-boot-anim -gpu lavapipe -camera-back none -no-snapshot -memory 3072 -cores
          2
        script: python3 focus_ab.py
    - name: Remove disposable keys and input APKs, never publish a build
      if: always()
      run: |-
        rm -f probe-debug.keystore FocusProbe.apk probe-unsigned.apk public211.apk bundle.zip SpoolFocusFixture.wav
        rm -rf accepted-input candidate-tree probe-classes probe-dex
        python3 - <<'PY'
        from pathlib import Path
        p=Path('evidence');p.mkdir(exist_ok=True)
        assert all(f.is_file()and f.suffix in {'.txt','.json','.png','.xml'}for f in p.iterdir())
        PY
    - name: Upload test evidence only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: existing-apk-focus-api${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: evidence/
        if-no-files-found: error
        retention-days: 7
