name: Spool native settled-state and first-failure isolation
run-name: Source75 strict legacy plus separate settled visible-OFF diagnostic, paired SDKs, no release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: spool-settled-native69-20261122
  cancel-in-progress: false
jobs:
  paired-native:
    if: github.ref == 'refs/heads/spool-ui-test-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Bind unchanged legacy gate plus separate settled-state diagnostic and first-failure player capture
      run: |
        python3 - <<'BIND'
        import base64,gzip,json,hashlib,pathlib
        raw=gzip.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(raw).hexdigest()=='8b5289059d81e9146cfd07050dc99fec74e328767e515d2f8188906bc0f7bcd3'
        files=json.loads(raw);out=pathlib.Path('/tmp/cumulative-ci');out.mkdir()
        assert set(files)==set(['NativePlayerActualHierarchyTest.kt', 'NativePlayerEvidenceTest.kt', 'NativeStatusFrostTest.kt', 'SpoolLifecycleSoakTest.kt', 'artifact.py', 'candidate_inputs.py', 'cumulative-source.patch', 'isolate_source.py', 'native_build.py', 'native_soak.py', 'patch.sha256', 'platform.gradle', 'prepare.py', 'r8_diagnostics.py', 'reviewed-files.json', 'verify.py'])
        for name,value in files.items():
         assert pathlib.PurePosixPath(name).name==name
         (out/name).write_text(value)
        BIND
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare exact compatible Android SDK
      run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
    - name: Verify source75 then apply only the declared sampling diagnostic when selected
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_ARTIFACT_ID: '14743033926'
        EXPECTED_ARTIFACT_DIGEST: 262d19e105d963b458ff6514b45cefe4e6d87ed4baaa299e8ba6e42453f992cf
      run: |-
        python3 /tmp/cumulative-ci/prepare.py
        python3 /tmp/cumulative-ci/isolate_source.py
        python3 /tmp/cumulative-ci/native_soak.py prepare-test
      id: prepare
    - name: Build ephemeral dev/debug app and instrumentation, never production sign
      id: native_build
      if: always() && steps.prepare.outcome == 'success'
      run: |-
        cd candidate-tree
        timeout 2100 bash gradlew --no-daemon --console=plain --init-script /tmp/cumulative-ci/platform.gradle --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m' -Pkotlin.compiler.execution.strategy=in-process -Pbitchord.bundleWear=false :app:assembleDevDebug :app:assembleDevDebugAndroidTest
        cd ..
        python3 /tmp/cumulative-ci/native_soak.py verify-apks
    - name: Free compiler-only space before the real-time emulator exercise
      if: always()
      run: |-
        rm -rf candidate-tree/app/build/intermediates candidate-tree/.gradle accepted-input bundle.zip "$HOME/.gradle/caches" "$ANDROID_HOME/ndk/27.0.12077973"
        df -h .
    - name: Enable disposable emulator acceleration
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Actual SDK34 five native tests, legacy strict test retained
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: '34'
        system-image-api-level: '34'
        target: google_apis
        arch: x86_64
        profile: pixel_6
        ram-size: 3072M
        heap-size: 512M
        disk-size: 4096M
        disable-animations: false
        force-avd-creation: true
        emulator-options: -no-window -no-audio -no-boot-anim -gpu lavapipe -camera-back none -no-snapshot -memory 3072 -cores
          2
        script: python3 /tmp/cumulative-ci/native_build.py device
      id: native_api34
      continue-on-error: true
      if: always() && steps.native_build.outcome == 'success'
      env:
        EXPECTED_NATIVE_API: '34'
    - name: Actual SDK37 five native tests, legacy strict test retained
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: '37.0'
        system-image-api-level: '37.0'
        target: google_apis
        arch: x86_64
        profile: pixel_6
        ram-size: 3072M
        heap-size: 512M
        disk-size: 4096M
        disable-animations: false
        force-avd-creation: true
        emulator-options: -no-window -no-audio -no-boot-anim -gpu lavapipe -camera-back none -no-snapshot -memory 3072 -cores
          2
        script: python3 /tmp/cumulative-ci/native_build.py device
      id: native_api37
      continue-on-error: true
      if: always() && steps.native_build.outcome == 'success'
      env:
        EXPECTED_NATIVE_API: '37'
    - name: Require actual five-test results for both verified SDKs, preserve legacy failures
      if: always() && steps.native_build.outcome == 'success'
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re,json
        checks={}
        for api in ['34','37']:
         p=Path('native-device-api'+api);t=(p/'native-instrumentation.txt').read_bytes()
         passed=bool(re.search(rb'OK \(5 tests\)',t))and b'FAILURES!!!'not in t
         checks[api]=dict(actual_expected_sdk=api,passed_all_five=passed,legacy_strict_retained=True)
        Path('evidence/native69-outcomes.json').write_text(json.dumps(checks,indent=2))
        assert all(x['passed_all_five']for x in checks.values()),'Legacy or diagnostic native failure remains; inspect per-case results'
        PY
    - name: Remove ephemeral APKs and generated signing key, no APK publication
      if: always()
      run: |-
        rm -rf private-emulator-apks candidate-tree/app/build/outputs/apk
        rm -f "$HOME/.android/debug.keystore"
    - name: Upload measured runtime, screenshots and crash/ANR evidence only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: settled-native-${{ matrix.sampling }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          evidence/
          native-device-api34/
          native-device-api37/
        if-no-files-found: error
        retention-days: 7
    strategy:
      fail-fast: false
      matrix:
        sampling:
        - auto
        - full
    env:
      SAMPLING_MODE: ${{ matrix.sampling }}
