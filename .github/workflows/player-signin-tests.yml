    - name: Restore persisted signing key
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Verify large-text actions/scrollable editor and Replay ink then final current-source regression - no APK
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: "set -euo pipefail\nchmod +x gradlew\ncat > /tmp/spool-capture-isolation.gradle <<'INIT'\nallprojects { tasks.withType(Test).configureEach { forkEvery = 1; maxParallelForks = 1 } }\nINIT\ntimeout --signal=TERM --kill-after=30s 15m ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false -I /tmp/spool-capture-isolation.gradle --tests com.music.bitchord.RemainingMobileDestinationTest --tests com.music.bitchord.ReplayAuditScreenshotTest\nmkdir -p verification\ncat > /tmp/spool-test-isolation.gradle <<'INIT'\nallprojects {\n tasks.withType(Test).configureEach {\n  forkEvery = 1\n  maxParallelForks = 1\n  if (System.getProperty('spool.skipV6') == 'true') { exclude '**/V6ScreenshotTest.class' }\n }\n}\nINIT\nset +e\ntimeout --signal=TERM --kill-after=30s 15m ./gradlew :app:testProdDebugUnitTest :shared:jvmTest :sharedUi:jvmTest --continue -Pbitchord.bundleWear=false -I /tmp/spool-test-isolation.gradle -Dspool.skipV6=true\nresult=$?\ncp -R app/build/test-results verification/full-app || true\ncp -R shared/build/test-results verification/full-shared || true\ncp -R sharedUi/build/test-results verification/full-sharedUi || true\nexit \"$result\"\n"
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audio61-mobile-repairs-current-full
        path: 'verification

          app/build/test-results

          shared/build/test-results

          sharedUi/build/test-results

          app/build/outputs/roborazzi'
        if-no-files-found: ignore
'on':
  workflow_dispatch: {}
