        '
    - name: Restore persisted signing key
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Secondary sources account sliders plus shared settings large-text repair - no APK
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: 'chmod +x gradlew

        timeout --signal=TERM --kill-after=30s 12m ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false --tests com.music.bitchord.SettingsSecondaryViewportTest --tests com.music.bitchord.SettingsLargeTextAuditTest

        '
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audio54-secondary-large-text-repaired
        path: 'app/build/test-results

          app/build/outputs/roborazzi'
        if-no-files-found: ignore
'on':
  workflow_dispatch: {}
