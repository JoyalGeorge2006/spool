        PATCH85

        echo ''76292df9af3d9544c7d2e2d8eef24788bb237f417d97aca2498c48075325d3db  /tmp/final.patch'' | sha256sum -c -

        git apply /tmp/final.patch

        rm -- app/src/main/java/com/music/bitchord/data/canvas/AppleMusicCanvas.kt app/src/main/java/com/music/bitchord/data/canvas/CanvasCache.kt app/src/main/java/com/music/bitchord/data/canvas/CanvasRepository.kt app/src/main/java/com/music/bitchord/data/canvas/CommunityCanvas.kt app/src/main/java/com/music/bitchord/data/canvas/SpotifyCanvas.kt app/src/main/java/com/music/bitchord/data/canvas/TidalCanvas.kt app/src/main/java/com/music/bitchord/playback/MusicOnlyPlayback.kt app/src/main/java/com/music/bitchord/ui/components/TopFadeBlur.kt app/src/main/java/com/music/bitchord/ui/player/CanvasArtworkPlayer.kt app/src/main/java/com/music/bitchord/ui/player/MusicVideoPlayer.kt app/src/test/java/com/music/bitchord/playback/MusicOnlyConversionTest.kt shared/src/jvmSharedMain/kotlin/com/music/bitchord/data/canvas/CanvasArtwork.kt shared/src/jvmSharedMain/kotlin/com/music/bitchord/data/canvas/SpotifyCanvasQuery.kt sharedUi/src/androidMain/kotlin/com/music/bitchord/ui/components/BlurredBackdrop.android.kt sharedUi/src/jvmMain/kotlin/com/music/bitchord/ui/components/BlurredBackdrop.jvm.kt sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/components/BlurredBackdrop.kt sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/ArtworkMeshBackdrop.kt sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/MeshGradient.kt sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/MusicVideoLayout.kt sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/PlayerVersionPill.kt web/app/src/components/music/MotionArtwork.tsx web/app/src/components/music/VideoSurface.tsx web/app/src/playback/youtube/videoDeck.ts web/app/src/shell/VideoQuality.tsx web/app/src/state/video.ts

        grep -n ''SEPARATELY_PROVIDED_UPDATES", "true"'' app/build.gradle.kts

        grep -cn ''externallyProvided'' app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt

        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"

        mkdir -p native/lame

        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

        '
    - name: Restore persisted signing key
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Final repaired secondary and subtitle pixels then same-source full mobile regression - no APK
      if: always()
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: "set -euo pipefail\nchmod +x gradlew\ntimeout --signal=TERM --kill-after=30s 12m ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false --tests com.music.bitchord.SettingsSecondaryViewportTest --tests com.music.bitchord.SettingsLargeTextAuditTest.miscellaneous_false --tests com.music.bitchord.SettingsLargeTextAuditTest.miscellaneous_true\nmkdir -p verification\ncat > /tmp/spool-test-isolation.gradle <<'INIT'\nallprojects {\n tasks.withType(Test).configureEach {\n  forkEvery = 1\n  maxParallelForks = 1\n  if (System.getProperty('spool.skipV6') == 'true') { exclude '**/V6ScreenshotTest.class' }\n }\n}\nINIT\nset +e\ntimeout --signal=TERM --kill-after=30s 15m ./gradlew :app:testProdDebugUnitTest :shared:jvmTest :sharedUi:jvmTest --continue -Pbitchord.bundleWear=false -I /tmp/spool-test-isolation.gradle -Dspool.skipV6=true\nresult=$?\ncp -R app/build/test-results verification/full-app || true\ncp -R shared/build/test-results verification/full-shared || true\ncp -R sharedUi/build/test-results verification/full-sharedUi || true\nexit \"$result\"\n"
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audio55-final-mobile-regression-secondary-subtitle
        path: 'verification

          app/build/test-results

          shared/build/test-results

          sharedUi/build/test-results

          app/build/outputs/roborazzi'
        if-no-files-found: ignore
'on':
  workflow_dispatch: {}
