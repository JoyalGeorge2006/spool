name: Spool reviewed phone compile only, no APK
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  compile:
    if: github.ref == 'refs/heads/spool-compile-audit-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and extract reviewed source only
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.15/spool-v1.9.15-source.tar.gz -o "$RUNNER_TEMP/base.tar.gz"
          echo 'e79dbaee18ee9022a344c47cbb35a4037b9ef77b4624dcd7f73e781322c1d7a7  '"$RUNNER_TEMP/base.tar.gz" | sha256sum -c -
          python3 - <<'PYCODE'
          import os,tarfile,json,hashlib,pathlib
          def unique(pattern):
              found=list(pathlib.Path('.').glob(pattern))
              assert len(found)==1,found
              return found[0]
          manifest=unique('*reviewed-source-manifest.json')
          overlay=unique('*reviewed-source-overlay.tar.gz')
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()=='189c5cb1ace8c92c4c46270b0ab2094cea4dd0166deefdcbad9f83971e3aa0fd'
          assert hashlib.sha256(overlay.read_bytes()).hexdigest()=='fecb5ccc9f13ec3b112c39003edc751e5db7dacee39130d95a521ae87d1ef3c3'
          expected=json.loads(manifest.read_text())
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'reviewed-source'
          dest.mkdir()
          for archive in [pathlib.Path(os.environ['RUNNER_TEMP'])/'base.tar.gz',overlay]:
              with tarfile.open(archive) as t:
                  for m in t.getmembers():
                      p=pathlib.PurePosixPath(m.name)
                      assert not p.is_absolute() and '..' not in p.parts,m.name
                      name=str(p)
                      if name not in expected: continue
                      assert m.isfile() and '.github' not in p.parts and '.git' not in p.parts,name
                      m.name=name
                      t.extract(m,dest,filter='data')
          actual={str(p.relative_to(dest)):hashlib.sha256(p.read_bytes()).hexdigest() for p in dest.rglob('*') if p.is_file()}
          assert actual==expected,'Source manifest mismatch'
          print('Exact reviewed source verified:',len(actual),'files. No extracted workflows.')
          PYCODE
      - name: Install local SDK prerequisites, no project changes
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Inspect compile-only task graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/reviewed-source"
          chmod +x gradlew
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.workers.max=2 -Pkotlin.compiler.execution.strategy=in-process -Pbitchord.bundleWear=false :app:compileProdDebugKotlin :app:compileProdDebugJavaWithJavac --dry-run | tee "$RUNNER_TEMP/task-plan.txt"
          python3 - <<'PY'
          import os,pathlib,re
          lines=(pathlib.Path(os.environ['RUNNER_TEMP'])/'task-plan.txt').read_text().splitlines()
          tasks=[s.split()[0].split(':')[-1] for s in lines if s.startswith(':')]
          assert 'compileProdDebugKotlin' in tasks and 'compileProdDebugJavaWithJavac' in tasks
          forbidden=[t for t in tasks if re.search(r'assemble|apk|bundleWear|dex|sign|publish|install|externalNative|buildCMake',t,re.I) or (t.lower().startswith('package') and not t.endswith('Resources'))]
          assert not forbidden,forbidden
          print('Compile-only graph accepted. No APK/package/sign/install/release tasks.')
          PY
      - name: Compile phone and Android shared dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/reviewed-source"
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.workers.max=2 -Pkotlin.compiler.execution.strategy=in-process -Pbitchord.bundleWear=false :app:compileProdDebugKotlin :app:compileProdDebugJavaWithJavac
      - name: Verify no installable app output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP/reviewed-source" -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .; then
            echo 'Unexpected installable app output'; exit 1
          fi
          echo 'No APK/AAB generated. Main and releases unchanged. No cache or artifact uploads.' >> "$GITHUB_STEP_SUMMARY"
