    - name: Restore persisted signing key
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Verify large-text Settings badge and motion root fixtures - no APK
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: 'chmod +x gradlew

        ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false --tests com.music.bitchord.SettingsLargeTextAuditTest --tests com.music.bitchord.RootInsetContractTest --tests com.music.bitchord.PlayerTransitionRegressionTest

        '
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audio40-settings-badge-root-motion
        path: 'app/build/outputs/roborazzi

          app/build/test-results

          app/build/reports/tests'
        if-no-files-found: ignore
