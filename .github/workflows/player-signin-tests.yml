name: 'Spool 1.9.17 appearance and top button release: verified source, signed APK, OTA'
'on':
  workflow_dispatch:
    inputs:
      phase:
        description: build stages a held draft; publish finishes OTA and releases after render inspection
        required: true
        type: choice
        options:
        - build
        - publish
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/spool-compile-audit-20261119' && inputs.phase == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Reconstruct exact verified appearance source on released1.9.16 base
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/theme-source";cd "$RUNNER_TEMP/theme-source"
        curl -fL --retry 2 https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.16/spool-v1.9.16-source.tar.gz -o "$RUNNER_TEMP/source.tar.gz"
        echo '673b5ec9ffc806da0abdd9371d66e8c6905b152f1bdaf149331c2c5dab63d65b  '"$RUNNER_TEMP/source.tar.gz" | sha256sum -c -
        python3 - <<'PY'
        import pathlib,tarfile,os,hashlib,base64,zlib,json
        root=pathlib.Path('.')
        with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP'])/'source.tar.gz') as t:
         for z in t.getmembers():
          p=pathlib.PurePosixPath(z.name);assert z.isfile() and not p.is_absolute() and '..' not in p.parts
          t.extract(z,root,filter='data')
        old={'app/src/test/java/com/music/bitchord/AppearanceThemingTest.kt': None, 'app/src/test/java/com/music/bitchord/AppearanceMatrixTest.kt': None, 'app/src/test/java/com/music/bitchord/AppearanceSettingsRouteTest.kt': None, 'app/src/test/java/com/music/bitchord/BlurPositiveControlTest.kt': None, 'app/src/test/java/com/music/bitchord/data/settings/BackupPreferenceTypesTest.kt': '5d9aed742f22f216142074882bc5036208752fcb5321eb744f822e689729f14e', 'app/src/main/java/com/music/bitchord/MainActivity.kt': '5161ec12258fc58b0f2405ff5af4f85fce32c7dac501db249cab5268dee76ddc', 'app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt': '520c12450a30e4f126286a79082bf1842a3590735df3f770103546f5b57cdcc6', 'app/src/main/java/com/music/bitchord/data/settings/BackupPreferenceTypes.kt': '6a5fb75df3a61bf54ea01e24d3b6bc7aaf4139acc2fd402806099a83c9dbfbbc', 'app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt': '33526c776fb922ed546fcd8825d215137c39f3bd64fd724f447ac7286c209843', 'app/src/main/java/com/music/bitchord/ui/components/FloatingBottomBar.kt': '0cdb708ffae1699a08350bd5e29488110c27c09453914d149c83e5a4addd9311', 'app/src/main/java/com/music/bitchord/ui/components/MiniPlayer.kt': 'b96dfb4696fea4789e0f8aee540126560ac2c8c4e686a3fd89c0f2cba98c0c7c', 'app/src/main/java/com/music/bitchord/ui/theme/Theme.kt': '1f0f15ed60d772ceae0dfb28eb1b5ff57f0eaa9725adbe10f2d837efb0cd3f4d', 'app/src/main/res/values/strings.xml': '70712bc6e9cb0e269e6ddd73620d4a6e1006ee3daadf1f58b5ab2677fa8da561'}
        new={'app/src/test/java/com/music/bitchord/AppearanceThemingTest.kt': 'b8ef448755d4a8ddc491674de06184ac774933e7ec2ebd3d762e87b56be972b3', 'app/src/test/java/com/music/bitchord/AppearanceMatrixTest.kt': '7c210012b4fab9d8d56c065bed3c84a2ea5ba47eee465ef6fa19ab64244fc9b4', 'app/src/test/java/com/music/bitchord/AppearanceSettingsRouteTest.kt': 'eb8cc80ebefefa0c60f3c5a4e93971971f62c2ece149e49d05722d340b3e840e', 'app/src/test/java/com/music/bitchord/BlurPositiveControlTest.kt': '27b3594eed7aed47d7d308e4476b8a076a1ada9ebe61f0efe462a5004b724899', 'app/src/test/java/com/music/bitchord/data/settings/BackupPreferenceTypesTest.kt': 'f18bf3f676b933efcaa065a1622cd902bf639d941f72fffd39c60a99b2cc9bd6', 'app/src/main/java/com/music/bitchord/MainActivity.kt': '5a4d20f02d57d5de9b7945c7e447de7e2e1d03ecc73a302d47bc425914a94809', 'app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt': '502e8008f1629760c8c6d5b24ba74588c7120d4cc66e836b21f856887ebd13e8', 'app/src/main/java/com/music/bitchord/data/settings/BackupPreferenceTypes.kt': 'b1d49d5735b3e8a5001aada22ad8c4b291babd9d7ccac8711417aa97d57d6502', 'app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt': '6e8c653552a184942f01544cd0119127e14924d8036e23bfbad6c6ffabff5f77', 'app/src/main/java/com/music/bitchord/ui/components/FloatingBottomBar.kt': '75ba2d2aae20c9735402b17726e522344c558d8ddcac7e5e4bc98a35a9a012a3', 'app/src/main/java/com/music/bitchord/ui/components/MiniPlayer.kt': '2bafd4712b322a2f75b33c02c7cf37e4fc598f5fc45e05f6c04ca928c759d3a4', 'app/src/main/java/com/music/bitchord/ui/theme/Theme.kt': '261e4b4494366722f0c42b144ec9edfb0666ce9c6603947337154108b222dd4d', 'app/src/main/res/values/strings.xml': '4d30d2e57faa4c6e14d6b9309156e06ad15e80f1b5468715a00e805f48e16638'}
        data={'app/src/test/java/com/music/bitchord/AppearanceThemingTest.kt': '', 'app/src/test/java/com/music/bitchord/AppearanceMatrixTest.kt': '', 'app/src/test/java/com/music/bitchord/AppearanceSettingsRouteTest.kt': '', 'app/src/test/java/com/music/bitchord/BlurPositiveControlTest.kt': '', 'app/src/test/java/com/music/bitchord/data/settings/BackupPreferenceTypesTest.kt': '', 'app/src/main/java/com/music/bitchord/MainActivity.kt': '', 'app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt': '', 'app/src/main/java/com/music/bitchord/data/settings/BackupPreferenceTypes.kt': '', 'app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt': '', 'app/src/main/java/com/music/bitchord/ui/components/FloatingBottomBar.kt': '', 'app/src/main/java/com/music/bitchord/ui/components/MiniPlayer.kt': '', 'app/src/main/java/com/music/bitchord/ui/theme/Theme.kt': '', 'app/src/main/res/values/strings.xml': ''}
        for name,encoded in data.items():
         p=root/name;assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==old[name],name
         b=zlib.decompress(base64.b64decode(encoded));assert hashlib.sha256(b).hexdigest()==new[name];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
        actual={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
        assert hashlib.sha256((json.dumps(actual,sort_keys=True,indent=2)+'\n').encode()).hexdigest()=='5d90cbd577ff45882481dca290001ccb8f2800ab3e686242c520cbd51c06fff3'
        print('Exact theme verification source',len(actual))
        PY
    - name: Set install-over version1.9.17 code55
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/theme-source"
        python3 - <<'PY'
        import pathlib,hashlib
        p=pathlib.Path('build.gradle.kts')
        assert hashlib.sha256(p.read_bytes()).hexdigest()=='463c8a97b0bc424c709bd7e0d8b26db46e85a33a98772fa6cd1399a2c5a2b246'
        s=p.read_text()
        assert 'extra["bitchordVersionCode"] = 54' in s and 'extra["bitchordVersionName"] = "1.9.16"' in s
        s=s.replace('extra["bitchordVersionCode"] = 54','extra["bitchordVersionCode"] = 55').replace('extra["bitchordVersionName"] = "1.9.16"','extra["bitchordVersionName"] = "1.9.17"')
        p.write_text(s)
        assert hashlib.sha256(p.read_bytes()).hexdigest()=='111db843f036186106ff6f107f5926110e7b5a36dc2c3d5115b99dc25ce22a60'
        print('Version set: 1.9.17 code55, version metadata only')
        PY
    - name: Apply approved player top button size standardization
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/theme-source"
        python3 - <<'PY'
        import pathlib,hashlib,base64,zlib
        old={'sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/NowPlayingScreen.kt': '44342be443a0a9ebbee873c5b6c58cc5b6f7ff1a5acd0f5f09a075e668e661af', 'sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/PlayerControls.kt': 'ad775524ca5173c6051de5946cc7f9168acb019c695d84cbec9e2ca24090c506', 'app/src/test/java/com/music/bitchord/PlayerCollapseControlTest.kt': 'd19a6398e8b2b296d0bafb5bff4cd3a9682558d6aba511183de3ca12ff168cff'}
        new={'sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/NowPlayingScreen.kt': '8dbe0a4d3e52b92b4c6cc6429a113958b6e56f7ee70643e15ae043cbd6bd7cc6', 'sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/PlayerControls.kt': '02e5c03cd298e74659a91675216d3717903d408db973f06490a56108bb8b8b66', 'app/src/test/java/com/music/bitchord/PlayerCollapseControlTest.kt': 'b49817d850566fdf2d0fb9f2a71f7c8f532f5c12e2e0327f7ab866c6caed6a61'}
        data={'sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/NowPlayingScreen.kt': '', 'sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/PlayerControls.kt': '', 'app/src/test/java/com/music/bitchord/PlayerCollapseControlTest.kt': ''}
        for name,encoded in data.items():
         p=pathlib.Path(name);assert hashlib.sha256(p.read_bytes()).hexdigest()==old[name],name
         b=zlib.decompress(base64.b64decode(encoded));assert hashlib.sha256(b).hexdigest()==new[name];p.write_bytes(b)
        print('Applied approved player top button standardization: both visible discs 34dp, both tap targets 48dp')
        PY
    - name: Archive exact release source with pinned hashes
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/theme-source"
        python3 - <<'PY'
        import pathlib,hashlib,json,tarfile,gzip,os
        root=pathlib.Path('.')
        manifest={str(x):hashlib.sha256(x.read_bytes()).hexdigest() for x in root.rglob('*') if x.is_file()}
        assert len(manifest)==1850
        mj=(json.dumps(manifest,sort_keys=True,indent=2)+'\n').encode()
        assert hashlib.sha256(mj).hexdigest()=='6ebf8d0a229248a31c9ea889e8801ebdaa44224918a253f18dbfe561fa2d125b'
        out=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-out';out.mkdir(exist_ok=True)
        (out/'source-manifest.json').write_bytes(mj)
        with (out/'spool-v1.9.17-source.tar.gz').open('wb') as f,gzip.GzipFile(filename='',fileobj=f,mode='wb',mtime=0) as gz,tarfile.open(fileobj=gz,mode='w') as t:
            for name in sorted(manifest):
                fp=root/name
                info=t.gettarinfo(str(fp),arcname=name)
                info.uid=info.gid=0;info.uname=info.gname='';info.mtime=0
                with fp.open('rb') as inp:t.addfile(info,inp)
        tb=(out/'spool-v1.9.17-source.tar.gz').read_bytes()
        assert hashlib.sha256(tb).hexdigest()=='8af044da1ce03348a42531b28fd7216056bb914640dd669233f66c95d7011bb7'
        print('Release source archived: 1850 files, 1.9.17 code55, verified theme source plus approved button standardization only')
        PY
    - name: Install local SDK prerequisites, no project changes
      run: |
        set -euo pipefail
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        test -n "$sdk_root" || { echo 'Android SDK root missing'; exit 1; }
        sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
        test -x "$sdkmanager" || { echo 'Android SDK manager executable missing'; exit 1; }
        "$sdkmanager" --version
        "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
        test -f "$sdk_root/platforms/android-37.0/android.jar"
        test -x "$sdk_root/build-tools/35.0.0/aapt2"
        test -d "$sdk_root/ndk/27.0.12077973"
        test -x "$sdk_root/cmake/3.22.1/bin/cmake"
    - name: Run appearance button layout and updater safety regressions
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/theme-source";chmod +x gradlew
        ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.workers.max=2 -Pkotlin.compiler.execution.strategy=in-process -Pbitchord.bundleWear=false :app:compileProdDebugKotlin :app:compileProdDebugJavaWithJavac :app:recordRoborazziProdDebug --tests 'com.music.bitchord.Palette*Test' --tests 'com.music.bitchord.AppearanceMatrixTest' --tests 'com.music.bitchord.AppearanceSettingsRouteTest' --tests 'com.music.bitchord.BlurPositiveControlTest' --tests 'com.music.bitchord.data.settings.BackupPreferenceTypesTest' --tests 'com.music.bitchord.PlayerCollapseControlTest' --tests 'com.music.bitchord.PlayerLargeTextTemporalTest' --tests 'com.music.bitchord.AppUpdateSafetyTest' --tests 'com.music.bitchord.SpoolDeltaTest' --tests 'com.music.bitchord.UpdateStoreTest' --tests 'com.music.bitchord.UpdateDownloadsTest' --tests 'com.music.bitchord.OtaFlowTest' --tests 'com.music.bitchord.UpdateAssetSelectionTest' --console=plain --stacktrace
        python3 - <<'PY'
        import pathlib,xml.etree.ElementTree as E
        files=list(pathlib.Path('app/build/test-results/testProdDebugUnitTest').glob('TEST-*.xml'));assert files,'No test reports'
        counts={k:sum(int(E.parse(f).getroot().get(k,'0')) for f in files) for k in ['tests','failures','errors','skipped']}
        print('RELEASE_GATE_COUNTS',counts)
        assert counts['tests']>0 and counts['failures']==counts['errors']==counts['skipped']==0,counts
        PY
    - name: Emit actual rendered controls through logs for inspection
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/theme-source"
        python3 - <<'PY'
        import pathlib,base64,textwrap
        for p in sorted(pathlib.Path('app/build/outputs/roborazzi').glob('*.png')):
            print('SCREENSHOT_BEGIN',p.name)
            print('\n'.join(textwrap.wrap(base64.b64encode(p.read_bytes()).decode(),100)))
            print('SCREENSHOT_END',p.name)
        PY
    - name: Build universal optimized phone release APK
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/theme-source"
        chmod +x gradlew
        ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.workers.max=2 -Pkotlin.compiler.execution.strategy=in-process -Pbitchord.bundleWear=false :app:assembleProdRelease --stacktrace --console=plain
    - name: Sign with existing identity and verify final universal APK
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/theme-source"
        test -n "$SPOOL_DEBUG_KEYSTORE_B64"
        key="$RUNNER_TEMP/spool-signing.keystore"
        trap 'rm -f "$key"' EXIT
        printf '%s' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > "$key"
        chmod 600 "$key"
        signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
        aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
        out="$RUNNER_TEMP/candidate-out"
        input='app/build/outputs/apk/prod/release/app-prod-universal-release-unsigned.apk'
        test -f "$input"
        "$signer" sign --ks "$key" --ks-key-alias spooldebug --ks-pass env:SPOOL_DEBUG_STORE_PASSWORD --key-pass env:SPOOL_DEBUG_KEY_PASSWORD --out "$out/spool.apk" "$input"
        "$signer" verify --verbose --print-certs "$out/spool.apk" | tee "$RUNNER_TEMP/cert.txt"
        grep -qi a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee "$RUNNER_TEMP/cert.txt"
        "$aapt" dump badging "$out/spool.apk" > "$RUNNER_TEMP/badging.txt"
        grep -q "package: name='app.spool.music' versionCode='55' versionName='1.9.17'" "$RUNNER_TEMP/badging.txt"
        grep -q "sdkVersion:'26'" "$RUNNER_TEMP/badging.txt"
        cp "$out/spool.apk" "$out/spool-v1.9.17.apk"
        python3 - <<'PY'
        import zipfile,pathlib,os
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-out/spool.apk'
        with zipfile.ZipFile(p) as z:
            libs={a:{n.split('/')[-1] for n in z.namelist() if n.startswith('lib/'+a+'/')} for a in ['armeabi-v7a','arm64-v8a','x86_64']}
            assert all(libs.values()) and libs['armeabi-v7a']==libs['arm64-v8a']==libs['x86_64'],libs
            assert not any(n.startswith('lib/x86/') for n in z.namelist())
        print('Verified same3ABI native library sets',len(libs['arm64-v8a']))
        PY
        cd "$out"
        sha256sum spool.apk spool-v1.9.17.apk spool-v1.9.17-source.tar.gz source-manifest.json
        stat -c '%n %s' spool.apk spool-v1.9.17.apk spool-v1.9.17-source.tar.gz
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
    - name: Stage held draft release v1.9.17 with verified assets
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/candidate-out"
        gh api repos/"$GH_REPO"/releases --paginate > "$RUNNER_TEMP/existing-releases.json"
        python3 - <<'PY'
        import json,os,pathlib
        items=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'existing-releases.json').read_text())
        found=[x for x in items if x['tag_name']=='v1.9.17']
        assert not found,'v1.9.17 release already exists; refusing to overwrite'
        live=[x for x in items if x['tag_name']=='v1.9.16']
        assert len(live)==1 and not live[0]['draft'],'Current published v1.9.16 not found'
        PY
        gh release create v1.9.17 --repo "$GH_REPO" --draft --title "Spool1.9.17" --notes "Appearance choices in Settings: Astryx neutral or Material You colours (Astryx stays the default), plus an optional blur switch for the mini-player and navigation bars, off by default with a solid fallback on older devices. The player's top collapse and menu buttons now share the same visible size, and both keep a larger tap area. Install-over update: sign-in, downloads and settings are kept." "$out/spool.apk" "$out/spool-v1.9.17.apk" "$out/spool-v1.9.17-source.tar.gz" "$out/source-manifest.json"
        echo 'DRAFT v1.9.17 staged; publish phase waits for rendered-control inspection' >> "$GITHUB_STEP_SUMMARY"
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
  publish:
    if: github.ref == 'refs/heads/spool-compile-audit-20261119' && inputs.phase == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Verify held draft, build and verify54to55 OTA delta with decoder round-trip
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        release_id=$(gh api repos/"$GH_REPO"/releases --jq '[.[]|select(.tag_name=="v1.9.17" and .draft==true)]|.[0].id')
        test -n "$release_id" && test "$release_id" != "null"
        gh api repos/"$GH_REPO"/releases/"$release_id" > draft-check.json
        python3 - <<'PY'
        import json
        r=json.load(open('draft-check.json'))
        assert r['draft'],'v1.9.17 must be the held draft from the build phase'
        a={x['name']:x for x in r['assets']}
        assert {'spool.apk','spool-v1.9.17.apk','spool-v1.9.17-source.tar.gz','source-manifest.json'} <= set(a),sorted(a)
        assert a['spool.apk']['digest']==a['spool-v1.9.17.apk']['digest']
        assert a['spool-v1.9.17-source.tar.gz']['digest']=='sha256:8af044da1ce03348a42531b28fd7216056bb914640dd669233f66c95d7011bb7'
        assert a['source-manifest.json']['digest']=='sha256:6ebf8d0a229248a31c9ea889e8801ebdaa44224918a253f18dbfe561fa2d125b'
        print('Draft assets pinned and verified')
        PY
        mkdir draft-assets
        python3 - <<'PY'
        import json
        r=json.load(open('draft-check.json'))
        keep={'spool.apk','spool-v1.9.17.apk','spool-v1.9.17-source.tar.gz','source-manifest.json'}
        with open('asset-ids.txt','w') as f:
            for x in r['assets']:
                if x['name'] in keep: f.write(str(x['id'])+' '+x['name']+'\n')
        PY
        while read -r aid aname; do
          gh api repos/"$GH_REPO"/releases/assets/"$aid" -H "Accept: application/octet-stream" > draft-assets/"$aname"
        done < asset-ids.txt
        cmp draft-assets/spool.apk draft-assets/spool-v1.9.17.apk
        mkdir src
        python3 - <<'PY'
        import tarfile,pathlib
        keep={'tools/ota/make_delta.py','tools/ota/DeltaMutationHarness.java','app/src/main/java/com/music/bitchord/data/SpoolDelta.java'}
        with tarfile.open('draft-assets/spool-v1.9.17-source.tar.gz') as t:
         for z in t.getmembers():
          if z.name in keep:
           assert z.isfile()
           t.extract(z,'src',filter='data')
        print('Delta tooling extracted from pinned release source')
        PY
        curl -fL --retry 2 https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.16/spool.apk -o base.apk
        echo '92e9f88f5dc4f1da44e3513d44616cced3f99f82c51c380f5762c9e7e954bd1e  base.apk' | sha256sum -c -
        signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
        aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
        test -x "$signer";test -x "$aapt"
        "$signer" verify --verbose --print-certs draft-assets/spool.apk | tee cert.txt
        grep -qi a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee cert.txt
        "$aapt" dump badging draft-assets/spool.apk > badging.txt
        grep -q "package: name='app.spool.music' versionCode='55' versionName='1.9.17'" badging.txt
