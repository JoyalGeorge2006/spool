name: Audio-only compile checks - no APK
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Materialize exact final source
      id: source
      run: 'set -euo pipefail

        git fetch origin 9f40c70e614d4e4d978d58295f59ab12ee07b493

        git checkout FETCH_HEAD -- . '':!.github''

        test "$(git rev-parse FETCH_HEAD)" = 9f40c70e614d4e4d978d58295f59ab12ee07b493

        echo  | base64 -d | xz -d > /tmp/final.patch

        echo ''1e71ab82404275b7041b02b0b74d69c5607b1c245c518415c03f602cad5d612d  /tmp/final.patch'' | sha256sum -c -

        git apply /tmp/final.patch

        rm -- app/src/main/java/com/music/bitchord/data/canvas/AppleMusicCanvas.kt app/src/main/java/com/music/bitchord/data/canvas/CanvasCache.kt app/src/main/java/com/music/bitchord/data/canvas/CanvasRepository.kt app/src/main/java/com/music/bitchord/data/canvas/CommunityCanvas.kt app/src/main/java/com/music/bitchord/data/canvas/SpotifyCanvas.kt app/src/main/java/com/music/bitchord/data/canvas/TidalCanvas.kt app/src/main/java/com/music/bitchord/playback/MusicOnlyPlayback.kt app/src/main/java/com/music/bitchord/ui/components/TopFadeBlur.kt app/src/main/java/com/music/bitchord/ui/player/CanvasArtworkPlayer.kt app/src/main/java/com/music/bitchord/ui/player/MusicVideoPlayer.kt app/src/test/java/com/music/bitchord/playback/MusicOnlyConversionTest.kt sharedUi/src/androidMain/kotlin/com/music/bitchord/ui/components/BlurredBackdrop.android.kt sharedUi/src/jvmMain/kotlin/com/music/bitchord/ui/components/BlurredBackdrop.jvm.kt sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/components/BlurredBackdrop.kt sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/ArtworkMeshBackdrop.kt sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/MeshGradient.kt sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/MusicVideoLayout.kt sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/PlayerVersionPill.kt web/app/src/components/music/MotionArtwork.tsx web/app/src/components/music/VideoSurface.tsx web/app/src/playback/youtube/videoDeck.ts web/app/src/shell/VideoQuality.tsx web/app/src/state/video.ts

        grep -n ''SEPARATELY_PROVIDED_UPDATES", "true"'' app/build.gradle.kts

        grep -cn ''externallyProvided'' app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt

        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"

        mkdir -p native/lame

        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

        '
    - name: Restore persisted signing key
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Focused audio-only navigation and preserved sign-in regressions, no APK
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: 'chmod +x gradlew

        ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false --tests ''com.music.bitchord.PlayerTransitionRegressionTest'' --tests ''com.music.bitchord.PlayerGestureRegressionTest'' --tests ''com.music.bitchord.playback.AudioOnlyPolicyTest'' --tests ''com.music.bitchord.SignInFlowTest'' --tests ''com.music.bitchord.SignInLoadFailureTest'' --tests ''com.music.bitchord.SignInHostRegressionTest''

        '
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audio-only-focused-regression
        path: 'app/build/reports/tests/

          shared/build/reports/tests/

          sharedUi/build/reports/tests/

          app/build/outputs/roborazzi/


          app/build/test-results/

          shared/build/test-results/

          sharedUi/build/test-results/

          '
        if-no-files-found: ignore
'on':
  workflow_dispatch: {}
