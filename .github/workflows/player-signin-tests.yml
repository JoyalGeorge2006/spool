        PATCH85

        echo ''af194d74a6926a3415aca199d025c551141c6aeb01d3265320650d98e0d2f7d5  /tmp/final.patch''
        | sha256sum -c -

        git apply --unidiff-zero /tmp/final.patch

        rm -- app/src/main/java/com/music/bitchord/data/canvas/AppleMusicCanvas.kt
        app/src/main/java/com/music/bitchord/data/canvas/CanvasCache.kt app/src/main/java/com/music/bitchord/data/canvas/CanvasRepository.kt
