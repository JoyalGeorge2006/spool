    - name: Restore persisted signing key
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Render real TV routes as offline test previews - no APK
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: 'chmod +x gradlew

        ./gradlew :tv:recordRoborazziProdDebug -Pbitchord.bundleWear=false --tests "*TvPageScreenshotTest"

        '
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audio39-tv-page-previews
        path: 'tv/build/outputs/roborazzi

          tv/build/test-results

          tv/build/reports/tests'
        if-no-files-found: ignore
'on':
  workflow_dispatch: {}
