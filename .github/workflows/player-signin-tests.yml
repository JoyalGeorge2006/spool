        import com.music.bitchord.data.SpoolDelta;
        import java.io.File;
        public class DeltaRoundTrip {
         public static void main(String[] a) throws Exception {
          if(a.length!=4)throw new IllegalArgumentException("base patch target output");
          File base=new File(a[0]),patch=new File(a[1]),target=new File(a[2]),out=new File(a[3]);
          SpoolDelta.apply(base,patch,out,base.length(),target.length(),SpoolDelta.sha256(base,()->{}),SpoolDelta.sha256(target,()->{}),()->{});
          if(java.nio.file.Files.mismatch(out.toPath(),target.toPath())!=-1)throw new AssertionError("Byte mismatch");
          System.out.println("Exact production decoder round-trip byte equality passed, host JVM only");
         }
        }
        JAVACODE
        javac -d classes src/app/src/main/java/com/music/bitchord/data/SpoolDelta.java src/tools/ota/DeltaMutationHarness.java DeltaRoundTrip.java
