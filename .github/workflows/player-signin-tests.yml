name: Spool final signed OTA verification, held draft only
'on':
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/spool-compile-audit-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Verify actual signed draft,53to54delta roundtrip and official catalog, no publication
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/final-ota\";cd \"$RUNNER_TEMP/final-ota\"\ngh api repos/\"\
        $GH_REPO\"/releases --paginate > releases.json\npython3 - <<'PY'\nimport json,pathlib\nfound=[x for x in\
        \ json.load(open('releases.json')) if x['tag_name']=='v1.9.16']\nassert len(found)==1 and found[0]['draft'],'Candidate\
        \ must be held draft'\na={x['name']:x for x in found[0]['assets']}\nexpected={'spool.apk':'92e9f88f5dc4f1da44e3513d44616cced3f99f82c51c380f5762c9e7e954bd1e','spool-v1.9.16.apk':'92e9f88f5dc4f1da44e3513d44616cced3f99f82c51c380f5762c9e7e954bd1e','source-manifest.json':'3e4f3d2c579eeb7af97a1783125e4ae754891e5bed5e3a6fb63dbf5c68bf9c37','spool-v1.9.16-source.tar.gz':'673b5ec9ffc806da0abdd9371d66e8c6905b152f1bdaf149331c2c5dab63d65b'}\n\
        for n,h in expected.items():assert a[n]['state']=='uploaded' and a[n]['digest']=='sha256:'+h,n\npathlib.Path('release-id').write_text(str(found[0]['id']))\n\
        PY\ngh release download v1.9.16 --pattern 'spool.apk' --pattern 'spool-v1.9.16-source.tar.gz' --pattern\
        \ 'source-manifest.json'\necho '92e9f88f5dc4f1da44e3513d44616cced3f99f82c51c380f5762c9e7e954bd1e  spool.apk'\
        \ | sha256sum -c -\necho '673b5ec9ffc806da0abdd9371d66e8c6905b152f1bdaf149331c2c5dab63d65b  spool-v1.9.16-source.tar.gz'\
        \ | sha256sum -c -\ncurl -fL --retry 2 https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.15/spool.apk\
        \ -o base.apk\necho '56e712fd0a19d9c76d927310105026d6c466821ac4f9f955b825c36b63ad44d4  base.apk' | sha256sum\
        \ -c -\npython3 - <<'PY'\nimport pathlib,tarfile,json,hashlib\nm=json.load(open('source-manifest.json'));assert\
        \ len(m)==1846\nroot=pathlib.Path('source');root.mkdir()\nwith tarfile.open('spool-v1.9.16-source.tar.gz')\
        \ as t:\n for z in t.getmembers():\n  p=pathlib.PurePosixPath(z.name);assert not p.is_absolute() and '..'\
        \ not in p.parts\n  assert z.isfile() and str(p) in m\n  t.extract(z,root,filter='data')\nactual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()\
        \ for p in root.rglob('*') if p.is_file()}\nassert actual==m\nprint('Final uploaded source exact1846hashes\
        \ verified')\nPY\nsigner=\"$ANDROID_HOME/build-tools/35.0.0/apksigner\"\naapt=\"$ANDROID_HOME/build-tools/35.0.0/aapt\"\
        \ntest -x \"$signer\";test -x \"$aapt\"\nfor apk in base.apk spool.apk;do\n \"$signer\" verify --verbose\
        \ --print-certs \"$apk\" | tee \"$apk.cert\"\n grep -qi a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee\
        \ \"$apk.cert\"\n \"$aapt\" dump badging \"$apk\" > \"$apk.badging\"\ndone\ngrep -q \"package: name='app.spool.music'\
        \ versionCode='53' versionName='1.9.15'\" base.apk.badging\ngrep -q \"package: name='app.spool.music' versionCode='54'\
        \ versionName='1.9.16'\" spool.apk.badging\ngrep -q \"sdkVersion:'26'\" spool.apk.badging\npython3 source/tools/ota/make_delta.py\
        \ base.apk spool.apk spool-53-to-54.spdelta > delta-metadata.json\ncat > DeltaRoundTrip.java <<'JAVACODE'\n\
        import com.music.bitchord.data.SpoolDelta;\nimport java.io.File;\npublic class DeltaRoundTrip {\n public\
        \ static void main(String[] a) throws Exception {\n  if(a.length!=4)throw new IllegalArgumentException(\"\
        base patch target output\");\n  File base=new File(a[0]),patch=new File(a[1]),target=new File(a[2]),out=new\
        \ File(a[3]);\n  SpoolDelta.apply(base,patch,out,base.length(),target.length(),SpoolDelta.sha256(base,()->{}),SpoolDelta.sha256(target,()->{}),()->{});\n\
        \  if(java.nio.file.Files.mismatch(out.toPath(),target.toPath())!=-1)throw new AssertionError(\"Byte mismatch\"\
        );\n  System.out.println(\"Exact production decoder round-trip byte equality passed, host JVM only\");\n\
        \ }\n}\n\nJAVACODE\njavac -d classes source/app/src/main/java/com/music/bitchord/data/SpoolDelta.java source/tools/ota/DeltaMutationHarness.java\
        \ DeltaRoundTrip.java\njava -Xmx64m -cp classes DeltaMutationHarness\njava -Xmx64m -cp classes DeltaRoundTrip\
        \ base.apk spool-53-to-54.spdelta spool.apk reconstructed.apk\ncmp spool.apk reconstructed.apk\n\"$signer\"\
        \ verify --verbose --print-certs reconstructed.apk\npython3 - <<'PY'\nimport json,zipfile\nm=json.load(open('delta-metadata.json'));assert\
        \ m['patch_size']<m['target_size'];assert m['base_sha256']=='56e712fd0a19d9c76d927310105026d6c466821ac4f9f955b825c36b63ad44d4';assert\
        \ m['target_sha256']=='92e9f88f5dc4f1da44e3513d44616cced3f99f82c51c380f5762c9e7e954bd1e'\nwith zipfile.ZipFile('spool.apk')\
        \ as z:\n libs={a:{n.split('/')[-1] for n in z.namelist() if n.startswith('lib/'+a+'/')} for a in ['armeabi-v7a','arm64-v8a','x86_64']};assert\
        \ all(libs.values()) and len(libs['arm64-v8a'])==14 and libs['armeabi-v7a']==libs['arm64-v8a']==libs['x86_64'];assert\
        \ not any(n.startswith('lib/x86/') for n in z.namelist())\nprint('DELTA_VERIFIED',json.dumps(m,sort_keys=True))\n\
        PY\ngh release upload v1.9.16 spool-53-to-54.spdelta --clobber\nrelease_id=$(cat release-id)\ngh api repos/\"\
        $GH_REPO\"/releases/\"$release_id\" > release-with-patch.json\npython3 - <<'PY'\nimport json,pathlib,hashlib\n\
        r=json.load(open('release-with-patch.json'));assert r['draft'] and r['tag_name']=='v1.9.16'\na={x['name']:x\
        \ for x in r['assets']};m=json.load(open('delta-metadata.json'));p=a['spool-53-to-54.spdelta'];assert p['state']=='uploaded'\
        \ and p['size']==m['patch_size'] and p['digest']=='sha256:'+m['patch_sha256']\nrecord={**{k:v for k,v in\
        \ m.items() if k!='operations'},'layout':'standalone','package':'app.spool.music','target_version':'1.9.16','target_code':54,'base_code':53,'min_sdk':26,'abi':'arm64-v8a','patch_asset_id':str(p['id'])}\n\
        pathlib.Path('spool-ota-v1.json').write_text(json.dumps({'schema':1,'patches':[record]},indent=2)+'\\n')\n\
        # Existing APK/source hashes remain pinned. Include final delta/catalog in checksum file.\nnames=['spool.apk','spool-v1.9.16.apk','spool-v1.9.16-source.tar.gz','source-manifest.json','spool-53-to-54.spdelta','spool-ota-v1.json'];rows=[]\n\
        for n in names:\n h=(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest() if pathlib.Path(n).exists()\
        \ else a[n]['digest'].removeprefix('sha256:'));rows.append(h+'  '+n)\npathlib.Path('SHA256SUMS').write_text('\\\
        n'.join(rows)+'\\n')\nprint('CATALOG_RECORD',json.dumps(record,sort_keys=True))\nPY\ngh release upload v1.9.16\
        \ spool-ota-v1.json SHA256SUMS --clobber\ngh api repos/\"$GH_REPO\"/releases/\"$release_id\" > final-release.json\n\
        python3 - <<'PY'\nimport json,pathlib,hashlib\nr=json.load(open('final-release.json'));assert r['draft'];a={x['name']:x\
        \ for x in r['assets']};assert len(a)==7\nfor name in ['spool-ota-v1.json','spool-53-to-54.spdelta','SHA256SUMS']:\n\
        \ b=pathlib.Path(name).read_bytes();assert a[name]['state']=='uploaded' and a[name]['size']==len(b) and\
        \ a[name]['digest']=='sha256:'+hashlib.sha256(b).hexdigest()\nprint('FINAL_DRAFT_ASSETS',json.dumps([{k:x[k]\
        \ for k in ['id','name','size','digest','browser_download_url']} for x in r['assets']],sort_keys=True))\n\
        print('DRAFT_ONLY_FINAL_VERIFIED',r['html_url'])\nPY\n"
