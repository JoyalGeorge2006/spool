name: Player transition and sign-in repair tests only
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Materialize exact final source
      id: source
      run: 'set -euo pipefail

        git fetch origin 9f40c70e614d4e4d978d58295f59ab12ee07b493

        git checkout FETCH_HEAD -- . '':!.github''

        test "$(git rev-parse FETCH_HEAD)" = 9f40c70e614d4e4d978d58295f59ab12ee07b493

        echo  | base64 -d | gzip -d > /tmp/final.patch

        echo ''8292b02c5ff266ca6861e152e19bcf9d48d9c17fba3f857fc116b6c7cbb0df9a  /tmp/final.patch'' | sha256sum -c -

        git apply /tmp/final.patch

        grep -n ''SEPARATELY_PROVIDED_UPDATES", "true"'' app/build.gradle.kts

        grep -cn ''externallyProvided'' app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt

        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"

        mkdir -p native/lame

        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

        '
    - name: Restore persisted signing key
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Player temporal regressions, sign-in fixtures and all unit tests
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: 'chmod +x gradlew

        ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false --tests ''com.music.bitchord.SignInLoadFailureTest'' --tests ''com.music.bitchord.SignInFlowTest'' --tests ''com.music.bitchord.SignInHostRegressionTest'' --tests ''com.music.bitchord.PlayerTransitionRegressionTest'' --tests ''com.music.bitchord.PlayerGestureRegressionTest''

        ./gradlew :app:testProdDebugUnitTest :shared:jvmTest :sharedUi:jvmTest --continue -Pbitchord.bundleWear=false

        '
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: player-signin-repair-test-reports
        path: 'app/build/reports/tests/

          shared/build/reports/tests/

          sharedUi/build/reports/tests/

          app/build/outputs/roborazzi/


          app/build/test-results/

          shared/build/test-results/

          sharedUi/build/test-results/

          '
        if-no-files-found: ignore
'on':
  workflow_dispatch: {}
