        PATCH85

        echo ''700cbdad40a1fa4d306edb4c5cfcee7fcf10d21d1cb41e86c4d1dec1c1c50f45  /tmp/final.patch''
        | sha256sum -c -

        git apply --unidiff-zero /tmp/final.patch

        rm -- app/src/main/java/com/music/bitchord/data/canvas/AppleMusicCanvas.kt
        app/src/main/java/com/music/bitchord/data/canvas/CanvasCache.kt app/src/main/java/com/music/bitchord/data/canvas/CanvasRepository.kt
        app/src/main/java/com/music/bitchord/data/canvas/CommunityCanvas.kt app/src/main/java/com/music/bitchord/data/canvas/SpotifyCanvas.kt
        app/src/main/java/com/music/bitchord/data/canvas/TidalCanvas.kt app/src/main/java/com/music/bitchord/playback/MusicOnlyPlayback.kt
        app/src/main/java/com/music/bitchord/ui/components/TopFadeBlur.kt app/src/main/java/com/music/bitchord/ui/player/CanvasArtworkPlayer.kt
        app/src/main/java/com/music/bitchord/ui/player/MusicVideoPlayer.kt app/src/test/java/com/music/bitchord/playback/MusicOnlyConversionTest.kt
        shared/src/jvmSharedMain/kotlin/com/music/bitchord/data/canvas/CanvasArtwork.kt
        shared/src/jvmSharedMain/kotlin/com/music/bitchord/data/canvas/SpotifyCanvasQuery.kt
        shared/src/jvmSharedMain/kotlin/com/music/bitchord/data/discord/DiscordApplication.kt
        sharedUi/src/androidMain/kotlin/com/music/bitchord/ui/components/BlurredBackdrop.android.kt
        sharedUi/src/jvmMain/kotlin/com/music/bitchord/ui/components/BlurredBackdrop.jvm.kt
        sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/components/BlurredBackdrop.kt
        sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/ArtworkMeshBackdrop.kt
        sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/MeshGradient.kt
        sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/MusicVideoLayout.kt
        sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/PlayerVersionPill.kt
        web/app/src/components/music/MotionArtwork.tsx web/app/src/components/music/VideoSurface.tsx
        web/app/src/playback/youtube/videoDeck.ts web/app/src/shell/VideoQuality.tsx
        web/app/src/state/video.ts

        grep -n ''SEPARATELY_PROVIDED_UPDATES", "true"'' app/build.gradle.kts

        grep -cn ''externallyProvided'' app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt

        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"

        mkdir -p native/lame

        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

        '
    - name: Prepare checks
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Station queue artwork and crop verification - NO APK
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: 'set -euo pipefail

        chmod +x gradlew

        cat > /tmp/station-isolation.gradle <<''INIT''

        allprojects { tasks.withType(Test).configureEach { forkEvery = 1; maxParallelForks
        = 1 } }

        INIT

        ./gradlew :shared:jvmTest --tests ''*StationArtworkTest'' -Pbitchord.bundleWear=false
        -I /tmp/station-isolation.gradle

        ./gradlew :app:recordRoborazziProdDebug --tests ''*StationArtworkScreenshotTest''
        -Pbitchord.bundleWear=false -I /tmp/station-isolation.gradle

        '
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audio77-station-art-test-only
        path: 'verification

          app/build/test-results

          shared/build/test-results

          sharedUi/build/test-results

          app/build/outputs/roborazzi'
        if-no-files-found: ignore
'on':
  workflow_dispatch: {}
