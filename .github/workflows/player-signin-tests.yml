    - name: Prepare checks
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Changed native cases - NO APK
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: 'set -euo pipefail

        chmod +x gradlew

        cat > /tmp/station-isolation.gradle <<''INIT''

        allprojects { tasks.withType(Test).configureEach { forkEvery = 1; maxParallelForks = 1 } }

        INIT

        ./gradlew :shared:jvmTest --tests ''*StationArtworkTest'' -Pbitchord.bundleWear=false -I /tmp/station-isolation.gradle

        status=0

        for case in AboutDeveloperScreenshotTest_dark AboutDeveloperScreenshotTest_light AboutDeveloperScreenshotTest_large AboutDeveloperScreenshotTest_creditsDark AboutDeveloperScreenshotTest_creditsLight IntegratedRootHeaderScreenshotTest_listenDark IntegratedRootHeaderScreenshotTest_listenLight IntegratedRootHeaderScreenshotTest_listenLarge IntegratedRootHeaderScreenshotTest_listenFallback StationArtworkScreenshotTest_loaded390dark StationArtworkScreenshotTest_loaded390light StationArtworkScreenshotTest_large320dark; do

        ./gradlew :app:recordRoborazziProdDebug --tests com.music.bitchord.$case -Pbitchord.bundleWear=false -I /tmp/station-isolation.gradle --info || status=1

        mkdir -p verification/$case

        cp -r app/build/test-results/testProdDebugUnitTest verification/$case/ || true

        done

        ./gradlew :app:testProdDebugUnitTest --tests ''*AppNavigatorTest'' -Pbitchord.bundleWear=false || status=1

        exit $status

        '
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audio82-native-tests
        path: 'verification

          app/build/test-results

          shared/build/test-results

          sharedUi/build/test-results

          app/build/outputs/roborazzi'
        if-no-files-found: ignore
'on':
  workflow_dispatch: {}
