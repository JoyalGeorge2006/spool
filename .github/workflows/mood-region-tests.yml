name: Mood region unit tests (no APK, no release)
on:
  push:
    branches: [spool-mood-region]
    paths: [".github/workflows/mood-region-tests.yml", "shared/**", "app/**", "sharedUi/**"]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Android platform and compileSdk remap
      shell: bash
      run: |
        set -euo pipefail
        SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SM" ] || SM="$(command -v sdkmanager)"
        "$SM" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
        cat > /tmp/platform.gradle <<'INIT'
        allprojects {
          afterEvaluate { p ->
            def android = p.extensions.findByName('android')
            if (android != null) android.compileSdkVersion('android-37.0')
          }
        }
        INIT
    - name: Unit tests (shared JVM and app dev unit tests)
      run: timeout 2400 ./gradlew --init-script /tmp/platform.gradle :shared:jvmTest :app:testDevDebugUnitTest --no-daemon --console=plain 2>&1 | tee /tmp/gradle.log; exit ${PIPESTATUS[0]}
    - name: Failure summary
      if: always()
      run: grep -E "^e: |FAILED|error:|BUILD |Test.*FAILED" /tmp/gradle.log | head -60 || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mood-test-reports
        path: |
          /tmp/gradle.log
          shared/build/reports/tests
          app/build/reports/tests
        if-no-files-found: ignore
