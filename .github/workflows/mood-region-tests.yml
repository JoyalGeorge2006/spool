name: Mood region unit tests (no APK, no release)
on:
  workflow_dispatch:
  push:
    branches: [spool-mood-region]
    paths: [".github/workflows/mood-region-tests.yml", "shared/**", "app/**", "sharedUi/**"]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Android platform and compileSdk remap
      shell: bash
      run: |
        set -euo pipefail
        SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SM" ] || SM="$(command -v sdkmanager)"
        "$SM" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
        cat > /tmp/platform.gradle <<'INIT'
        allprojects {
          afterEvaluate { p ->
            def android = p.extensions.findByName('android')
            if (android != null) android.compileSdkVersion('android-37.0')
          }
        }
        INIT
    - name: Pre-seed the Robolectric Android jar (Maven Central rate limits; checksum verified)
      shell: bash
      run: |
        P=org/robolectric/android-all-instrumented/14-robolectric-10818077-i7/android-all-instrumented-14-robolectric-10818077-i7.jar
        WANT=dd5e1d356107e9d99ebf58beb5329debe2849140
        D=$HOME/.m2/repository/$(dirname $P); mkdir -p $D
        for base in https://repo1.maven.org/maven2 https://maven-central.storage-download.googleapis.com/maven2; do
          for try in 1 2 3; do
            curl -fsSL --retry 2 -o $D/$(basename $P) "$base/$P" && GOT=$(sha1sum $D/$(basename $P) | cut -d' ' -f1)
            if [ "$GOT" = "$WANT" ]; then echo "robolectric jar verified sha1=$GOT from $base"; exit 0; fi
            sleep 20
          done
        done
        echo "could not obtain a checksum-verified jar"; rm -f $D/$(basename $P); exit 0
    - name: Unit tests (shared JVM and app dev unit tests)
      shell: bash
      run: |
        set -o pipefail
        timeout 2400 ./gradlew --init-script /tmp/platform.gradle :shared:jvmTest :app:testDevDebugUnitTest --no-daemon --console=plain 2>&1 | tee /tmp/gradle.log
    - name: Failure summary
      if: always()
      run: |
        grep -E "^e: |FAILED|BUILD |tests completed" /tmp/gradle.log | head -40 || true
        grep -B2 -A14 " FAILED$" /tmp/gradle.log | head -150 || true
        grep -l "<failure" $(find . -path "*test-results*" -name "*.xml") 2>/dev/null | head -20 || true
        find . -path "*test-results*" -name "*MusicRegion*.xml" -exec grep -m2 "<testsuite " {} \; || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mood-test-reports
        path: |
          /tmp/gradle.log
          shared/build/reports/tests
          app/build/reports/tests
        if-no-files-found: ignore
