name: OTA delta patch publisher

# Attaches SPDELTA-1 patch assets and the spool-ota-v1.json catalog to a
# release, verifying every patch by reconstructing the exact signed target
# APK through the app's real Java decoder (SpoolDelta.apply). The target
# release, its predecessor bases, every size and every hash are DISCOVERED
# from live release metadata and each APK's own manifest at run time; there
# are no per-release hardcoded pins. Uploads only missing assets; assets
# that already exist are re-verified from their published bytes, never
# replaced. The release's APKs, source archive and tag are never touched.
# Free GitHub-hosted runner only (public repo).
#
# Triggers, in order of immediacy:
#   workflow_call  - every release publisher pipeline invokes this as its final
#                    gating job right after the release's own verification
#                    passes. Immediate for every publisher that includes it;
#                    the run fails if any patch fails to verify.
#   release:published - fires when a human publishes a release. GitHub does
#                    NOT fire it for GITHUB_TOKEN-published releases.
#   workflow_run   - fires when a known publisher workflow completes; works
#                    for token-published releases because workflow completion
#                    events are generated by GitHub, not by the token. Covers
#                    the publishers listed by exact name below.
#   schedule       - daily backstop that heals the latest release if its
#                    patches are missing; can lag (GitHub schedules are best
#                    effort), so it is a supplement, never the primary path.
#   workflow_dispatch - manual override, optional tag.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach delta patches to (default: latest release)'
        required: false
        default: ''
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: ''
  release:
    types: [published]
  workflow_run:
    workflows:
      - 'Publish accepted Spool 2.1.1 and verify OTA discovery'
      - 'spool 2.1.0 prerelease from verified artifact'
    types: [completed]
  schedule:
    - cron: '47 19 * * *'

permissions:
  contents: write
  actions: read

env:
  REPO: JoyalGeorge2006/spool
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish-deltas:
    runs-on: ubuntu-latest
    steps:
      - name: Discover target release and predecessor bases from live metadata
        run: |
          set -euo pipefail
          mkdir -p ota && cd ota
          cat > discover.py <<'DISCOVER_EOF'
          """Discover the target release and its predecessor patch bases from live
          release metadata. No hardcoded per-release pins: everything comes from the
          GitHub Releases API plus each APK's own manifest/native-code (via aapt).

          Writes, in the current directory:
            bases.tsv   name<TAB>base release tag<TAB>asset name<TAB>versionCode<TAB>size<TAB>sha256
            target.env  TAG=, TARGET_ASSET=, TCODE=, TSIZE=, THASH=
          Prints the plan. Fails (no writes) on any inconsistency.
          """
          import json, os, re, subprocess, sys

          REPO = os.environ['REPO']
          TAG_ARG = sys.argv[1] if len(sys.argv) > 1 else ''
          MIN_DECODER_CODE = 55   # lowest versionCode verified to ship SpoolDelta (v1.9.17)
          MAX_BASE_RELEASES = 3   # how many immediate predecessor releases to support

          def api(path):
              r = subprocess.run(['gh', 'api', path], capture_output=True, text=True)
              if r.returncode != 0:
                  sys.exit('gh api failed: ' + path + '\n' + r.stderr[:400])
              return json.loads(r.stdout)

          def aapt_path():
              home = os.environ.get('ANDROID_HOME', '')
              import glob
              cands = sorted(glob.glob(home + '/build-tools/*/aapt'))
              if not cands:
                  sys.exit('aapt not found under ANDROID_HOME=' + home)
              return cands[-1]

          AAPT = aapt_path() if os.environ.get('DISCOVER_TEST') != '1' else None

          def badging(apk):
              out = subprocess.run([AAPT, 'dump', 'badging', apk],
                                   capture_output=True, text=True).stdout
              m = re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']*)'", out)
              nc = re.search(r'native-code: (.*)', out)
              abis = set(re.findall(r"'([^']+)'", nc.group(1))) if nc else set()
              return m.group(1), int(m.group(2)), m.group(3), abis

          def download(tag, asset, out):
              subprocess.run(['gh', 'release', 'download', tag, '--repo', REPO,
                              '--pattern', asset, '--output', out, '--clobber'],
                             check=True, capture_output=True, text=True)

          def plan(rels, tag_arg, inspect):
              """Pure selection logic (fixture-testable). inspect(release, asset)->(pkg,code,ver,abis)"""
              rels = [r for r in rels if not r['draft']]
              if not rels:
                  sys.exit('no non-draft releases')
              tag = tag_arg or rels[0]['tag_name']
              ti = next((i for i, r in enumerate(rels) if r['tag_name'] == tag), None)
              if ti is None:
                  sys.exit('target tag not found: ' + tag)
              target = rels[ti]
              tapks = [a for a in target['assets'] if a['name'].endswith('.apk')]
              if not tapks:
                  sys.exit('target release has no APK asset')
              pref = next((a for a in tapks if a['name'] == 'spool.apk'),
                          max(tapks, key=lambda a: a['size']))
              tpkg, tcode, tver, _ = inspect(target, pref)
              if tpkg != 'app.spool.music':
                  sys.exit('target package mismatch: ' + tpkg)
              rows, emitted = [], set()
              cands = {}  # code -> {kind -> (name, tag, asset, code, size, sha)}
              for r in rels[ti + 1: ti + 9]:
                  apks = sorted((a for a in r['assets'] if a['name'].endswith('.apk')),
                                key=lambda a: -a['size'])
                  for a in apks[:2]:
                      pkg, code, ver, abis = inspect(r, a)
                      if pkg != 'app.spool.music' or code < MIN_DECODER_CODE or code >= tcode:
                          continue
                      kind = 'arm64' if abis == {'arm64-v8a'} else ('universal' if len(abis) > 1 else None)
                      if kind is None:
                          continue
                      slot = cands.setdefault(code, {})
                      if kind in slot:
                          continue
                      suffix = '-arm64' if kind == 'arm64' else ''
                      name = 'spool-%d%s-to-%d.spdelta' % (code, suffix, tcode)
                      slot[kind] = (name, r['tag_name'], a['name'], str(code),
                                    str(a['size']), a['digest'].replace('sha256:', ''))
              for code in sorted(cands, reverse=True)[:MAX_BASE_RELEASES]:
                  for kind in ('universal', 'arm64'):
                      if kind in cands[code]:
                          rows.append(cands[code][kind])
              if not rows:
                  sys.exit('no usable predecessor bases found')
              return tag, target, pref, tcode, tver, rows

          def main():
              rels = api('repos/%s/releases?per_page=30' % REPO)
              def inspect(r, a):
                  fn = 'disc-%s.apk' % a['id']
                  download(r['tag_name'], a['name'], fn)
                  return badging(fn)
              tag, target, pref, tcode, tver, rows = plan(rels, TAG_ARG, inspect)
              with open('bases.tsv', 'w') as f:
                  for row in rows:
                      f.write('\t'.join(row) + '\n')
              with open('target.env', 'w') as f:
                  f.write('TAG=%s\nTARGET_ASSET=%s\nTCODE=%s\nTSIZE=%s\nTHASH=%s\n' % (
                      tag, pref['name'], tcode, pref['size'],
                      pref['digest'].replace('sha256:', '')))
              print('target %s (code %d, asset %s)' % (tag, tcode, pref['name']))
              for row in rows:
                  print('base %s from %s (%s bytes)' % (row[0], row[1], row[4]))

          if __name__ == '__main__':
              main()
          DISCOVER_EOF
          python3 discover.py "${{ inputs.release_tag || github.event.release.tag_name || '' }}"
          cat bases.tsv
          set -a; . ./target.env; set +a
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Fetch OTA tooling from the exact release source tag
        run: |
          set -euo pipefail
          cd ota
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$TAG/tools/ota/make_delta.py" -o make_delta.py
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$TAG/app/src/main/java/com/music/bitchord/data/SpoolDelta.java" -o SpoolDelta.java
          python3 -c "import ast; ast.parse(open('make_delta.py').read())"
          grep -q 'MAGIC' SpoolDelta.java

      - name: Build the shipped Java decoder verifier
        run: |
          set -euo pipefail
          cd ota
          cat > DeltaApply.java <<'JAVA_EOF'
          import com.music.bitchord.data.SpoolDelta;
          import java.io.File;
          public final class DeltaApply {
            public static void main(String[] a) throws Exception {
              SpoolDelta.apply(new File(a[0]), new File(a[1]), new File(a[2]),
                  Long.parseLong(a[3]), Long.parseLong(a[4]), a[5], a[6], () -> {});
            }
          }
          JAVA_EOF
          mkdir -p src/com/music/bitchord/data
          cp SpoolDelta.java src/com/music/bitchord/data/
          javac -d classes src/com/music/bitchord/data/SpoolDelta.java DeltaApply.java

      - name: Download and hash-check target and base APKs
        run: |
          set -euo pipefail
          cd ota
          set -a; . ./target.env; set +a
          gh release download "$TAG" --repo "$REPO" --pattern "$TARGET_ASSET" --output target.apk --clobber
          [ "$(sha256sum target.apk | cut -d' ' -f1)" = "$THASH" ] || { echo "TARGET HASH MISMATCH"; exit 1; }
          [ "$(stat -c%s target.apk)" = "$TSIZE" ] || { echo "TARGET SIZE MISMATCH"; exit 1; }
          echo "target.apk matches discovered metadata: $THASH ($TSIZE bytes, code $TCODE)"
          while IFS=$'\t' read -r name btag asset code size hash; do
            gh release download "$btag" --repo "$REPO" --pattern "$asset" --output "base-$code-$name.apk" --clobber
            actual=$(sha256sum "base-$code-$name.apk" | cut -d' ' -f1)
            [ "$actual" = "$hash" ] || { echo "BASE HASH MISMATCH $name: $actual != $hash"; exit 1; }
            [ "$(stat -c%s "base-$code-$name.apk")" = "$size" ] || { echo "BASE SIZE MISMATCH $name"; exit 1; }
          done < bases.tsv
          echo "All base APKs match their discovered release digests."

      - name: Generate or adopt patches, verify reconstruction with the shipped decoder
        run: |
          set -euo pipefail
          cd ota
          set -a; . ./target.env; set +a
          # Remove mis-named leftovers from earlier broken runs of this workflow (never the release's own assets)
          for a in $(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name | startswith("gen-")) | .id'); do
            echo "Removing mis-named leftover asset $a"
            gh api -X DELETE "repos/$REPO/releases/assets/$a"
          done
          : > used.tsv
          while IFS=$'\t' read -r name btag asset code size hash; do
            base="base-$code-$name.apk"
            existing=$(gh api "repos/$REPO/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$name\") | .id" || true)
            if [ -n "$existing" ]; then
              echo "$name already published (asset $existing): re-verifying published bytes"
              gh release download "$TAG" --repo "$REPO" --pattern "$name" --output "use-$name" --clobber
            else
              python3 make_delta.py "$base" target.apk "gen-$name" > "gen-$name.json"
              cp "gen-$name" "$name"
              gh release upload "$TAG" "$name" --repo "$REPO"
              gh release download "$TAG" --repo "$REPO" --pattern "$name" --output "use-$name" --clobber
            fi
            meta=$(gh api "repos/$REPO/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$name\") | [.id, .size, (.digest | sub(\"sha256:\";\"\"))] | @tsv")
            pid=$(echo "$meta" | cut -f1); psize=$(echo "$meta" | cut -f2); phash=$(echo "$meta" | cut -f3)
            [ "$(sha256sum "use-$name" | cut -d' ' -f1)" = "$phash" ] || { echo "PATCH HASH MISMATCH $name"; exit 1; }
            rm -f out.apk
            java -Xmx256m -cp classes DeltaApply "$base" "use-$name" out.apk "$size" "$TSIZE" "$hash" "$THASH"
            cmp out.apk target.apk
            echo "VERIFIED $name: published bytes reconstruct the signed target APK exactly (asset $pid, $psize bytes)"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$name" "$code" "$size" "$hash" "$psize" "$phash" >> used.tsv
            echo "$pid" >> ids.txt
          done < bases.tsv

      - name: Retain verified 2.1.2 test-base coverage for 2.1.4
        # This private test base was not a public predecessor release. Its patch
        # was reconstructed byte-for-byte with the shipped decoder before upload.
        # Pin its immutable bytes, header and exact target before catalog adoption.
        # Do not infer a base from a version label or weaken installed APK hashing.
        run: |
          set -euo pipefail
          cd ota
          set -a; . ./target.env; set +a
          python3 - <<'RETAIN_EOF'
          import hashlib, json, os, struct, subprocess
          expected_target = '7eca7902aceb8f730ae2026a90250caa4d53b885bf6105d89d2030f662cf1d19'
          if os.environ['TAG'] != 'v2.1.4':
              raise SystemExit(0)
          assert os.environ['THASH'] == expected_target
          assert int(os.environ['TCODE']) == 63 and int(os.environ['TSIZE']) == 153991309
          name = 'spool-59-arm64-to-63.spdelta'
          base_hash = '1126371f6446c2bc115c0311935f769ffe57c92e8eedaec1dba31c5da69f7046'
          patch_hash = '6c209cfe7f8fcf413f8a63a6179a2edfcc83c60a57b0bb94897e38c3f516c26f'
          release = json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['REPO']+'/releases/tags/v2.1.4']))
          matches = [a for a in release['assets'] if a['name'] == name]
          assert len(matches) <= 1, 'Ambiguous test-base patch asset'
          if not matches:
              # Recover only the already-delivered exact test APK. Artifact expiry
              # fails closed; it never authorizes a rebuild or different base.
              import glob
              subprocess.run(['gh','run','download','44994216959','--repo',os.environ['REPO'],'--name','spool-2.1.2-reviewed-candidate-44994216959-1','--dir','test-base59'],check=True)
              bases = [p for p in glob.glob('test-base59/**/*.apk',recursive=True)
                       if os.path.getsize(p) == 84374401 and hashlib.sha256(open(p,'rb').read()).hexdigest() == base_hash]
              assert len(bases) == 1, 'Exact delivered test APK not recovered'
              base = bases[0]
              subprocess.run(['python3','make_delta.py',base,'target.apk',name],check=True)
              assert os.path.getsize(name) == 41286879 and hashlib.sha256(open(name,'rb').read()).hexdigest() == patch_hash
              subprocess.run(['java','-Xmx64m','-cp','classes','DeltaApply',base,name,'test59-roundtrip.apk','84374401','153991309',base_hash,expected_target],check=True)
              assert hashlib.sha256(open('test59-roundtrip.apk','rb').read()).hexdigest() == expected_target
              subprocess.run(['cmp','test59-roundtrip.apk','target.apk'],check=True)
              subprocess.run(['gh','release','upload','v2.1.4',name,'--repo',os.environ['REPO']],check=True)
              release = json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['REPO']+'/releases/tags/v2.1.4']))
              matches = [a for a in release['assets'] if a['name'] == name]
          assert len(matches) == 1, 'Test-base upload not confirmed'
          asset = matches[0]
          assert asset['state'] == 'uploaded' and asset['size'] == 41286879
          assert asset['digest'] == 'sha256:'+patch_hash
          subprocess.run(['gh','release','download','v2.1.4','--repo',os.environ['REPO'],'--pattern',name,'--output','retained.spdelta','--clobber'],check=True)
          payload = open('retained.spdelta','rb').read()
          assert len(payload) == 41286879 and hashlib.sha256(payload).hexdigest() == patch_hash
          assert payload[:8] == b'SPDELTA\x01'
          assert struct.unpack('>QQ',payload[8:24]) == (84374401,153991309)
          assert payload[24:56].hex() == base_hash and payload[56:88].hex() == expected_target
          assert 0 < struct.unpack('>I',payload[88:92])[0] <= 100000
          rows = open('used.tsv').read().splitlines()
          assert all(r.split('\t')[1] != '59' for r in rows), 'Duplicate test base'
          with open('used.tsv','a') as f:
              f.write('\t'.join([name,'59','84374401',base_hash,'41286879',patch_hash])+'\n')
          with open('ids.txt','a') as f:
              f.write(str(asset['id'])+'\n')
          print('Retained exact verified test-base patch: code59 to code63')
          RETAIN_EOF

      - name: Publish catalog spool-ota-v1.json
        run: |
          set -euo pipefail
          cd ota
          set -a; . ./target.env; set +a
          python3 - "$THASH" "$TSIZE" "$TCODE" "$TAG" <<'PY_EOF'
          import json, sys
          thash, tsize, tcode, tag = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]
          version = tag.lstrip('v')
          patches = []
          ids = [l.strip() for l in open('ids.txt') if l.strip()]
          rows = [l.rstrip('\n').split('\t') for l in open('used.tsv') if l.strip()]
          assert len(rows) == len(ids), 'row/id count mismatch'
          for (name, code, bsize, bhash, psize, phash), pid in zip(rows, ids):
              patches.append({
                  'format': 'spdelta-1', 'layout': 'standalone',
                  'package': 'app.spool.music',
                  'target_version': version, 'target_code': tcode,
                  'target_size': tsize, 'target_sha256': thash,
                  'base_code': int(code), 'base_size': int(bsize), 'base_sha256': bhash,
                  'min_sdk': 26, 'abi': 'arm64-v8a',
                  'patch_asset_id': pid, 'patch_size': int(psize), 'patch_sha256': phash,
              })
          assert len({p['base_sha256'] for p in patches}) == len(patches), 'ambiguous base hashes'
          json.dump({'schema': 1, 'patches': patches}, open('spool-ota-v1.json', 'w'), indent=2)
          print(json.dumps({'entries': len(patches)}))
          PY_EOF
          newh=$(sha256sum spool-ota-v1.json | cut -d' ' -f1)
          live=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="spool-ota-v1.json") | [.id, (.digest | sub("sha256:";""))] | @tsv' || true)
          if [ -n "$live" ] && [ "$(echo "$live" | cut -f2)" = "$newh" ]; then
            echo "catalog already current (sha256 $newh) - leaving published asset untouched"
          else
            [ -z "$live" ] || gh api -X DELETE "repos/$REPO/releases/assets/$(echo "$live" | cut -f1)"
            gh release upload "$TAG" spool-ota-v1.json --repo "$REPO"
          fi

      - name: Refresh SHA256SUMS.txt (original entries preserved)
        run: |
          set -euo pipefail
          cd ota
          gh release download "$TAG" --repo "$REPO" --pattern 'SHA256SUMS.txt' --output sums.txt --clobber || touch sums.txt
          grep -v -e '\.spdelta$' -e 'spool-ota-v1\.json$' sums.txt > sums.new || true
          while IFS=$'\t' read -r name code size hash psize phash; do
            printf '%s  %s\n' "$phash" "$name" >> sums.new
          done < used.tsv
          chash=$(sha256sum spool-ota-v1.json | cut -d' ' -f1)
          printf '%s  %s\n' "$chash" 'spool-ota-v1.json' >> sums.new
          newh=$(sha256sum sums.new | cut -d' ' -f1)
          live=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="SHA256SUMS.txt") | [.id, (.digest | sub("sha256:";""))] | @tsv' || true)
          if [ -n "$live" ] && [ "$(echo "$live" | cut -f2)" = "$newh" ]; then
            echo "SHA256SUMS.txt already current - leaving published asset untouched"
          else
            [ -z "$live" ] || gh api -X DELETE "repos/$REPO/releases/assets/$(echo "$live" | cut -f1)"
            cp sums.new SHA256SUMS.txt
            gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO"
          fi
          cat sums.new

      - name: Final public verification from download URLs
        run: |
          set -euo pipefail
          cd ota
          set -a; . ./target.env; set +a
          mkdir -p pub && cd pub
          baseurl="https://github.com/$REPO/releases/download/$TAG"
          while IFS=$'\t' read -r name code size hash psize phash; do
            curl -fsSL "$baseurl/$name" -o "$name"
            [ "$(sha256sum "$name" | cut -d' ' -f1)" = "$phash" ] || { echo "PUBLIC HASH MISMATCH $name"; exit 1; }
            [ "$(stat -c%s "$name")" = "$psize" ] || { echo "PUBLIC SIZE MISMATCH $name"; exit 1; }
          done < ../used.tsv
          curl -fsSL "$baseurl/spool-ota-v1.json" -o catalog.json
          [ "$(sha256sum catalog.json | cut -d' ' -f1)" = "$(sha256sum ../spool-ota-v1.json | cut -d' ' -f1)" ] || { echo "PUBLIC CATALOG MISMATCH"; exit 1; }
          python3 - "$TCODE" <<'PY_EOF'
          import json, sys
          cat = json.load(open('catalog.json'))
          tcode = int(sys.argv[1])
          assert cat['schema'] == 1
          entries = cat['patches']
          assert 1 <= len(entries) <= 16
          for p in entries:
              assert p['target_code'] == tcode and p['base_code'] < tcode
              assert len(p['patch_sha256']) == 64 and len(p['base_sha256']) == 64
          assert len({p['base_sha256'] for p in entries}) == len(entries)
          print('public catalog OK:', len(entries), 'entries for target_code', tcode)
          PY_EOF
          echo 'PUBLIC CATALOG AND ALL PUBLISHED PATCHES HASH-VERIFIED'
