name: release built APK

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download the built spool.apk
      uses: actions/download-artifact@v4
      with:
        name: spool-apk
        run-id: 43711787746
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish spool.apk as a GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ls -la
        tag="v6-test-$(date -u +%Y%m%d-%H%M%S)"
        gh release create "$tag" --repo JoyalGeorge2006/spool --title "spool v6 test build ($tag)" --notes "Automated debug-signed test build. Installs as spool. Built from the v6-source branch." spool.apk
