name: Verify approved Search spacing (no release)
on:
  push:
    branches: [spool-song-menu-cleanup]
    paths: [.github/workflows/spool-search-spacing.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved presentation-only change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip,base64,hashlib
          assert hashlib.sha256(Path('sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/screens/SearchScreen.kt').read_bytes()).hexdigest() == '034608e4f573347e7835c98376f03706fce37b84c555abb45d763efd855db1c1'
          Path('sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/screens/SearchScreen.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          assert hashlib.sha256(Path('app/src/test/java/com/music/bitchord/LibrarySpacingProofTest.kt').read_bytes()).hexdigest() == '95690f67f043e868c6e5387acf3defcedec6f372222bfe53090ee9f7ef53ebd4'
          Path('app/src/test/java/com/music/bitchord/LibrarySpacingProofTest.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          assert hashlib.sha256(Path('app/src/test/java/com/music/bitchord/FloatingSearchFlowTest.kt').read_bytes()).hexdigest() == '1ff3b10f7004a1c7f5d80c464157c1670495c7a951df2719ba6cfa8f951c4fbc'
          Path('app/src/test/java/com/music/bitchord/FloatingSearchFlowTest.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/screens/SearchScreen.kt app/src/test/java/com/music/bitchord/LibrarySpacingProofTest.kt app/src/test/java/com/music/bitchord/FloatingSearchFlowTest.kt
          git commit -m 'Balance approved Search field-to-source gap without resizing controls'
          git push origin HEAD:spool-song-menu-cleanup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          cat > /tmp/platform.gradle <<'INIT'
          allprojects { afterEvaluate { p -> def a = p.extensions.findByName('android'); if(a != null) a.compileSdkVersion('android-37.0') } }
          INIT
      - name: Render actual Compose motion frames and regressions
        run: |
          ./gradlew --init-script /tmp/platform.gradle :app:testDevDebugUnitTest --tests com.music.bitchord.SparkRatingMotionTest --tests com.music.bitchord.OverflowScrollScreenshotTest --tests com.music.bitchord.DislikeSkipPolicyTest --tests com.music.bitchord.FloatingSearchFlow* --tests com.music.bitchord.StableMenuRowsTest --tests com.music.bitchord.LibrarySpacingProofTest --no-daemon --stacktrace 2>&1 | tee motion-test.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-motion-proof
          path: |
            **/build/outputs/roborazzi/
            **/build/test-results/
            **/build/reports/tests/
            motion-test.log
