    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare platform and native dependency
      shell: bash
      run: |
        set -euo pipefail
        sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
        cat > /tmp/platform.gradle <<'INIT'
        allprojects {
          afterEvaluate { p ->
            def android = p.extensions.findByName('android')
            if (android != null) android.compileSdkVersion('android-37.0')
          }
        }
        gradle.taskGraph.whenReady { graph ->
          if (graph.allTasks.any { it.name =~ /(?i)(assemble|package.*apk|sign.*apk|install.*|publish.*|deploy.*)/ }) {
            throw new GradleException('Forbidden task in validation graph')
          }
        }
        INIT
        curl -fL -o /tmp/lame.tar.gz https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
        mkdir -p "$SRC_DIR/native/lame"
        tar xzf /tmp/lame.tar.gz -C "$SRC_DIR/native/lame" --strip-components=1
    - name: Prove compile and capture graph has no APK or publication tasks
      shell: bash
      run: |
        set -euo pipefail
        cd "$SRC_DIR"
        ./gradlew --init-script /tmp/platform.gradle :app:recordRoborazziDevDebug -Pbitchord.bundleWear=false --dry-run | tee /tmp/graph.txt
        if grep -qiE 'assemble|package.*Apk|sign.*Apk|install|publish|deploy' /tmp/graph.txt; then exit 1; fi
    - name: Compile candidate and record focused production components
      shell: bash
      run: |
        set -euo pipefail
        cd "$SRC_DIR"
        ./gradlew --init-script /tmp/platform.gradle :app:recordRoborazziDevDebug -Pbitchord.bundleWear=false \
          --tests 'com.music.bitchord.FloatingCapsuleScreenshotTest' \
          --tests 'com.music.bitchord.BroadRouteScreenshotTest' \
          --tests 'com.music.bitchord.ThemeStyleMatrixTest'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: floating-candidate-diagnostics
        path: |
          ${{ runner.temp }}/asset/app/build/outputs/roborazzi/*.png
          ${{ runner.temp }}/asset/app/build/test-results/**/*.xml
          /tmp/graph.txt
        if-no-files-found: warn
