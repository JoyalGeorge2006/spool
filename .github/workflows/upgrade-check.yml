name: private candidate upgrade retention check
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Known older test candidate with raw splits (not phone version)
        required: true
        default: '43815841443'
      target_run:
        description: Repair candidate run with raw splits
        required: true
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - name: Download exact candidates
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh run download "${{ inputs.baseline_run }}" -n raw-apk-splits -D "$RUNNER_TEMP/baseline" --repo JoyalGeorge2006/spool
        gh run download "${{ inputs.target_run }}" -n raw-apk-splits -D "$RUNNER_TEMP/target" --repo JoyalGeorge2006/spool
        cp "$RUNNER_TEMP/baseline"/*-x86_64-debug.apk "$RUNNER_TEMP/baseline.apk"
        cp "$RUNNER_TEMP/target"/*-x86_64-debug.apk "$RUNNER_TEMP/target.apk"
        signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
        "$signer" verify --print-certs "$RUNNER_TEMP/baseline.apk" | tee /tmp/baseline-certs.txt
        "$signer" verify --print-certs "$RUNNER_TEMP/target.apk" | tee /tmp/target-certs.txt
        diff /tmp/baseline-certs.txt /tmp/target-certs.txt
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Normal replace without uninstall or clear, seeded settings and local like
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_6
        force-avd-creation: true
        script: |
          echo  | base64 -d > /tmp/upgrade.sh
          bash /tmp/upgrade.sh
    - name: Upload private upgrade evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upgrade-evidence
        path: ${{ runner.temp }}/pages/
