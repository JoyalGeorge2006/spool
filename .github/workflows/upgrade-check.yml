name: private candidate upgrade retention with archived baseline option
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Known older test candidate with raw splits (not phone version)
        required: true
        default: '43815841443'
      target_run:
        description: Repair candidate run with raw splits
        required: true
      archived_seed:
        description: Restore exact older CI baseline state from successful prior audit, not fresh UI seeding
        type: boolean
        default: false
        required: true
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - name: Download exact candidates
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh run download "${{ inputs.baseline_run }}" -n raw-apk-splits -D "$RUNNER_TEMP/baseline" --repo JoyalGeorge2006/spool
        gh run download "${{ inputs.target_run }}" -n raw-apk-splits -D "$RUNNER_TEMP/target" --repo JoyalGeorge2006/spool
        cp "$RUNNER_TEMP/baseline"/*-x86_64-debug.apk "$RUNNER_TEMP/baseline.apk"
        cp "$RUNNER_TEMP/target"/*-x86_64-debug.apk "$RUNNER_TEMP/target.apk"
        signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
        "$signer" verify --print-certs "$RUNNER_TEMP/baseline.apk" | tee /tmp/baseline-certs.txt
        "$signer" verify --print-certs "$RUNNER_TEMP/target.apk" | tee /tmp/target-certs.txt
        diff /tmp/baseline-certs.txt /tmp/target-certs.txt
        if [ "${{ inputs.archived_seed }}" = true ]; then
          test "${{ inputs.baseline_run }}" = 43815841443
          gh run download 43891330383 -n upgrade-evidence -D "$RUNNER_TEMP/seed" --repo JoyalGeorge2006/spool
          seed=$(find "$RUNNER_TEMP/seed" -name before.tar -type f | head -1)
          test -n "$seed"
          cp "$seed" "$RUNNER_TEMP/archived-seed.tar"
          echo '100ad5fe1977f765db7ecaaeba6e0ba427256152d4f6b9e4a5d5ead41cc785ac  '"$RUNNER_TEMP/archived-seed.tar" | sha256sum -c -
        fi
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Normal replace without uninstall or clear, seeded settings and local like
      env:
        SPOOL_ARCHIVED_SEED: ${{ inputs.archived_seed }}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_6
        ram-size: 2048M
        heap-size: 256M
        disk-size: 4096M
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader -camera-back none -no-snapshot -memory 2048 -cores 2
        force-avd-creation: true
        script: |
          echo  | base64 -d > /tmp/upgrade.sh
          bash /tmp/upgrade.sh
    - name: Upload private upgrade evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upgrade-evidence
        path: |
          ${{ runner.temp }}/pages/
          /tmp/android-runner/
          /tmp/*emulator*.log
