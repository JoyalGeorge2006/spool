name: Verify approved profile pill frost (no release)
on:
  push:
    branches: [spool-song-menu-cleanup]
    paths: [.github/workflows/spool-profile-frost.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved presentation-only change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip,base64,hashlib
          assert hashlib.sha256(Path('app/src/main/java/com/music/bitchord/MainActivity.kt').read_bytes()).hexdigest() == '87e0fefc01636bde98089ea3f2fabb76ac6cf11af076f3e914a1878be38a674b'
          p=Path('app/src/main/java/com/music/bitchord/MainActivity.kt')
          s=p.read_text();old='if (floatingPageChrome) FloatingHistoryProfileCapsule(\n';assert s.count(old)==1
          p.write_text(s.replace(old,old+'                            hazeState = hazeState,\n'))
          assert hashlib.sha256(Path('app/src/main/java/com/music/bitchord/ui/components/FrostedTopBar.kt').read_bytes()).hexdigest() == '2c70c269a0a8320f63dbd28ecebb976abaeab1026e8e0a9f467c2d1e7bd66862'
          Path('app/src/main/java/com/music/bitchord/ui/components/FrostedTopBar.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          Path('app/src/test/java/com/music/bitchord/ProfilePillFrostTest.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/music/bitchord/MainActivity.kt app/src/main/java/com/music/bitchord/ui/components/FrostedTopBar.kt app/src/test/java/com/music/bitchord/ProfilePillFrostTest.kt
          git commit -m 'Connect approved history profile pill to shared page frost'
          git push origin HEAD:spool-song-menu-cleanup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          cat > /tmp/platform.gradle <<'INIT'
          allprojects { afterEvaluate { p -> def a = p.extensions.findByName('android'); if(a != null) a.compileSdkVersion('android-37.0') } }
          INIT
      - name: Render actual Compose motion frames and regressions
        run: |
          ./gradlew --init-script /tmp/platform.gradle :app:testDevDebugUnitTest --tests com.music.bitchord.SparkRatingMotionTest --tests com.music.bitchord.OverflowScrollScreenshotTest --tests com.music.bitchord.DislikeSkipPolicyTest --tests com.music.bitchord.ProfilePillFrostTest --tests com.music.bitchord.StableMenuRowsTest --tests com.music.bitchord.LibrarySpacingProofTest --no-daemon --stacktrace 2>&1 | tee motion-test.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-motion-proof
          path: |
            **/build/outputs/roborazzi/
            **/build/test-results/
            **/build/reports/tests/
            motion-test.log
