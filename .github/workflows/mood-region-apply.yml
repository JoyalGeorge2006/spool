name: Apply mood region change (no release)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply the reviewed change on top of the 2.1.5 source and push it to this branch
      run: |
        set -euo pipefail
        if git log --format=%s | grep -q '^Moods: music region and languages'; then echo already applied; exit 0; fi
        echo '' | base64 -d | gunzip > /tmp/mood.patch
        git config user.name spool-ci
        git config user.email spool-ci@users.noreply.github.com
        git am /tmp/mood.patch
        git push origin HEAD:${GITHUB_REF_NAME}
        git log --oneline -3
