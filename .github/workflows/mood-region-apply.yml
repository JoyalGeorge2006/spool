name: Apply mood region change (no release)
on:
  workflow_dispatch:
  push:
    branches: [spool-mood-region]
    paths: ["patches/*.patch"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply patch files from patches/ on top of the branch and push
      run: |
        set -eu
        mkdir -p /tmp/pp
        cp patches/*.patch /tmp/pp/
        git config user.name spool-ci
        git config user.email spool-ci@users.noreply.github.com
        git rm -q patches/*.patch
        git commit -qm "Remove applied patch files"
        for f in $(ls /tmp/pp/*.patch | sort); do git am "$f"; done
        git push origin HEAD:${GITHUB_REF_NAME}
        git log --oneline -5
