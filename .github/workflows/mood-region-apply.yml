name: Apply mood region change (no release)
on:
  workflow_dispatch:
  push:
    branches: [spool-mood-region]
    paths: ["1-mood.patch", ".github/workflows/mood-region-apply.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply the reviewed change on top of the 2.1.5 source and push it to this branch
      run: |
        set -eu
        test -f 1-mood.patch
        cp 1-mood.patch /tmp/mood.patch
        git config user.name spool-ci
        git config user.email spool-ci@users.noreply.github.com
        git rm -q 1-mood.patch
        git commit -qm "Remove applied patch file"
        git am /tmp/mood.patch
        git push origin HEAD:${GITHUB_REF_NAME}
        git log --oneline -4
