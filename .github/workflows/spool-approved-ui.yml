name: Verify approved menu and Library changes (no release)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved presentation-only change
        run: |
          set -o pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip,base64,hashlib
          assert hashlib.sha256(Path('app/src/main/java/com/music/bitchord/ui/components/SongActionsMenu.kt').read_bytes()).hexdigest() == '68057e1f4c190720ad01761cc767aab4ae6ba9151142c47559ceb623ba547760'
          Path('app/src/main/java/com/music/bitchord/ui/components/SongActionsMenu.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          assert hashlib.sha256(Path('app/src/main/java/com/music/bitchord/ui/components/SparkRatingAction.kt').read_bytes()).hexdigest() == '166971e06b4e3433aced07191b61a6fefd57128950be6b07241146631d71e44d'
          Path('app/src/main/java/com/music/bitchord/ui/components/SparkRatingAction.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          assert hashlib.sha256(Path('app/src/main/res/values/spark_rating.xml').read_bytes()).hexdigest() == 'e505b1c55f1371643e8bb61fc388009a454df858f051f4fe5727426a6a0f62c5'
          Path('app/src/main/res/values/spark_rating.xml').write_bytes(gzip.decompress(base64.b64decode('H4sIADYkBGsC/7MpSi3OLy1KTi2241IAApvikqLMvHSFvMTcVFul4oLEouz4nMzs1BQlOx8QZaMPUYBbdUpmMVSDC5SFT09ual5pfEpqcUlmXmJJZn5efE5+YgpQGmgdhKGnp0eS/rz8vFQlOz8gidBmo4/kSwB7SXKV8gAAAA==')))
          Path('app/src/test/java/com/music/bitchord/SparkRatingMotionTest.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          Path('app/src/test/java/com/music/bitchord/StableMenuRowsTest.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          Path('app/src/test/java/com/music/bitchord/LibrarySpacingProofTest.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          assert hashlib.sha256(Path('sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/screens/LibraryScreen.kt').read_bytes()).hexdigest() == '8001c0948831555865574388072273f7af348d4f9abc890907313745ab3f8b89'
          Path('sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/screens/LibraryScreen.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          assert hashlib.sha256(Path('sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/replay/ReplayCard.kt').read_bytes()).hexdigest() == '6a2883d40bd76e8ba7db47d3a960230b7db44232c37849d94f940b333fd3b234'
          Path('sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/replay/ReplayCard.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/music/bitchord/ui/components/SongActionsMenu.kt app/src/main/java/com/music/bitchord/ui/components/SparkRatingAction.kt app/src/main/res/values/spark_rating.xml app/src/test/java/com/music/bitchord/SparkRatingMotionTest.kt app/src/test/java/com/music/bitchord/StableMenuRowsTest.kt app/src/test/java/com/music/bitchord/LibrarySpacingProofTest.kt sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/screens/LibraryScreen.kt sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/replay/ReplayCard.kt
          git commit -m 'Apply approved stable rows, balanced Library gaps and clean card text'
          git push origin HEAD:spool-song-menu-cleanup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android platform
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          cat > /tmp/platform.gradle <<'INIT'
          allprojects { afterEvaluate { p -> def a = p.extensions.findByName('android'); if(a != null) a.compileSdkVersion('android-37.0') } }
          INIT
      - name: Render actual Compose motion frames and regressions
        run: |
          set -o pipefail
          ./gradlew --init-script /tmp/platform.gradle :app:testDevDebugUnitTest --tests com.music.bitchord.SparkRatingMotionTest --tests com.music.bitchord.OverflowScrollScreenshotTest --tests com.music.bitchord.DislikeSkipPolicyTest --tests com.music.bitchord.FloatingSearchFlowTest --tests com.music.bitchord.StableMenuRowsTest --tests com.music.bitchord.LibrarySpacingProofTest --no-daemon --stacktrace 2>&1 | tee motion-test.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-motion-proof
          path: |
            **/build/outputs/roborazzi/
            **/build/test-results/
            **/build/reports/tests/
            motion-test.log
