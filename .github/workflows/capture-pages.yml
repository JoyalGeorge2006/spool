name: Spool cold startup comparison and Auto media service tests NO release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant:
        - eager-control
        - lazy-experiment
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Restore candidate including latest core and startup experiment
      run: "set -euo pipefail\ncurl -fL https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.9/spool-v1.9.9-source.tar.gz -o /tmp/baseline.tar.gz\necho\
        \ '3ffb4a494d3eb3ff7a43016bd1b869d8ad8b4957796a208ccdbaec5550f53aea  /tmp/baseline.tar.gz' | sha256sum -c -\nfind . -mindepth 1 -maxdepth 1 ! -name .git !\
        \ -name .github -exec rm -rf {} +\ntar xzf /tmp/baseline.tar.gz\npython3 - <<'PYOVERLAY'\nimport base64,lzma,tarfile,io\nb=lzma.decompress(base64.b64decode(''))\n\
        with tarfile.open(fileobj=io.BytesIO(b)) as t:\n    for m in t.getmembers():\n        assert not m.name.startswith('/') and '..' not in m.name.split('/')\
        \ and m.isfile()\n    t.extractall('.')\nPYOVERLAY\nchmod +x gradlew\n"
    - name: Control variant restores only two original startup files
      if: matrix.variant == 'eager-control'
      run: 'tar xzf /tmp/baseline.tar.gz app/src/main/java/com/music/bitchord/data/innertube/AndroidStreamHooks.kt shared/src/jvmSharedMain/kotlin/com/music/bitchord/data/innertube/InnerTubeXResolver.kt

        '
    - name: Compile and prepare cold-start comparison
      run: "set -euo pipefail\nmkdir -p verification\n./gradlew :app:assembleProdDebug :app:assembleProdDebugAndroidTest -Pbitchord.bundleWear=false --stacktrace\
        \ > verification/build.log 2>&1\necho 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules\n\
        sudo udevadm control --reload-rules\nsudo udevadm trigger --name-match=kvm\ncat > /tmp/auto-cold-start.py <<'CHECK'\nimport subprocess,time,os,signal\nfrom\
        \ pathlib import Path\nout=Path('verification')\ndef adb(*args,check=False):return subprocess.run(['adb',*args],capture_output=True,text=True,check=check).stdout.strip()\n\
        try:\n adb('root');adb('wait-for-device')\n apk=next(Path('app/build/outputs/apk/prod/debug').glob('*-x86_64-debug.apk'))\n adb('install','--no-streaming',str(apk),check=True)\n\
        \ adb('install','--no-streaming','app/build/outputs/apk/androidTest/prod/debug/app-prod-debug-androidTest.apk',check=True)\n adb('logcat','-c');adb('shell','am','force-stop','app.spool.music')\n\
        \ start=time.monotonic()\n launch=subprocess.Popen(['adb','shell','am','start','-W','-n','app.spool.music/com.music.bitchord.MainActivity'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)\n\
        \ try:result=launch.communicate(timeout=50)[0]\n except subprocess.TimeoutExpired:\n  pid=adb('shell','pidof','app.spool.music').split()\n  if pid:adb('shell','kill','-3',pid[0]);time.sleep(2)\n\
        \  launch.kill();result=launch.communicate()[0]+'\\nTIMEOUT50s'\n (out/'cold-start.txt').write_text('seconds='+str(time.monotonic()-start)+'\\n'+result)\n\
        \ adb('shell','screencap','-p','/sdcard/cold.png');adb('pull','/sdcard/cold.png',str(out/'cold-start.png'))\n (out/'cold-start-logcat.txt').write_text(adb('logcat','-d','-b','all'))\n\
        \ # Instrumentation outcome is separate from the first cold launch above.\n adb('shell','am','force-stop','app.spool.music')\n result=adb('shell','am','instrument','-w','-r','-e','class','com.music.bitchord.AndroidAutoMediaLibraryTest','app.spool.music.test/androidx.test.runner.AndroidJUnitRunner')\n\
        \ (out/'auto-tests.txt').write_text(result)\n assert 'OK (5 tests)' in result,result\nfinally:\n (out/'logcat-all.txt').write_text(adb('logcat','-d','-b','all'))\n\
        \ (out/'activity-exit.txt').write_text(adb('shell','dumpsys','activity','exit-info','app.spool.music'))\n (out/'services.txt').write_text(adb('shell','dumpsys','activity','services','app.spool.music'))\n\
        \ (out/'auto-package.txt').write_text(adb('shell','dumpsys','package','com.google.android.projection.gearhead'))\n adb('pull','/data/anr',str(out/'anr'))\n\
        CHECK\n"
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
        script: python3 /tmp/auto-cold-start.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: auto-cold3-${{ matrix.variant }}
        path: verification
        retention-days: 14
