name: Spool privileged completion receiver core48 and ordinary background acceptance NO release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  runtime-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - &id001
      uses: actions/checkout@v4
    - &id002
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - &id003
      name: Restore exact code47 source and candidate-only OTA overlay
      run: "set -euo pipefail\ncurl -fL https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.9/spool-v1.9.9-source.tar.gz -o /tmp/baseline.tar.gz\necho\
        \ '3ffb4a494d3eb3ff7a43016bd1b869d8ad8b4957796a208ccdbaec5550f53aea  /tmp/baseline.tar.gz' | sha256sum -c -\nfind . -mindepth 1 -maxdepth 1 ! -name .git !\
        \ -name .github -exec rm -rf {} +\ntar xzf /tmp/baseline.tar.gz\npython3 - <<'PYOVERLAY'\nimport base64,lzma,tarfile,io\nb=lzma.decompress(base64.b64decode(''))\n\
        with tarfile.open(fileobj=io.BytesIO(b)) as t:\n    for m in t.getmembers():\n        assert not m.name.startswith('/') and '..' not in m.name.split('/')\
        \ and m.isfile()\n    t.extractall('.')\nPYOVERLAY\nchmod +x gradlew\n"
    - name: Prepare disposable new-updater bootstrap46 and persisted signer
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'set -euo pipefail

        python3 - <<''VERSION''

        p=''build.gradle.kts''

        s=open(p).read().replace(''bitchordVersionCode"] = 47'',''bitchordVersionCode"] = 46'').replace(''bitchordVersionName"] = "1.9.9"'',''bitchordVersionName"]
        = "1.9.8-runtime-fixture"'')

        open(p,''w'').write(s)

        VERSION

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        mkdir -p verification

        '
    - name: Build bootstrap and fixture instrumentation
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: "set -euo pipefail\n./gradlew :app:assembleProdDebug :app:assembleProdDebugAndroidTest -Pbitchord.bundleWear=false --stacktrace > verification/build.log\
        \ 2>&1\necho 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules\nsudo udevadm control\
        \ --reload-rules\nsudo udevadm trigger --name-match=kvm\ncat > /tmp/run-runtime-fixture.py <<'RUNTIME'\nimport subprocess,time,json,xml.etree.ElementTree\
        \ as ET,re\nfrom pathlib import Path\nout=Path('verification')\ndef adb(*args,check=True):return subprocess.run(['adb',*args],capture_output=True,text=True,check=check).stdout.strip()\n\
        def phase():\n try:return json.loads(adb('shell','cat','/data/user/0/app.spool.music/no_backup/spool-update-v1.json'))\n except:return {}\ndef screenshot(name):\n\
        \ adb('shell','screencap','-p','/sdcard/runtime.png');adb('pull','/sdcard/runtime.png',str(out/name))\ndef diagnostics(label):\n for name,args in {\n  'logcat':['logcat','-d','-b','all'],\n\
        \  'connectivity':['shell','dumpsys','connectivity'],\n  'downloads':['shell','content','query','--uri','content://downloads/all_downloads'],\n  'jobs':['shell','dumpsys','jobscheduler'],\n\
        \  'broadcasts':['shell','dumpsys','activity','broadcasts'],\n  'processes':['shell','ps','-A'],\n  'exit-info':['shell','dumpsys','activity','exit-info','app.spool.music'],\n\
        \  'package':['shell','dumpsys','package','app.spool.music'],\n  'record':['shell','cat','/data/user/0/app.spool.music/no_backup/spool-update-v1.json'],\n\
        \ }.items():\n  (out/(label+'-'+name+'.txt')).write_text(adb(*args,check=False))\n adb('pull','/data/anr',str(out/(label+'-anr')),check=False)\nimport atexit\n\
        atexit.register(lambda:diagnostics('final'))\nsubprocess.run(['adb','root'],check=True);adb('wait-for-device');assert adb('shell','id','-u')=='0'\napk=next(Path('app/build/outputs/apk/prod/debug').glob('*-x86_64-debug.apk'))\n\
        adb('install','--no-streaming',str(apk))\nadb('install','--no-streaming','app/build/outputs/apk/androidTest/prod/debug/app-prod-debug-androidTest.apk')\n\
        adb('shell','appops','set','app.spool.music','REQUEST_INSTALL_PACKAGES','allow')\nadb('shell','svc','wifi','disable');adb('shell','svc','data','disable')\n\
        r=adb('shell','am','instrument','-w','-r','-e','class','com.music.bitchord.UpdateRuntimeFixtureTest#beginExactPublished47Download','app.spool.music.test/androidx.test.runner.AndroidJUnitRunner')\n\
        (out/'begin.txt').write_text(r);assert 'OK (1 test)' in r,r\nbefore=phase();(out/'before-kill.json').write_text(json.dumps(before,indent=2));assert before.get('phase')\
        \ in ['queued','downloading','waiting'],before\n# Android force-stops target when instrumentation finishes. A normal app\n# launch clears that stopped bit\
        \ before we test ordinary process eviction.\nadb('shell','am','start','-n','app.spool.music/com.music.bitchord.MainActivity')\nend=time.time()+45\nwhile time.time()<end:\n\
        \ state=adb('shell','dumpsys','activity','activities',check=False)\n if any('app.spool.music' in line and ('mResumedActivity' in line or 'topResumedActivity'\
        \ in line) for line in state.splitlines()):break\n time.sleep(1)\nelse:raise AssertionError('Bootstrap activity never resumed before background eviction')\n\
        adb('shell','input','keyevent','KEYCODE_HOME');time.sleep(2)\nstate=adb('shell','dumpsys','package','app.spool.music',check=False)\n(out/'before-ordinary-kill-package.txt').write_text(state)\n\
        assert 'stopped=false' in state,'Package remained force-stopped after explicit launch'\ndiagnostics('before-ordinary-kill')\nadb('shell','am','kill','app.spool.music')\n\
        for _ in range(15):\n if not adb('shell','pidof','app.spool.music',check=False):break\n time.sleep(.2)\nassert not adb('shell','pidof','app.spool.music',check=False),'Process\
        \ still present'\n(out/'process-absent.txt').write_text('Confirmed app process absent before restoring connectivity')\nadb('shell','svc','wifi','enable');adb('shell','svc','data','enable');diagnostics('reconnected')\n\
        end=time.time()+300;last=None\nwhile time.time()<end:\n a=phase();now=a.get('phase')\n if now!=last:\n  with (out/'phase-history.txt').open('a') as f:f.write(str(time.time())+'\
        \ '+str(now)+'\\n')\n  last=now\n if now=='ready':break\n if now in ['failed','fallback','cancelled']:raise AssertionError(a)\n time.sleep(2)\nelse:\n diagnostics('background-timeout')\n\
        \ adb('shell','am','start','-n','app.spool.music/com.music.bitchord.MainActivity',check=False)\n time.sleep(30);diagnostics('foreground-recovery');screenshot('foreground-recovery.png')\n\
        \ raise AssertionError('No background Ready state within300s; foreground recovery phase='+str(phase()))\n(out/'ready-before-reopen.json').write_text(json.dumps(a,indent=2))\n\
        r=adb('shell','am','instrument','-w','-r','-e','class','com.music.bitchord.UpdateRuntimeFixtureTest#openPrepared47AndroidConfirmation','app.spool.music.test/androidx.test.runner.AndroidJUnitRunner')\n\
        (out/'open-installer.txt').write_text(r);assert 'OK (1 test)' in r,r\nend=time.time()+30;clicked=False\nwhile time.time()<end:\n adb('shell','uiautomator','dump','/sdcard/installer.xml',check=False)\n\
        \ text=adb('shell','cat','/sdcard/installer.xml',check=False)\n try:root=ET.fromstring(text)\n except:time.sleep(1);continue\n for node in root.iter('node'):\n\
        \  if node.get('text','').lower() in ['install','update'] and node.get('enabled')=='true':\n   (out/'android-confirmation.xml').write_text(text);screenshot('android-confirmation.png')\n\
        \   nums=list(map(int,re.findall(r'\\d+',node.get('bounds',''))));assert len(nums)==4\n   adb('shell','input','tap',str((nums[0]+nums[2])//2),str((nums[1]+nums[3])//2));clicked=True;break\n\
        \ if clicked:break\n time.sleep(1)\nassert clicked,'Android Install/Update control not found'\nend=time.time()+90\nwhile time.time()<end:\n dump=adb('shell','dumpsys','package','app.spool.music')\n\
        \ if 'versionCode=47 ' in dump:break\n time.sleep(1)\nelse:raise AssertionError('Installation did not become47')\n(out/'final-package.txt').write_text(dump)\n\
        sentinel=adb('shell','cat','/data/user/0/app.spool.music/files/ota-runtime-sentinel');assert sentinel=='preserve-ota47'\n(out/'sentinel-after.txt').write_text(sentinel)\n\
        adb('shell','am','start','-n','app.spool.music/com.music.bitchord.MainActivity');time.sleep(8);screenshot('published47-after-new-updater.png')\n(out/'logcat.txt').write_text(adb('logcat','-d','-b','all'))\n\
        print('PASS:explicitdownload offlinequeue processabsent backgroundReady Androidconfirmation systeminstall preserveddata')\nRUNTIME\n"
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
        script: python3 /tmp/run-runtime-fixture.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: runtime10-privileged-receiver-background-NOT-RELEASE
        path: verification
        retention-days: 14
  core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
    - *id001
    - *id002
    - *id003
    - name: Compile and run update regressions
      run: "mkdir -p verification\nstatus=0\n./gradlew :app:compileProdDebugKotlin :app:compileProdDebugJavaWithJavac -Pbitchord.bundleWear=false --stacktrace > verification/compile.log\
        \ 2>&1 || status=$?\ntail -90 verification/compile.log\nif [ \"$status\" = 0 ]; then\n  ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false\
        \ --tests 'com.music.bitchord.AppUpdateSafetyTest' --tests 'com.music.bitchord.SpoolDeltaTest' --tests 'com.music.bitchord.UpdateStoreTest' --tests 'com.music.bitchord.UpdateDownloadsTest'\
        \ --tests 'com.music.bitchord.OtaFlowTest' --tests 'com.music.bitchord.UpdateAssetSelectionTest' --stacktrace > verification/tests.log 2>&1 || status=$?\n\
        \  tail -90 verification/tests.log\nfi\nexit \"$status\"\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: core48-privileged-receiver-regressions
        path: 'verification

          app/build/test-results

          app/build/outputs/roborazzi'
        retention-days: 7
