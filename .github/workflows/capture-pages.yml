name: Stage verified1.9.12 OTA release DRAFT ONLY
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/download-artifact@v4
      with:
        name: spool50-version-only-signed-NOT-PUBLISHED
        run-id: '44471732851'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: /tmp/target
    - uses: actions/download-artifact@v4
      with:
        name: spool49-queue-signed-device-test-NOT-PUBLISHED
        run-id: '44466337448'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: /tmp/base
    - name: Verify exact decoder and signer then stage draft assets and pinned catalog
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\nrepo=JoyalGeorge2006/spool\ntag=v1.9.12\nout=/tmp/target/tmp/candidate-out\nbase=/tmp/base/tmp/candidate-out/spool-v1.9.11_universal.apk\n\
        apk=$out/spool.apk\nmkdir -p /tmp/release /tmp/src /tmp/classes\necho \"0bb445a4bb335d7391472c9144ef41642433260409b52cd4d2ed02b643c2b976  $base\" | sha256sum\
        \ -c -\necho \"82e1135a7ae15a3d7dabf3c4d6b59af5092e84068a35f00785c2cf7e2353ad86  $apk\" | sha256sum -c -\ntest \"$(stat -c %s \"$apk\")\" = 153636328\ntar\
        \ -xzf \"$out/spool-v1.9.12-source.tar.gz\" -C /tmp/src\npython /tmp/src/tools/ota/make_delta.py \"$base\" \"$apk\" /tmp/release/spool49-50.spdelta | tee\
        \ /tmp/delta.json\ncat > /tmp/RoundTrip.java <<'JAVA'\nimport com.music.bitchord.data.SpoolDelta;\nimport java.io.File;\npublic class RoundTrip {\n public\
        \ static void main(String[] a) throws Exception {\n  SpoolDelta.apply(new File(a[0]),new File(a[1]),new File(a[2]),153636328L,153636328L,\"0bb445a4bb335d7391472c9144ef41642433260409b52cd4d2ed02b643c2b976\"\
        ,\"82e1135a7ae15a3d7dabf3c4d6b59af5092e84068a35f00785c2cf7e2353ad86\",()->{});\n }\n}\nJAVA\njavac -d /tmp/classes /tmp/src/app/src/main/java/com/music/bitchord/data/SpoolDelta.java\
        \ /tmp/src/tools/ota/DeltaMutationHarness.java /tmp/RoundTrip.java\njava -Xmx64m -cp /tmp/classes RoundTrip \"$base\" /tmp/release/spool49-50.spdelta /tmp/reconstructed.apk\n\
        cmp \"$apk\" /tmp/reconstructed.apk\njava -Xmx64m -cp /tmp/classes DeltaMutationHarness | tee /tmp/mutations.txt\nbt=$(find \"$ANDROID_HOME/build-tools\"\
        \ -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)\n\"$bt/apksigner\" verify --verbose --print-certs /tmp/reconstructed.apk | tee /tmp/certs.txt\ngrep\
        \ -q 'a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee' /tmp/certs.txt\n\"$bt/aapt\" dump badging /tmp/reconstructed.apk | tee /tmp/badging.txt\n\
        grep -q \"package: name='app.spool.music' versionCode='50' versionName='1.9.12'\" /tmp/badging.txt\ncp \"$apk\" /tmp/release/spool.apk\ncp \"$out/spool-v1.9.12-source.tar.gz\"\
        \ /tmp/release/\ntest \"$(gh api repos/$repo/releases/latest --jq .tag_name)\" = v1.9.9\ngh api repos/$repo/releases --paginate > /tmp/releases.json\nif jq\
        \ -e --arg tag \"$tag\" '.[]|select(.tag_name==$tag)' /tmp/releases.json; then echo 'Release already exists; refuse duplicate'; exit 1; fi\ncat > /tmp/notes.txt\
        \ <<'NOTES'\nSpool1.9.12/code50 is a version-only update from1.9.11/code49 for testing the in-app OTA download and Android installation flow. Same package,\
        \ signing identity, source and design; no unrelated feature changes. Install as an update. Do not uninstall or clear app data.\n\n54 startup/updater checks\
        \ and105 queue checks passed. Signed final APK verified. Physical-device OTA acceptance is still pending. Existing limitations remain unchanged, including\
        \ the active-looking disabled queue removal control.\n\nThe optional delta is only for the exact1.9.11 universal APK on arm64-v8a devices. Other bases/layouts\
        \ use the full APK with its stated size. The delta reconstructs the exact signed target and passed the production Java decoder round trip plus hostile-input\
        \ host tests. These checks do not replace phone acceptance.\n\nAPK package:app.spool.music; versionCode:50; versionName:1.9.12; bytes:153636328.\nSHA256:82e1135a7ae15a3d7dabf3c4d6b59af5092e84068a35f00785c2cf7e2353ad86.\n\
        Exact candidate source is the attached spool-v1.9.12-source.tar.gz. The automatic tag source links do not represent the exact restored build tree. Build run44471732851,\
        \ workflow commita28c977da81e51462ba4f59f5ce7654c881c654c.\nNOTES\ngh release create \"$tag\" --repo \"$repo\" --target main --draft --latest=false --title\
        \ 'Spool1.9.12' --notes-file /tmp/notes.txt /tmp/release/spool.apk /tmp/release/spool49-50.spdelta /tmp/release/spool-v1.9.12-source.tar.gz\ngh api repos/$repo/releases/tags/$tag\
        \ > /tmp/draft.json\npython - <<'PY'\nimport json,pathlib,hashlib\nr=json.load(open('/tmp/draft.json'));assert r['draft'] and not r['prerelease']\na={x['name']:x\
        \ for x in r['assets']}\nfor n in ['spool.apk','spool49-50.spdelta','spool-v1.9.12-source.tar.gz']:\n p=pathlib.Path('/tmp/release')/n;x=a[n];assert x['state']=='uploaded'\
        \ and x['size']==p.stat().st_size and x['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()\nm=json.load(open('/tmp/delta.json'));d={k:m[k]for\
        \ k in ['format','base_size','base_sha256','target_size','target_sha256','patch_size','patch_sha256']};d.update(layout='standalone',package='app.spool.music',target_version='1.9.12',target_code=50,base_code=49,min_sdk=26,abi='arm64-v8a',patch_asset_id=str(a['spool49-50.spdelta']['id']))\n\
        pathlib.Path('/tmp/release/spool-ota-v1.json').write_text(json.dumps({'schema':1,'patches':[d]},indent=2)+'\\n')\nprint(json.dumps(d,indent=2))\nPY\ngh release\
        \ upload \"$tag\" --repo \"$repo\" /tmp/release/spool-ota-v1.json\ngh api repos/$repo/releases/tags/$tag > /tmp/draft-final.json\npython - <<'PY'\nimport\
        \ json,pathlib,hashlib\nr=json.load(open('/tmp/draft-final.json'));assert r['draft'] and not r['prerelease']\na={x['name']:x for x in r['assets']};assert\
        \ len(a)==4\nfor n,x in a.items():\n p=pathlib.Path('/tmp/release')/n;assert x['state']=='uploaded' and x['size']==p.stat().st_size and x['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()\n\
        c=json.load(open('/tmp/release/spool-ota-v1.json'))['patches'][0];assert c['patch_asset_id']==str(a['spool49-50.spdelta']['id']) and c['target_sha256']==a['spool.apk']['digest'][7:]\n\
        print('Draft assets, catalog, exact decoder reconstruction and final signer checks passed. Not published yet.')\nPY\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spool50-draft-release-verification
        path: '/tmp/delta.json

          /tmp/mutations.txt

          /tmp/certs.txt

          /tmp/badging.txt

          /tmp/draft.json

          /tmp/draft-final.json

          /tmp/release/spool-ota-v1.json'
        retention-days: 14
