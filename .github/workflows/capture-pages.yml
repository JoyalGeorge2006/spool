name: Spool v78 active installer and data preservation acceptance
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  install-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: JoyalGeorge2006/spool
        run-id: 44216137784
        name: spool-approved-six-v76
        path: baseline
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: JoyalGeorge2006/spool
        run-id: 44232908699
        name: Spool-v78-active-OTA-APK
        path: candidate
    - name: Verify exact v76 baseline and active v78 artifact
      run: 'set -euo pipefail

        mkdir -p verification

        find baseline candidate -name ''*.apk'' -type f | tee verification/apks.txt

        base=$(find baseline -name ''*.apk'' -type f | head -1)

        next=$(find candidate -name ''*.apk'' -type f | head -1)

        echo "7723309ee8bc0642c2c3df545f434a10cd7c1dedf8816074b3f5a5781bccbd91  $base"
        | sha256sum -c -

        sha256sum "$next" | tee verification/v78-sha256.txt

        cp "$base" /tmp/v76.apk

        cp "$next" /tmp/v78.apk

        signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V
        | tail -1)

        "$signer" verify --verbose --print-certs /tmp/v76.apk | tee verification/v76-signature.txt

        "$signer" verify --verbose --print-certs /tmp/v78.apk | tee verification/v77-signature.txt

        echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"''
        | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Android17 beta install-over active v78 and preserve data sentinel
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 37.2-beta3
        arch: x86_64
        target: google_apis_ps16k
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          -camera-back none -memory 3072
        script: 'adb shell getprop > verification/emulator-properties.txt

          adb logcat -c

          adb install --no-streaming /tmp/v76.apk > verification/v76-install.txt 2>&1
          || true

          cat verification/v76-install.txt

          adb shell dumpsys package app.spool.music > verification/v76-package.txt

          adb shell run-as app.spool.music mkdir -p files > verification/sentinel-write.txt
          2>&1 || true

          echo spool-install-over-sentinel | adb shell run-as app.spool.music tee
          files/install-over-sentinel.txt >> verification/sentinel-write.txt 2>&1
          || true

          adb install -r --no-streaming /tmp/v78.apk > verification/v78-update.txt
          2>&1 || true

          cat verification/v78-update.txt

          adb shell dumpsys package app.spool.music > verification/v78-package.txt

          adb shell run-as app.spool.music cat files/install-over-sentinel.txt > verification/sentinel-after.txt
          2>&1 || true

          cat verification/sentinel-after.txt

          adb shell am start -n app.spool.music/com.music.bitchord.MainActivity >
          verification/v78-launch.txt 2>&1 || true

          adb shell sleep 8

          adb shell pidof app.spool.music > verification/v78-pid.txt || true

          adb shell screencap -p /sdcard/v78-launch.png

          adb pull /sdcard/v78-launch.png verification/v78-launch.png

          adb logcat -d -b all > verification/package-manager-logcat.txt

          echo ''Disposable emulator diagnostic only. Not proof of installation on
          user phone or user-data migration.'' > verification/SCOPE.txt


          grep -qx Success <(tail -1 verification/v76-install.txt)

          grep -qx Success <(tail -1 verification/v78-update.txt)

          grep -qx spool-install-over-sentinel verification/sentinel-after.txt

          '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Spool-v78-Android17beta-install-data-diagnostic
        path: verification
        retention-days: 30
