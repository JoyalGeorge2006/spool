name: Spool exact final8 cross theme and both reduced motion settings no release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  candidate48:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - uses: actions/download-artifact@v4
      with:
        name: spool48-motion-final8-geometric-handoff-NOT-PUBLISHED
        path: candidate
        run-id: 44364869752
        github-token: ${{ github.token }}
    - name: Prepare same signed APK capture with full launch window and actual UI assertions
      run: "set -euo pipefail\nmkdir -p verification /tmp/candidate-out\napk=$(find candidate -path '*/tmp/candidate-out/spool.apk' -print -quit)\ntest -s \"$apk\"\
        \ncp \"$apk\" /tmp/candidate-out/spool.apk\necho 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules\n\
        sudo udevadm control --reload-rules\nsudo udevadm trigger --name-match=kvm\ncat > /tmp/accept-spool48.sh <<'ACCEPT'\nset -euo pipefail\nadb root\nadb wait-for-device\n\
        adb shell wm size 480x960\nadb shell wm density 200\ntest \"$(adb shell id -u | tr -dc '0-9')\" = 0\nadb shell getprop > verification/device-properties.txt\n\
        adb install -r --no-streaming /tmp/candidate-out/spool.apk | tee verification/install48.txt\ngrep -q Success verification/install48.txt\nadb shell dumpsys\
        \ package app.spool.music > verification/package48.txt\ngrep -q 'versionCode=48' verification/package48.txt\ntrue\ntrue\nadb shell am force-stop com.google.android.apps.nexuslauncher\n\
        adb shell am start -n app.spool.music/com.music.bitchord.MainActivity\nsleep 12\nadb shell pidof app.spool.music | tee verification/pid48.txt\ntest -s verification/pid48.txt\n\
        adb shell screencap -p /sdcard/final48.png\nadb pull /sdcard/final48.png verification/final48.png\nadb shell dumpsys activity activities > verification/activities.txt\n\
        adb logcat -d -b all > verification/logcat.txt\n\nfor mode in light dark light-system-dark dark-system-light app-reduced system-reduced; do\n  appTheme=LIGHT;\
        \ systemNight=no; reduced=false; animator=1\n  case \"$mode\" in\n    dark) appTheme=DARK; systemNight=yes ;;\n    light-system-dark) systemNight=yes ;;\n\
        \    dark-system-light) appTheme=DARK ;;\n    app-reduced) reduced=true ;;\n    system-reduced) animator=0 ;;\n  esac\n  adb shell cmd uimode night \"$systemNight\"\
        \n  adb shell settings put global animator_duration_scale \"$animator\"\n  adb shell am force-stop com.google.android.apps.nexuslauncher\n  adb shell am force-stop\
        \ app.spool.music\n  adb shell \"printf '<map><string name=\\\"theme_mode\\\">%s</string><boolean name=\\\"onboarding_complete\\\" value=\\\"true\\\" /><boolean\
        \ name=\\\"reduce_animation\\\" value=\\\"%s\\\" /></map>' $appTheme $reduced > /data/user/0/app.spool.music/shared_prefs/bitchord_settings.xml\"\n  adb logcat\
        \ -c\n  adb shell dumpsys gfxinfo app.spool.music reset > verification/gfx-reset-$mode.txt\n  adb shell screenrecord --bit-rate 2000000 --time-limit 10 /sdcard/launch-$mode.mp4\
        \ > verification/record-$mode.log 2>&1 &\n  recorder=$!\n  sleep 0.4\n  adb shell am start -W -n app.spool.music/com.music.bitchord.MainActivity > verification/launch-$mode.txt\n\
        \  wait \"$recorder\"\n  adb pull /sdcard/launch-$mode.mp4 verification/launch-$mode.mp4\n  adb shell dumpsys gfxinfo app.spool.music framestats > verification/gfx-$mode.txt\n\
        \  adb logcat -d -b all > verification/logcat-$mode.txt\n  adb shell screencap -p /sdcard/post-$mode.png\n  adb pull /sdcard/post-$mode.png verification/post-$mode.png\n\
        \  adb shell dumpsys activity activities > verification/activity-$mode.txt\n  grep -E '(topResumedActivity|mResumedActivity)=.*app.spool.music' verification/activity-$mode.txt\n\
        \  adb shell uiautomator dump /sdcard/ui.xml\n  adb pull /sdcard/ui.xml verification/ui-$mode.xml\n  grep -q 'package=\"app.spool.music\"' verification/ui-$mode.xml\n\
        \  if grep -qi 'not responding' verification/ui-$mode.xml; then exit 1; fi\n\ndone\n# Separate unrecorded launch, so graphics timing is not assumed from encoded\
        \ PTS alone.\nadb shell am force-stop app.spool.music\nadb shell settings put global animator_duration_scale 1\nadb shell \"printf '<map><string name=\\\"\
        theme_mode\\\">LIGHT</string><boolean name=\\\"onboarding_complete\\\" value=\\\"true\\\" /></map>' > /data/user/0/app.spool.music/shared_prefs/bitchord_settings.xml\"\
        \nadb shell dumpsys gfxinfo app.spool.music reset > verification/unrecorded-gfx-reset.txt\nadb shell atrace --async_start -b 16384 gfx view sched freq am\
        \ wm > verification/trace-start.txt\nadb shell am start -W -n app.spool.music/com.music.bitchord.MainActivity > verification/unrecorded-launch.txt\nsleep\
        \ 5\nadb shell atrace --async_stop -z gfx view sched freq am wm > verification/unrecorded.atrace\nadb shell dumpsys gfxinfo app.spool.music framestats > verification/unrecorded-gfx.txt\n\
        ACCEPT\n"
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072 -no-snapshot
        script: bash /tmp/accept-spool48.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: motion-runtime9-final8-cross-theme-reduced-frame-metrics-NOT-RELEASE
        path: verification
        retention-days: 14
