name: Spool published v78 real OTA probe after compatibility dialog
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  publish-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: JoyalGeorge2006/spool
        run-id: 44234222504
        name: Spool-v78-active-OTA-APK
        path: final
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: JoyalGeorge2006/spool
        run-id: 44234222504
        name: Spool-v78-complete-corresponding-source
        path: source
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: JoyalGeorge2006/spool
        run-id: 44232908699
        name: Spool-v78-active-OTA-APK
        path: baseline
    - name: Prepare release notes and real UI probe
      run: 'python3 - <<''PREP''

        import base64

        open(''/tmp/ota-ui.py'',''wb'').write(base64.b64decode(''''))

        PREP

        base=$(find baseline -name spool.apk -type f | head -1)

        echo "52fbe29e62eefefa97f3a9234d836215b7c6d95ea04f7011309e39ae87d7efc3  $base" | sha256sum -c -

        cp "$base" /tmp/baseline.apk

        mkdir -p verification

        echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Real baseline updater checks downloads verifies and installs newer release
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 37.2-beta3
        arch: x86_64
        target: google_apis_ps16k
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
        script: python3 /tmp/ota-ui.py > verification/ota-ui-probe.txt 2>&1; status=$?; cat verification/ota-ui-probe.txt; adb logcat -d -b all > verification/ota-logcat.txt; exit $status
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Spool-v78-published-real-OTA-evidence
        path: verification
        retention-days: 30
