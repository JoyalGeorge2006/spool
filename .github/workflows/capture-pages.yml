name: Spool Astryx audit - frozen v75 screenshots only
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
        - group: 9-final-states
          cases: FinalMobileAuditStates
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Restore byte-verified frozen v75 source
      id: source
      run: 'set -euo pipefail

        cp .github/workflows/1-spool-astryx-audit-capture.yml /tmp/audit-frozen-spec.yml

        python3 -m pip install pyyaml==6.0.3

        python3 - <<''PYRESTORE''

        import yaml,subprocess

        from pathlib import Path

        spec=yaml.safe_load(Path(''/tmp/audit-frozen-spec.yml'').read_text())

        script=spec[''jobs''][''capture''][''steps''][2][''run'']

        Path(''/tmp/audit-restore.sh'').write_text(script)

        subprocess.check_call([''bash'',''-e'',''/tmp/audit-restore.sh''])

        PYRESTORE

        '
    - name: Install offline additional capture fixture only
      run: 'python3 - <<''PYFIXTURE''

        from pathlib import Path

        import base64

        p=Path(''app/src/test/java/com/music/bitchord/FinalMobileAuditStates.kt'')

        p.write_bytes(base64.b64decode(''''))

        PYFIXTURE

        '
    - name: Prepare checks
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Render actual current components only - NO APK
      run: "set -euo pipefail\nset -f\nchmod +x gradlew\ncat > /tmp/audit-isolation.gradle <<'INIT'\nallprojects { tasks.withType(Test).configureEach { forkEvery = 1; maxParallelForks = 1 } }\nINIT\nmkdir -p verification\nstatus=0\nfor case in ${{ matrix.cases }}; do\n  safe=${case//\\*/ALL}\n  timeout --signal=TERM --kill-after=30s 12m ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false -I /tmp/audit-isolation.gradle --tests \"com.music.bitchord.$case\" > \"verification/$safe.log\" 2>&1 || status=1\n  tail -15 \"verification/$safe.log\"\n  mkdir -p \"verification/$safe\"\n  cp -R app/build/test-results \"verification/$safe/\" || true\ndone\nexit \"$status\"\n"
    - name: Upload audit evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spool-astryx-current-v75-${{ matrix.group }}
        path: 'verification

          app/build/outputs/roborazzi

          /tmp/frozen-diff-stat.txt'
        if-no-files-found: error
        retention-days: 7
