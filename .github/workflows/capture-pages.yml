name: Spool focused explicit antialias native vector no release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  candidate48:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Restore verified source and final candidate overlay
      run: "set -euo pipefail\ncurl -fL https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.9/spool-v1.9.9-source.tar.gz -o /tmp/baseline.tar.gz\necho\
        \ '3ffb4a494d3eb3ff7a43016bd1b869d8ad8b4957796a208ccdbaec5550f53aea  /tmp/baseline.tar.gz' | sha256sum -c -\nfind . -mindepth 1 -maxdepth 1 ! -name .git !\
        \ -name .github -exec rm -rf {} +\ntar xzf /tmp/baseline.tar.gz\npython3 - <<'PYOVERLAY'\nimport base64,lzma,tarfile,io\nb=lzma.decompress(base64.b64decode(''))\n\
        with tarfile.open(fileobj=io.BytesIO(b)) as t:\n    for m in t.getmembers():\n        assert not m.name.startswith('/') and '..' not in m.name.split('/')\
        \ and m.isfile()\n    t.extractall('.')\nPYOVERLAY\nchmod +x gradlew\n"
    - name: Build debug-only measured launch probe
      run: "set -euo pipefail\nmkdir -p verification\n./gradlew :app:assembleProdDebug :app:testProdDebugUnitTest -Pbitchord.bundleWear=false --tests 'com.music.bitchord.SpoolLaunchTest'\
        \ --tests 'com.music.bitchord.SpoolStartupThemeTest' --stacktrace > verification/build.log 2>&1\ncp -r app/build/test-results/testProdDebugUnitTest verification/unit-results\n\
        apk=$(find app/build/outputs/apk -name '*.apk' -print -quit)\ncp \"$apk\" /tmp/probe.apk\necho 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"\
        static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules\nsudo udevadm control --reload-rules\nsudo udevadm trigger --name-match=kvm\ncat > /tmp/probe.sh\
        \ <<'PROBE'\nset -euo pipefail\nadb root\nadb wait-for-device\nadb shell wm size 480x960\nadb shell wm density 200\nadb install --no-streaming /tmp/probe.apk\n\
        adb shell am start -W -n app.spool.music/com.music.bitchord.MainActivity\nsleep 8\nadb shell am force-stop app.spool.music\nadb shell 'rm -f /data/user/0/app.spool.music/shared_prefs/bitchord_settings.xml.bak'\n\
        adb shell 'echo PG1hcD48c3RyaW5nIG5hbWU9InRoZW1lX21vZGUiPkxJR0hUPC9zdHJpbmc+PGJvb2xlYW4gbmFtZT0ib25ib2FyZGluZ19jb21wbGV0ZSIgdmFsdWU9InRydWUiIC8+PC9tYXA+ |\
        \ base64 -d > /data/user/0/app.spool.music/shared_prefs/bitchord_settings.xml'\nadb shell cat /data/user/0/app.spool.music/shared_prefs/bitchord_settings.xml\
        \ > verification/prefs-written.xml\nadb shell cmd uimode night yes\nadb shell settings put global animator_duration_scale 1\n# First launch migrates saved\
        \ app theme into Android's per-package mode.\nadb shell am start -W -n app.spool.music/com.music.bitchord.MainActivity > verification/migration-launch.txt\n\
        sleep 5\nadb shell am force-stop app.spool.music\nadb shell cat /data/user/0/app.spool.music/shared_prefs/bitchord_settings.xml > verification/prefs-migrated.xml\n\
        adb logcat -c\nadb shell screenrecord --bit-rate 2000000 --time-limit 30 /sdcard/probe.mp4 > verification/record.log 2>&1 &\nrecorder=$!\nsleep .4\nadb shell\
        \ am start -W -n app.spool.music/com.music.bitchord.MainActivity > verification/launch.txt\nwait \"$recorder\"\nadb pull /sdcard/probe.mp4 verification/probe.mp4\n\
        adb shell screencap -p /sdcard/post.png\nadb pull /sdcard/post.png verification/post.png\nadb shell uiautomator dump /sdcard/post.xml\nadb pull /sdcard/post.xml\
        \ verification/post.xml\nadb pull /data/user/0/app.spool.music/files/launch-icon.png verification/launch-icon.png\nadb logcat -d -b all > verification/logcat.txt\n\
        adb shell dumpsys gfxinfo app.spool.music framestats > verification/gfx.txt\nadb shell cat /data/user/0/app.spool.music/shared_prefs/bitchord_settings.xml\
        \ > verification/prefs-after.xml\nfor progress in 0 0.00001 0.35 0.55 0.7; do\n  adb shell am force-stop app.spool.music\n  adb shell am start -W -n app.spool.music/com.music.bitchord.MainActivity\
        \ --ef spool_probe_progress \"$progress\" > \"verification/fixed-$progress-launch.txt\"\n  sleep 3\n  adb shell screencap -p /sdcard/fixed.png\n  adb pull\
        \ /sdcard/fixed.png \"verification/fixed-$progress.png\"\ndone\n\nPROBE\n"
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
        script: bash /tmp/probe.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: motion-debug16-explicit-antialias-NO-RELEASE
        path: verification
        retention-days: 14
