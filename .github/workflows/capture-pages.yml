name: Publish verified version-only1.9.12 stable OTA latest
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Verify staged target and catalog before authorized stable publication
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        repo=JoyalGeorge2006/spool

        tag=v1.9.12

        test "$(gh api repos/$repo/releases/latest --jq .tag_name)" = v1.9.9

        gh api repos/$repo/releases --paginate --jq ''.[] | select(.tag_name=="v1.9.12" and .draft==true)'' > /tmp/release-before.json

        test "$(jq -s length /tmp/release-before.json)" = 1

        python - <<''PY''

        import json

        r=json.load(open(''/tmp/release-before.json''));assert r[''tag_name'']==''v1.9.12'' and r[''draft''] and not r[''prerelease''];assert r[''target_commitish'']==''main''

        a={x[''name'']:x for x in r[''assets'']};assert set(a)=={''spool.apk'',''spool49-50.spdelta'',''spool-ota-v1.json'',''spool-v1.9.12-source.tar.gz''}

        assert a[''spool.apk''][''size'']==153636328 and a[''spool.apk''][''digest'']==''sha256:82e1135a7ae15a3d7dabf3c4d6b59af5092e84068a35f00785c2cf7e2353ad86''

        assert a[''spool49-50.spdelta''][''size'']==9759545 and a[''spool49-50.spdelta''][''digest'']==''sha256:212cf7101b7d789550976a51162dfd3c7ce49845af453b7add806d2690a603a4''

        assert all(x[''state'']==''uploaded''for x in a.values())

        PY

        mkdir /tmp/release-check

        gh release download "$tag" --repo "$repo" --pattern spool-ota-v1.json --dir /tmp/release-check

        python - <<''PY''

        import json,hashlib,pathlib

        r=json.load(open(''/tmp/release-before.json''));a={x[''name'']:x for x in r[''assets'']};p=pathlib.Path(''/tmp/release-check/spool-ota-v1.json'');assert a[p.name][''size'']==p.stat().st_size
        and a[p.name][''digest'']==''sha256:''+hashlib.sha256(p.read_bytes()).hexdigest();c=json.loads(p.read_text());assert c[''schema'']==1 and len(c[''patches''])==1;d=c[''patches''][0]

        expected=dict(format=''spdelta-1'',layout=''standalone'',package=''app.spool.music'',target_version=''1.9.12'',target_code=50,base_code=49,min_sdk=26,abi=''arm64-v8a'',base_size=153636328,base_sha256=''0bb445a4bb335d7391472c9144ef41642433260409b52cd4d2ed02b643c2b976'',target_size=153636328,target_sha256=''82e1135a7ae15a3d7dabf3c4d6b59af5092e84068a35f00785c2cf7e2353ad86'',patch_size=9759545,patch_sha256=''212cf7101b7d789550976a51162dfd3c7ce49845af453b7add806d2690a603a4'',patch_asset_id=str(a[''spool49-50.spdelta''][''id'']))

        assert d==expected

        print(''Exact published-catalog candidate and latest baseline verified'')

        PY

        gh release edit "$tag" --repo "$repo" --draft=false --prerelease=false --latest

        gh api repos/$repo/releases/latest > /tmp/release-after.json

        jq -e ''.tag_name=="v1.9.12" and .draft==false and .prerelease==false'' /tmp/release-after.json

        cat /tmp/release-after.json

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spool50-stable-publication-metadata
        path: '/tmp/release-before.json

          /tmp/release-after.json

          /tmp/release-check/spool-ota-v1.json'
        retention-days: 14
