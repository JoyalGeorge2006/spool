name: Build Spool approved six UI changes v76 - private APK only
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Restore byte-verified frozen v75 source
      id: source
      run: 'set -euo pipefail

        cp .github/workflows/1-spool-astryx-audit-capture.yml /tmp/audit-frozen-spec.yml

        python3 -m pip install pyyaml==6.0.3

        python3 - <<''PYRESTORE''

        import yaml,subprocess

        from pathlib import Path

        spec=yaml.safe_load(Path(''/tmp/audit-frozen-spec.yml'').read_text())

        script=spec[''jobs''][''capture''][''steps''][2][''run'']

        Path(''/tmp/audit-restore.sh'').write_text(script)

        subprocess.check_call([''bash'',''-e'',''/tmp/audit-restore.sh''])

        PYRESTORE

        '
    - name: Apply approved P001 P002 P014 P039a P040a P041a only
      run: 'set -euo pipefail

        python3 - <<''PYAPPROVED''

        import base64,lzma

        open(''/tmp/approved-six.patch'',''wb'').write(lzma.decompress(base64.b64decode('''')))

        PYAPPROVED

        echo ''8b716c7dc0ba9ecdd0405cf469340b5df0f7a37f4c2892ba274d365b199cf1f7  /tmp/approved-six.patch'' | sha256sum -c -

        git apply --check /tmp/approved-six.patch

        git apply /tmp/approved-six.patch

        '
    - name: Prepare checks
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Build approved phone acceptance APK
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: 'chmod +x gradlew

        ./gradlew :app:assembleProdDebug -Pbitchord.bundleWear=false

        '
    - name: Verify package, updater guard and signer
      run: 'set -euo pipefail

        bc=$(find app/build/generated -name BuildConfig.java -path ''*prod*'' | head -1)

        echo "BuildConfig: $bc"

        grep -n ''SEPARATELY_PROVIDED_UPDATES = true'' "$bc"

        aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)

        signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)

        mkdir -p "$RUNNER_TEMP/apk-out"

        cp app/build/outputs/apk/prod/debug/*-arm64-v8a-debug.apk "$RUNNER_TEMP/apk-out/spool.apk"

        "$aapt" dump badging "$RUNNER_TEMP/apk-out/spool.apk" | head -3 | tee /tmp/badging.txt

        grep -q "package: name=''app.spool.music''" /tmp/badging.txt

        if grep -q "package: name=''app.spool.music.dev''" /tmp/badging.txt; then echo "::error::wrong package"; exit 1; fi

        "$signer" verify --verbose --print-certs "$RUNNER_TEMP/apk-out/spool.apk" | tee /tmp/certs.txt

        grep -qi ''a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee'' /tmp/certs.txt

        test "$(unzip -l "$RUNNER_TEMP/apk-out/spool.apk" | grep -c ''lib/arm64-v8a/'')" -gt 0

        sha256sum "$RUNNER_TEMP/apk-out/"*.apk | tee /tmp/apk-sha256.txt

        '
    - name: Save exact verified APK and build evidence
      uses: actions/upload-artifact@v4
      with:
        name: spool-approved-six-v76
        path: '${{ runner.temp }}/apk-out/spool.apk

          /tmp/apk-sha256.txt

          /tmp/badging.txt

          /tmp/certs.txt

          /tmp/approved-six.patch'
        if-no-files-found: error
        retention-days: 30
    - name: Create unpublished draft APK for private delivery only
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\nrepo=JoyalGeorge2006/spool\ntag=spool-approved-six-v76-20261118\napk=\"$RUNNER_TEMP/apk-out/spool.apk\"\ncp \"$apk\" /tmp/Spool-Mobile-Approved-Six-v76.apk\ngh api repos/$repo/releases --paginate > /tmp/releases-before.json\nif jq -e --arg tag \"$tag\" '.[] | select(.tag_name==$tag)' /tmp/releases-before.json; then\n  echo 'Existing matching draft found; refusing duplicate mutation'\n  exit 1\nfi\ngh release create \"$tag\" --repo \"$repo\" --draft --target \"$GITHUB_SHA\" --title 'Spool approved six UI changes v76 (unpublished draft)' --notes 'Six approved UI changes only. Same mobile debug package and persisted signer as v75; no size optimization or pending proposals. Physical-keyboard/provider acceptance remains pending. Do not publish.' /tmp/Spool-Mobile-Approved-Six-v76.apk\ntest \"$(gh release view \"$tag\" --repo \"$repo\" --json isDraft --jq .isDraft)\" = true\ngh release view \"$tag\" --repo \"$repo\" --json isDraft,url,assets,tagName > /tmp/v76-draft-metadata.json\ncat /tmp/v76-draft-metadata.json\n"
    - name: Save private delivery metadata
      uses: actions/upload-artifact@v4
      with:
        name: spool-approved-six-v76-delivery
        path: /tmp/v76-draft-metadata.json
        if-no-files-found: error
        retention-days: 30
    permissions:
      contents: write
      actions: read
