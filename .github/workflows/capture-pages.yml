name: Deliver latest queue test APK as separate prerelease only
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: spool49-queue-signed-device-test-NOT-PUBLISHED
        run-id: '44466337448'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: /tmp/queue-artifact
    - name: Verify retained bytes and publish approved prerelease only
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\nrepo=JoyalGeorge2006/spool\ntag=queue-test-20261119\napk=/tmp/queue-artifact/tmp/candidate-out/spool-v1.9.11_universal.apk\necho \"\
        0bb445a4bb335d7391472c9144ef41642433260409b52cd4d2ed02b643c2b976  $apk\" | sha256sum -c -\ntest \"$(stat -c %s \"$apk\")\" = 153636328\ntest \"$(gh api repos/$repo/releases/latest\
        \ --jq .tag_name)\" = v1.9.9\ngh api repos/$repo/releases --paginate > /tmp/releases-before.json\nif jq -e --arg tag \"$tag\" '.[] | select(.tag_name==$tag)'\
        \ /tmp/releases-before.json; then\n echo 'Matching test release exists; refuse duplicate mutation'; exit 1\nfi\ncp \"$apk\" /tmp/Spool-1.9.11-queue-test.apk\n\
        cat > /tmp/test-notes.txt <<'NOTES'\nDevice-test APK only, not the production update channel.\n\nSpool 1.9.11/code49, package app.spool.music, signed with\
        \ the existing app certificate.\nQueued songs now have one-tap removal with Undo and a separate drag handle. The currently playing song retains its original\
        \ three-dot menu. Includes the previous static-launch and pending updater changes.\n\n105 queue checks passed, including real-pointer controls, lock changes,\
        \ Undo placement, ExoPlayer restore, queue coordinator and party-move checks. The startup/updater regression command also passed. Fresh light/dark and large-text\
        \ UI-test renders inspected. No physical-device, audio continuity or upgrade/data-retention acceptance is claimed. Locked removal controls work but still\
        \ look active; that known visual issue is unchanged.\n\nInstall over the existing app. Do not uninstall or clear app data.\n\nAPK provenance: build run44466337448,\
        \ workflow commit862b492efed5fd29c2526355a731901b8d75fb14. This tag is a download container on the repository default branch, not a claim that its tree is\
        \ the exact APK source. Exact candidate source is retained in the original build artifact, not the automatic source links below.\nAPK SHA256:0bb445a4bb335d7391472c9144ef41642433260409b52cd4d2ed02b643c2b976\n\
        APK bytes:153636328\nNOTES\ngh release create \"$tag\" --repo \"$repo\" --target main --prerelease --latest=false --title 'Spool 1.9.11 queue test' --notes-file\
        \ /tmp/test-notes.txt /tmp/Spool-1.9.11-queue-test.apk\ngh release view \"$tag\" --repo \"$repo\" --json url,tagName,isDraft,isPrerelease,assets > /tmp/static-delivery.json\n\
        jq -e '.isDraft==false and .isPrerelease==true and (.assets|length)==1' /tmp/static-delivery.json\ntest \"$(gh api repos/$repo/releases/latest --jq .tag_name)\"\
        \ = v1.9.9\ncat /tmp/static-delivery.json\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: queue-test-delivery-metadata
        path: /tmp/static-delivery.json
        retention-days: 7
