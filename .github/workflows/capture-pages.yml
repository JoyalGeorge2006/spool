name: Spool optimized multi-device candidates and attached Auto browser tests, no release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  optimized:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        module:
        - tv
    steps:
    - &id001
      uses: actions/checkout@v4
    - &id002
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - &id003
      name: Restore verified published source and candidate overlay
      run: "set -euo pipefail\ncurl -fL https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.9/spool-v1.9.9-source.tar.gz -o /tmp/baseline.tar.gz\necho\
        \ '3ffb4a494d3eb3ff7a43016bd1b869d8ad8b4957796a208ccdbaec5550f53aea  /tmp/baseline.tar.gz' | sha256sum -c -\nfind . -mindepth 1 -maxdepth 1 ! -name .git !\
        \ -name .github -exec rm -rf {} +\ntar xzf /tmp/baseline.tar.gz\npython3 - <<'PYOVERLAY'\nimport base64,lzma,tarfile,io\nb=lzma.decompress(base64.b64decode(''))\n\
        with tarfile.open(fileobj=io.BytesIO(b)) as t:\n    for m in t.getmembers():\n        assert not m.name.startswith('/') and '..' not in m.name.split('/')\
        \ and m.isfile()\n    t.extractall('.')\nPYOVERLAY\nchmod +x gradlew\n"
    - name: Optimized unsigned candidate build
      run: 'mkdir -p verification

        status=0

        ./gradlew :${{ matrix.module }}:assembleProdRelease -Pbitchord.bundleWear=false --stacktrace > verification/build.log 2>&1 || status=$?

        tail -80 verification/build.log

        find ${{ matrix.module }}/build/outputs/apk/prod/release -name ''*.apk'' -type f -exec stat -c ''%n %s'' {} + > verification/apk-bytes.txt || true

        find ${{ matrix.module }}/build/outputs/apk/prod/release -name ''*.apk'' -type f -exec sha256sum {} + > verification/SHA256SUMS || true

        exit "$status"

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: platform2-${{ matrix.module }}
        path: 'verification

          app/build/outputs/apk/prod/release

          tv/build/outputs/apk/prod/release

          wearos/build/outputs/apk/prod/release'
        retention-days: 7
  auto-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - *id001
    - *id002
    - *id003
    - name: Build phone and attached-browser instrumentation
      run: 'mkdir -p verification

        ./gradlew :app:assembleProdDebug :app:assembleProdDebugAndroidTest -Pbitchord.bundleWear=false --stacktrace > verification/build.log 2>&1

        echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm


        cat > /tmp/run-spool-auto.sh <<''AUTOTEST''

        set -e

        apk=$(find app/build/outputs/apk/prod/debug -name ''*.apk'' | grep ''x86_64'' | head -1)

        if [ -z "$apk" ]; then apk=$(find app/build/outputs/apk/prod/debug -name ''*.apk'' | grep -vE ''armeabi|arm64|x86'' | head -1); fi

        adb shell pm path com.google.android.projection.gearhead > verification/android-auto-package.txt

        adb shell pm path com.android.vending > verification/play-store-package.txt

        adb shell pm list packages > verification/device-packages.txt

        adb install --no-streaming "$apk"

        adb install --no-streaming app/build/outputs/apk/androidTest/prod/debug/app-prod-debug-androidTest.apk

        adb shell am instrument -w -r -e class com.music.bitchord.AndroidAutoMediaLibraryTest app.spool.music.test/androidx.test.runner.AndroidJUnitRunner | tee verification/auto-tests.txt

        adb logcat -d -b all > verification/logcat.txt

        grep -q ''OK (5 tests)'' verification/auto-tests.txt


        AUTOTEST

        '
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
        script: bash /tmp/run-spool-auto.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: auto-browser2-api35
        path: verification
        retention-days: 7
