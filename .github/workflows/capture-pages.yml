name: Spool approved one tap queue removal tests NO APK NO RELEASE
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  candidate48:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Restore current source with approved one-tap queue control
      run: "set -euo pipefail\ncurl -fL https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.9/spool-v1.9.9-source.tar.gz -o /tmp/baseline.tar.gz\necho\
        \ '3ffb4a494d3eb3ff7a43016bd1b869d8ad8b4957796a208ccdbaec5550f53aea  /tmp/baseline.tar.gz' | sha256sum -c -\nfind . -mindepth 1 -maxdepth 1 ! -name .git !\
        \ -name .github -exec rm -rf {} +\ntar xzf /tmp/baseline.tar.gz\npython3 - <<'PYOVERLAY'\nimport base64,lzma,tarfile,io\nb=lzma.decompress(base64.b64decode(''))\n\
        with tarfile.open(fileobj=io.BytesIO(b)) as t:\n    for m in t.getmembers():\n        assert not m.name.startswith('/') and '..' not in m.name.split('/')\
        \ and m.isfile()\n    t.extractall('.')\nPYOVERLAY\nchmod +x gradlew\n\nrm -f app/src/main/java/com/music/bitchord/ui/components/SpoolLaunch.kt app/src/test/java/com/music/bitchord/SpoolLaunchTest.kt\
        \ app/src/test/java/com/music/bitchord/SpoolLaunchScreenshotTest.kt\n"
    - name: Queue gesture removal Undo and touch-target regression tests
      run: 'set -euo pipefail

        mkdir -p verification

        ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false --tests ''com.music.bitchord.PlayerGesturePagingTest_*'' --tests ''com.music.bitchord.PlayerGestureMenuUndoTest''
        --tests ''com.music.bitchord.QueueOneTapRemovalTest'' --tests ''com.music.bitchord.QueueAdjacentRegressionTest'' --tests ''com.music.bitchord.playback.QueueUndo*Test''
        --tests ''com.music.bitchord.QueueEdgeScrollTest'' --tests ''com.music.bitchord.QueueCoordinatorTest'' --tests ''com.music.bitchord.playback.PartyQueueMoveTest''
        --stacktrace > verification/queue-tests.log 2>&1

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: queue-adjacent-audit-NO-APK-NO-RELEASE
        path: 'verification

          app/build/test-results

          app/build/outputs/roborazzi'
        retention-days: 14
