name: Spool v78 active OTA cumulative build and safety verification
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Restore byte-verified frozen v75 source
      id: source
      run: 'set -euo pipefail

        cp .github/workflows/1-spool-astryx-audit-capture.yml /tmp/audit-frozen-spec.yml

        python3 -m pip install pyyaml==6.0.3

        python3 - <<''PYRESTORE''

        import yaml,subprocess

        from pathlib import Path

        spec=yaml.safe_load(Path(''/tmp/audit-frozen-spec.yml'').read_text())

        script=spec[''jobs''][''capture''][''steps''][2][''run'']

        Path(''/tmp/audit-restore.sh'').write_text(script)

        subprocess.check_call([''bash'',''-e'',''/tmp/audit-restore.sh''])

        PYRESTORE

        '
    - name: Apply approved P001 P002 P014 P039a P040a P041a only
      run: 'set -euo pipefail

        python3 - <<''PYAPPROVED''

        import base64,lzma

        open(''/tmp/approved-six.patch'',''wb'').write(lzma.decompress(base64.b64decode('''')))

        PYAPPROVED

        echo ''8b716c7dc0ba9ecdd0405cf469340b5df0f7a37f4c2892ba274d365b199cf1f7  /tmp/approved-six.patch'' | sha256sum -c -

        git apply --check /tmp/approved-six.patch

        git apply /tmp/approved-six.patch

        '
    - name: Restore current Profile Developer Related source
      run: 'python3 - <<''RESTORE''

        import base64,hashlib,tarfile,io,lzma

        b=base64.b64decode('''')

        assert hashlib.sha256(b).hexdigest()==''9b46c3c7be32e8267c26055df66bf07f97f7d3a5326991eaf1a0a500e702377a''

        with tarfile.open(fileobj=io.BytesIO(lzma.decompress(b))) as t:t.extractall(''.'')

        RESTORE

        '
    - name: Apply cumulative active OTA and regression fixes
      run: 'python3 - <<''PATCH''

        import base64,lzma,hashlib

        b=lzma.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''c6436e076d0cd5bb0a5971b366267b07467200f071bac665a47448a3d1245bb3''

        open(''/tmp/v78-active.patch'',''wb'').write(b)

        PATCH

        git apply --check /tmp/v78-active.patch

        git apply /tmp/v78-active.patch

        '
    - name: Apply selected Related and persistent background update downloads
      run: 'python3 - <<''PATCH''

        import base64,lzma,hashlib

        b=lzma.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''35726ad1047935e5f9b79deba094cfba0bccea4a5a2aaa30981f1e424e7e6371''

        open(''/tmp/background.patch'',''wb'').write(b)

        PATCH

        git apply --check /tmp/background.patch

        git apply /tmp/background.patch

        '
    - name: Prepare checks
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Preserve complete corresponding source with GPL license
      run: 'mkdir -p /tmp/source-out

        tar --exclude=.git --exclude=.gradle --exclude=''*/build'' --exclude=node_modules --exclude=''*.keystore'' --exclude=local.properties --exclude=''.env*'' --exclude=verification -czf /tmp/source-out/spool-v1.9.6-source.tar.gz .

        sha256sum /tmp/source-out/spool-v1.9.6-source.tar.gz > /tmp/source-out/source-sha256.txt

        '
    - uses: actions/upload-artifact@v4
      with:
        name: Spool-v78-complete-corresponding-source
        path: /tmp/source-out
        retention-days: 30
    - name: Build code44 cumulative Related and background updater APK
      run: 'chmod +x gradlew

        ./gradlew :app:assembleProdDebug -Pbitchord.bundleWear=false'
      env: &id001
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
    - name: Verify package, updater guard and signer
      run: 'set -euo pipefail

        bc=$(find app/build/generated -name BuildConfig.java -path ''*prod*'' | head -1)

        echo "BuildConfig: $bc"

        grep -n ''SEPARATELY_PROVIDED_UPDATES = false'' "$bc"

        aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)

        signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)

        mkdir -p "$RUNNER_TEMP/apk-out"

        cp app/build/outputs/apk/prod/debug/*-arm64-v8a-debug.apk "$RUNNER_TEMP/apk-out/spool.apk"

        "$aapt" dump badging "$RUNNER_TEMP/apk-out/spool.apk" | head -3 | tee /tmp/badging.txt

        grep -q "package: name=''app.spool.music''" /tmp/badging.txt

        if grep -q "package: name=''app.spool.music.dev''" /tmp/badging.txt; then echo "::error::wrong package"; exit 1; fi

        "$signer" verify --verbose --print-certs "$RUNNER_TEMP/apk-out/spool.apk" | tee /tmp/certs.txt

        grep -qi ''a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee'' /tmp/certs.txt

        test "$(unzip -l "$RUNNER_TEMP/apk-out/spool.apk" | grep -c ''lib/arm64-v8a/'')" -gt 0

        sha256sum "$RUNNER_TEMP/apk-out/"*.apk | tee /tmp/apk-sha256.txt


        grep -q "versionCode=''44''" /tmp/badging.txt

        grep -q "versionName=''1.9.6''" /tmp/badging.txt

        '
    - uses: actions/upload-artifact@v4
      with:
        name: Spool-v78-active-OTA-APK
        path: '${{ runner.temp }}/apk-out/spool.apk

          /tmp/apk-sha256.txt

          /tmp/certs.txt

          /tmp/badging.txt'
        retention-days: 30
    - name: Native update-page captures and offline safety regressions
      run: "cat > /tmp/isolation.gradle <<'INIT'\nallprojects { tasks.withType(Test).configureEach { forkEvery = 1; maxParallelForks = 1 } }\nINIT\nmkdir -p verification\nstatus=0\nfor case in UpdateDownloadsTest RelatedRoundedActionsTest AppUpdateSafetyTest AppUpdatesScreenshot_light AppUpdatesScreenshot_dark AppUpdatesScreenshot_available AppUpdatesScreenshot_large AppUpdatesScreenshot_current RelatedPageScreenshotTest_light RelatedPageScreenshotTest_dark RelatedPageScreenshotTest_large RelatedPageScreenshotTest_error AboutDeveloperScreenshotTest_light AboutDeveloperScreenshotTest_dark AboutDeveloperScreenshotTest_large AccountSettingsScreenshotTest_light AppNavigatorTest; do\n timeout --kill-after=20s 8m ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false -I /tmp/isolation.gradle --tests \"com.music.bitchord.$case\" > \"verification/$case.log\" 2>&1 || status=1\n tail -25 \"verification/$case.log\"\n mkdir -p \"verification/$case\"\n cp -R app/build/test-results \"verification/$case/\" || true\ndone\nexit \"$status\"\n"
      env: *id001
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Spool-v78-active-OTA-native-verification
        path: 'verification

          app/build/outputs/roborazzi

          app/build/reports/tests'
        retention-days: 30
