name: Fresh UI tree background OTA and verified install acceptance
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  publish-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: JoyalGeorge2006/spool
        run-id: 44245372182
        name: Spool-v78-active-OTA-APK
        path: final
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: JoyalGeorge2006/spool
        run-id: 44245372182
        name: Spool-v78-complete-corresponding-source
        path: source
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: JoyalGeorge2006/spool
        run-id: 44243011057
        name: Spool-v78-active-OTA-APK
        path: baseline
    - name: Prepare release notes and real UI probe
      run: 'python3 - <<''PREP''

        import base64

        open(''/tmp/ota-ui.py'',''wb'').write(base64.b64decode(''''))

        PREP

        echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Gate exact unchanged APK and baseline, no publication
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        repo=JoyalGeorge2006/spool

        state=$(gh api repos/$repo/actions/runs/44245372182 --jq ''.conclusion'')

        test "$state" = success

        apk=$(find final -name spool.apk -type f | head -1)

        base=$(find baseline -name spool.apk -type f | head -1)

        echo "4bb7387b1b498d99c67b2bfeb9f70cb7e64f675170c9d8db834e22870189f57d  $apk" | sha256sum -c -

        echo "c380b0f5ac0a09343f80bfa1307c513422f3c27295b749ec5ee9243da4910ccb  $base" | sha256sum -c -

        echo ''3ffb4a494d3eb3ff7a43016bd1b869d8ad8b4957796a208ccdbaec5550f53aea  source/spool-v1.9.9-source.tar.gz'' | sha256sum -c -

        cp "$apk" spool-v1.9.9_arm64-v8a.apk

        cp "$base" /tmp/baseline.apk

        cp source/spool-v1.9.9-source.tar.gz .

        sha256sum spool-v1.9.9_arm64-v8a.apk spool-v1.9.9-source.tar.gz > SHA256SUMS

        mkdir -p verification

        gh release view v1.9.9 --repo "$repo" --json url,assets > verification/published-release.json

        '
    - name: Real44to47 updater continues with process absent then restores and installs
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 37.2-beta3
        arch: x86_64
        target: google_apis_ps16k
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
        script: bash -o pipefail -c 'timeout 720 python3 -u /tmp/ota-ui.py 2>&1 | tee verification/ota-ui-probe.txt; status=${PIPESTATUS[0]}; adb logcat -d -b all > verification/ota-logcat.txt; exit $status'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Spool-v78-published-real-OTA-evidence
        path: verification
        retention-days: 30
