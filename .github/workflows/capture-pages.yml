name: Spool1.9.12 version-only signed OTA target NO PUBLICATION
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  candidate48:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Restore exact1.9.11 source with version-only1.9.12 change
      run: "set -euo pipefail\ncurl -fL https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.9/spool-v1.9.9-source.tar.gz -o /tmp/baseline.tar.gz\necho\
        \ '3ffb4a494d3eb3ff7a43016bd1b869d8ad8b4957796a208ccdbaec5550f53aea  /tmp/baseline.tar.gz' | sha256sum -c -\nfind . -mindepth 1 -maxdepth 1 ! -name .git !\
        \ -name .github -exec rm -rf {} +\ntar xzf /tmp/baseline.tar.gz\npython3 - <<'PYOVERLAY'\nimport base64,lzma,tarfile,io\nb=lzma.decompress(base64.b64decode(''))\n\
        with tarfile.open(fileobj=io.BytesIO(b)) as t:\n    for m in t.getmembers():\n        assert not m.name.startswith('/') and '..' not in m.name.split('/')\
        \ and m.isfile()\n    t.extractall('.')\nPYOVERLAY\nchmod +x gradlew\n\nrm -f app/src/main/java/com/music/bitchord/ui/components/SpoolLaunch.kt app/src/test/java/com/music/bitchord/SpoolLaunchTest.kt\
        \ app/src/test/java/com/music/bitchord/SpoolLaunchScreenshotTest.kt\n"
    - name: Archive exact candidate source before signing material
      run: 'set -euo pipefail

        mkdir -p /tmp/candidate-out verification

        tar --exclude=.git --exclude=.gradle --exclude=''*/build'' --exclude=node_modules --exclude=''*.keystore'' --exclude=keystore.properties --exclude=local.properties
        --exclude=''.env*'' --exclude=verification -czf /tmp/candidate-out/spool-v1.9.12-source.tar.gz .

        '
    - name: Build optimized upcoming candidate
      run: 'mkdir -p verification

        ./gradlew :app:assembleProdRelease -Pbitchord.bundleWear=false --stacktrace > verification/build.log 2>&1

        '
    - uses: actions/upload-artifact@v4
      with:
        name: spool50-unsigned-compiled-source
        path: '/tmp/candidate-out

          app/build/outputs/apk/prod/release'
        retention-days: 14
    - name: Expose live test start and end
      run: "cat > /tmp/visible-tests.gradle <<'GRADLE'\nallprojects { tasks.withType(Test).configureEach {\n testLogging { events 'started', 'passed', 'skipped',\
        \ 'failed' }\n beforeTest { descriptor -> println('TEST_START ' + descriptor.className + '.' + descriptor.name) }\n afterTest { descriptor, result -> println('TEST_END\
        \ ' + descriptor.className + '.' + descriptor.name + ' ' + result.resultType) }\n} }\nGRADLE\n"
    - name: Visible bounded startup-updater regressions
      run: 'set -euo pipefail

        mkdir -p verification

        timeout --signal=TERM --kill-after=30s 25m ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false --tests ''com.music.bitchord.StaticLaunchTest''
        --tests ''com.music.bitchord.SpoolStartupThemeTest'' --tests ''com.music.bitchord.AppUpdateSafetyTest'' --tests ''com.music.bitchord.SpoolDeltaTest'' --tests
        ''com.music.bitchord.UpdateStoreTest'' --tests ''com.music.bitchord.UpdateDownloadsTest'' --tests ''com.music.bitchord.OtaFlowTest'' --tests ''com.music.bitchord.UpdateAssetSelectionTest''
        --stacktrace --console=plain --info --init-script /tmp/visible-tests.gradle 2>&1 | tee verification/startup-updater.log

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spool50-startup-updater-results
        path: 'verification

          app/build/test-results

          app/build/outputs/roborazzi'
        retention-days: 14
    - name: Visible bounded queue regressions
      run: 'set -euo pipefail

        mkdir -p verification

        timeout --signal=TERM --kill-after=30s 10m ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false --tests ''com.music.bitchord.PlayerGesturePagingTest_*''
        --tests ''com.music.bitchord.PlayerGestureMenuUndoTest'' --tests ''com.music.bitchord.QueueOneTapRemovalTest'' --tests ''com.music.bitchord.QueueAdjacentRegressionTest''
        --tests ''com.music.bitchord.playback.QueueUndo*Test'' --tests ''com.music.bitchord.QueueEdgeScrollTest'' --tests ''com.music.bitchord.QueueCoordinatorTest''
        --tests ''com.music.bitchord.playback.PartyQueueMoveTest'' --stacktrace --console=plain --info --init-script /tmp/visible-tests.gradle 2>&1 | tee verification/queue.log

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spool50-queue-results
        path: 'verification

          app/build/test-results

          app/build/outputs/roborazzi'
        retention-days: 14
    - name: Sign candidate with existing identity and verify every final APK
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: "set -euo pipefail\ntest -n \"$SPOOL_DEBUG_KEYSTORE_B64\"\nprintf '%s' \"$SPOOL_DEBUG_KEYSTORE_B64\" | base64 -d > /tmp/spool-signing.keystore\nchmod 600\
        \ /tmp/spool-signing.keystore\nsigner=$(find \"$ANDROID_HOME/build-tools\" -name apksigner -type f | sort -V | tail -1)\naapt=$(find \"$ANDROID_HOME/build-tools\"\
        \ -name aapt -type f | sort -V | tail -1)\nfor abi in universal arm64-v8a armeabi-v7a x86_64; do\n  input=\"app/build/outputs/apk/prod/release/app-prod-$abi-release-unsigned.apk\"\
        \n  output=\"/tmp/candidate-out/spool-v1.9.12_$abi.apk\"\n  \"$signer\" sign --ks /tmp/spool-signing.keystore --ks-key-alias spooldebug --ks-pass env:SPOOL_DEBUG_STORE_PASSWORD\
        \ --key-pass env:SPOOL_DEBUG_KEY_PASSWORD --out \"$output\" \"$input\"\n  \"$signer\" verify --verbose --print-certs \"$output\" > \"verification/certs-$abi.txt\"\
        \n  grep -qi a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee \"verification/certs-$abi.txt\"\n  \"$aapt\" dump badging \"$output\" > \"verification/badging-$abi.txt\"\
        \n  grep -q \"package: name='app.spool.music' versionCode='50' versionName='1.9.12'\" \"verification/badging-$abi.txt\"\ndone\nrm /tmp/spool-signing.keystore\n\
        cp /tmp/candidate-out/spool-v1.9.12_universal.apk /tmp/candidate-out/spool.apk\ncp /tmp/candidate-out/spool.apk /tmp/candidate-out/spool-v1.9.12.apk\npython3\
        \ - <<'VERIFY'\nimport zipfile\np='/tmp/candidate-out/spool.apk'\nwith zipfile.ZipFile(p) as z:\n libs={a:{n.split('/')[-1] for n in z.namelist() if n.startswith('lib/'+a+'/')}\
        \ for a in ['armeabi-v7a','arm64-v8a','x86_64']}\n assert all(libs.values()) and libs['armeabi-v7a']==libs['arm64-v8a']==libs['x86_64'],libs\n assert not\
        \ any(n.startswith('lib/x86/') for n in z.namelist())\n print('Complete equal native sets across3approvedABIs:',len(libs['arm64-v8a']))\nVERIFY\n(cd /tmp/candidate-out\
        \ && sha256sum *.apk *.tar.gz > SHA256SUMS)\nstat -c '%n %s' /tmp/candidate-out/* > verification/final-bytes.txt\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spool50-version-only-signed-NOT-PUBLISHED
        path: '/tmp/candidate-out

          verification

          app/build/test-results

          app/build/outputs/roborazzi'
        retention-days: 14
