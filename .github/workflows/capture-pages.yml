name: Exact published 1.9.4 to 1.9.9 install diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  exact-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - name: Download exact published artifacts
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl -fL --retry 2 https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.4/spool-v1.9.4_arm64-v8a.apk -o baseline.apk
          curl -fL --retry 2 https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.9/spool-v1.9.9_arm64-v8a.apk -o update.apk
          echo '8e04fdcdf0847ff166f035ed58c3a83fbe29159009e45b1e5f5155b953402274  baseline.apk' | sha256sum -c -
          echo '4bb7387b1b498d99c67b2bfeb9f70cb7e64f675170c9d8db834e22870189f57d  update.apk' | sha256sum -c -
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install exact baseline then update preserving app data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: |
            adb shell getprop > evidence/device-properties.txt
            adb install --no-streaming baseline.apk | tee evidence/install42.txt
            grep -q Success evidence/install42.txt
            adb shell dumpsys package app.spool.music > evidence/package42.txt
            adb shell run-as app.spool.music mkdir -p files
            echo exact42to47-sentinel | adb shell run-as app.spool.music tee files/exact42to47.txt
            adb install -r --no-streaming update.apk | tee evidence/install47.txt
            grep -q Success evidence/install47.txt
            adb shell dumpsys package app.spool.music > evidence/package47.txt
            grep -q 'versionCode=47' evidence/package47.txt
            adb shell run-as app.spool.music cat files/exact42to47.txt | tee evidence/sentinel-after.txt
            grep -q exact42to47-sentinel evidence/sentinel-after.txt
            adb shell am start -n app.spool.music/com.music.bitchord.MainActivity
            sleep 15
            adb shell screencap -p /sdcard/final.png
            adb pull /sdcard/final.png evidence/final.png
            adb shell pidof app.spool.music | tee evidence/pid.txt
            adb shell dumpsys activity activities > evidence/activities.txt
            adb logcat -d -b all > evidence/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact42to47-api${{ matrix.api }}
          path: evidence
          retention-days: 30
