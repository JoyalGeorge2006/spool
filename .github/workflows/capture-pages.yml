name: Deliver approved static launch test APK prerelease only
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: spool48-static-launch-signed-test-NOT-PUBLISHED
        run-id: '44438090175'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: /tmp/static-artifact
    - name: Verify retained bytes and publish approved prerelease only
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\nrepo=JoyalGeorge2006/spool\ntag=static-launch-test-20261119\napk=/tmp/static-artifact/tmp/candidate-out/spool-v1.9.10_universal.apk\n\
        echo \"76f3f1ffc9e8ab33508edca961dc7b464586e72545e8dd481eb870c18a0dc7af  $apk\" | sha256sum -c -\ntest \"$(stat -c %s \"$apk\")\" = 153636328\ntest \"$(gh\
        \ api repos/$repo/releases/latest --jq .tag_name)\" = v1.9.9\ngh api repos/$repo/releases --paginate > /tmp/releases-before.json\nif jq -e --arg tag \"$tag\"\
        \ '.[] | select(.tag_name==$tag)' /tmp/releases-before.json; then\n echo 'Matching test release exists; refuse duplicate mutation'; exit 1\nfi\ncp \"$apk\"\
        \ /tmp/Spool-1.9.10-static-launch-test.apk\ncat > /tmp/test-notes.txt <<'NOTES'\nTest APK only, not the production update channel.\n\nSpool 1.9.10/code48,\
        \ package app.spool.music, signed with the existing app certificate.\nCustom loading-screen launch animation removed. Android retains its static splash until\
        \ the app opens. Includes the pending OTA updater flow improvements.\n\n54 automated tests passed, including static splash resources in light/dark on API31/35\
        \ and OTA regressions. This exact APK has not been installed or visually checked on a device. No device compatibility or data-retention acceptance is claimed.\n\
        \nInstall over the existing app. Do not uninstall or clear app data.\n\nAPK provenance: build run44438090175, workflow commit a3c4696b570e72bef2657aff0095ec6797f3fb88.\
        \ This tag is a download container on the repository default branch, not a claim that its tree is the exact APK source. The exact source is retained in the\
        \ original build artifact.\nAPK SHA256:76f3f1ffc9e8ab33508edca961dc7b464586e72545e8dd481eb870c18a0dc7af\nAPK bytes:153636328\nNOTES\ngh release create \"\
        $tag\" --repo \"$repo\" --target main --prerelease --latest=false --title 'Spool 1.9.10 static launch test' --notes-file /tmp/test-notes.txt /tmp/Spool-1.9.10-static-launch-test.apk\n\
        gh release view \"$tag\" --repo \"$repo\" --json url,tagName,isDraft,isPrerelease,assets > /tmp/static-delivery.json\njq -e '.isDraft==false and .isPrerelease==true\
        \ and (.assets|length)==1' /tmp/static-delivery.json\ntest \"$(gh api repos/$repo/releases/latest --jq .tag_name)\" = v1.9.9\ncat /tmp/static-delivery.json\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: static-launch-test-delivery-metadata
        path: /tmp/static-delivery.json
        retention-days: 7
