name: Spool corrected43 clean native16KB runtime acceptance
'on':
  workflow_dispatch: {}
permissions: &id001
  contents: read
  actions: read
jobs:
  publish-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: *id001
    steps:
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: JoyalGeorge2006/spool
        run-id: 44237006640
        name: Spool-v78-active-OTA-APK
        path: candidate
    - name: Prepare native runtime probe
      run: 'python3 - <<''PREP''

        import base64

        open(''/tmp/native-probe.py'',''wb'').write(base64.b64decode(''''))

        PREP

        cp $(find candidate -name spool.apk -type f | head -1) /tmp/candidate.apk

        mkdir -p verification

        sha256sum /tmp/candidate.apk | tee verification/candidate-sha256.txt

        echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Launch corrected43 on Android17beta16KB without compatibility dismissal
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 37.2-beta3
        arch: x86_64
        target: google_apis_ps16k
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
        script: python3 /tmp/native-probe.py > verification/native-probe.txt 2>&1; status=$?; cat verification/native-probe.txt; adb logcat -d -b all > verification/native-logcat.txt; exit $status
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Spool-v78-code43-clean-native-runtime
        path: verification
        retention-days: 30
