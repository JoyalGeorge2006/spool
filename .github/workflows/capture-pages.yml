name: Spool48 revised core46 startup candidate signed build NO PUBLICATION
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  candidate48:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - &id001
      name: Restore verified source and final candidate overlay
      run: "set -euo pipefail\ncurl -fL https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.9/spool-v1.9.9-source.tar.gz -o /tmp/baseline.tar.gz\necho\
        \ '3ffb4a494d3eb3ff7a43016bd1b869d8ad8b4957796a208ccdbaec5550f53aea  /tmp/baseline.tar.gz' | sha256sum -c -\nfind . -mindepth 1 -maxdepth 1 ! -name .git !\
        \ -name .github -exec rm -rf {} +\ntar xzf /tmp/baseline.tar.gz\npython3 - <<'PYOVERLAY'\nimport base64,lzma,tarfile,io\nb=lzma.decompress(base64.b64decode(''))\n\
        with tarfile.open(fileobj=io.BytesIO(b)) as t:\n    for m in t.getmembers():\n        assert not m.name.startswith('/') and '..' not in m.name.split('/')\
        \ and m.isfile()\n    t.extractall('.')\nPYOVERLAY\nchmod +x gradlew\n"
    - name: Archive exact candidate source before signing material
      run: 'set -euo pipefail

        mkdir -p /tmp/candidate-out verification

        tar --exclude=.git --exclude=.gradle --exclude=''*/build'' --exclude=node_modules --exclude=''*.keystore'' --exclude=keystore.properties --exclude=local.properties
        --exclude=''.env*'' --exclude=verification -czf /tmp/candidate-out/spool-v1.9.10-source.tar.gz .

        '
    - name: Build optimized upcoming candidate
      run: 'mkdir -p verification

        ./gradlew :app:assembleProdRelease -Pbitchord.bundleWear=false --stacktrace > verification/build.log 2>&1

        '
    - name: Sign candidate with existing identity and verify every final APK
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: "set -euo pipefail\ntest -n \"$SPOOL_DEBUG_KEYSTORE_B64\"\nprintf '%s' \"$SPOOL_DEBUG_KEYSTORE_B64\" | base64 -d > /tmp/spool-signing.keystore\nchmod 600\
        \ /tmp/spool-signing.keystore\nsigner=$(find \"$ANDROID_HOME/build-tools\" -name apksigner -type f | sort -V | tail -1)\naapt=$(find \"$ANDROID_HOME/build-tools\"\
        \ -name aapt -type f | sort -V | tail -1)\nfor abi in universal arm64-v8a armeabi-v7a x86_64; do\n  input=\"app/build/outputs/apk/prod/release/app-prod-$abi-release-unsigned.apk\"\
        \n  output=\"/tmp/candidate-out/spool-v1.9.10_$abi.apk\"\n  \"$signer\" sign --ks /tmp/spool-signing.keystore --ks-key-alias spooldebug --ks-pass env:SPOOL_DEBUG_STORE_PASSWORD\
        \ --key-pass env:SPOOL_DEBUG_KEY_PASSWORD --out \"$output\" \"$input\"\n  \"$signer\" verify --verbose --print-certs \"$output\" > \"verification/certs-$abi.txt\"\
        \n  grep -qi a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee \"verification/certs-$abi.txt\"\n  \"$aapt\" dump badging \"$output\" > \"verification/badging-$abi.txt\"\
        \n  grep -q \"package: name='app.spool.music' versionCode='48' versionName='1.9.10'\" \"verification/badging-$abi.txt\"\ndone\nrm /tmp/spool-signing.keystore\n\
        cp /tmp/candidate-out/spool-v1.9.10_universal.apk /tmp/candidate-out/spool.apk\ncp /tmp/candidate-out/spool.apk /tmp/candidate-out/spool-v1.9.10.apk\npython3\
        \ - <<'VERIFY'\nimport zipfile\np='/tmp/candidate-out/spool.apk'\nwith zipfile.ZipFile(p) as z:\n libs={a:{n.split('/')[-1] for n in z.namelist() if n.startswith('lib/'+a+'/')}\
        \ for a in ['armeabi-v7a','arm64-v8a','x86_64']}\n assert all(libs.values()) and libs['armeabi-v7a']==libs['arm64-v8a']==libs['x86_64'],libs\n assert not\
        \ any(n.startswith('lib/x86/') for n in z.namelist())\n print('Complete equal native sets across3approvedABIs:',len(libs['arm64-v8a']))\nVERIFY\n(cd /tmp/candidate-out\
        \ && sha256sum *.apk *.tar.gz > SHA256SUMS)\nstat -c '%n %s' /tmp/candidate-out/* > verification/final-bytes.txt\n"
    - name: Prepare exact installed-release baseline and test script
      run: 'set -euo pipefail

        curl -fL https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.9/spool-v1.9.9_arm64-v8a.apk -o /tmp/baseline47.apk

        echo ''4bb7387b1b498d99c67b2bfeb9f70cb7e64f675170c9d8db834e22870189f57d  /tmp/baseline47.apk'' | sha256sum -c -

        echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        cat > /tmp/accept-spool48.sh <<''ACCEPT''

        set -euo pipefail

        adb root

        adb wait-for-device

        test "$(adb shell id -u | tr -dc ''0-9'')" = 0

        adb shell getprop > verification/device-properties.txt

        adb install --no-streaming /tmp/baseline47.apk | tee verification/install47.txt

        grep -q Success verification/install47.txt

        adb shell run-as app.spool.music mkdir -p files

        printf ''spool48-data-preserved'' | adb shell run-as app.spool.music tee files/spool48-sentinel.txt

        adb install -r --no-streaming /tmp/candidate-out/spool.apk | tee verification/install48.txt

        grep -q Success verification/install48.txt

        adb shell dumpsys package app.spool.music > verification/package48.txt

        grep -q ''versionCode=48'' verification/package48.txt

        adb shell cat /data/user/0/app.spool.music/files/spool48-sentinel.txt | tee verification/sentinel-after.txt

        grep -q spool48-data-preserved verification/sentinel-after.txt

        adb shell am start -n app.spool.music/com.music.bitchord.MainActivity

        sleep 12

        adb shell pidof app.spool.music | tee verification/pid48.txt

        test -s verification/pid48.txt

        adb shell screencap -p /sdcard/final48.png

        adb pull /sdcard/final48.png verification/final48.png

        adb shell dumpsys activity activities > verification/activities.txt

        adb logcat -d -b all > verification/logcat.txt

        ACCEPT

        '
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
        script: bash /tmp/accept-spool48.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spool48-final2-signed-exact-source-NOT-PUBLISHED
        path: '/tmp/candidate-out

          verification'
        retention-days: 14
  core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - *id001
    - name: Compile and run update regressions
      run: "mkdir -p verification\nstatus=0\n./gradlew :app:compileProdDebugKotlin :app:compileProdDebugJavaWithJavac -Pbitchord.bundleWear=false --stacktrace > verification/compile.log\
        \ 2>&1 || status=$?\ntail -90 verification/compile.log\nif [ \"$status\" = 0 ]; then\n  ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false\
        \ --tests 'com.music.bitchord.AppUpdateSafetyTest' --tests 'com.music.bitchord.SpoolDeltaTest' --tests 'com.music.bitchord.UpdateStoreTest' --tests 'com.music.bitchord.UpdateDownloadsTest'\
        \ --tests 'com.music.bitchord.OtaFlowTest' --tests 'com.music.bitchord.UpdateAssetSelectionTest' --stacktrace > verification/tests.log 2>&1 || status=$?\n\
        \  tail -90 verification/tests.log\nfi\nexit \"$status\"\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: core46-with-startup-lazy-final2
        path: 'verification

          app/build/test-results

          app/build/outputs/roborazzi'
        retention-days: 7
