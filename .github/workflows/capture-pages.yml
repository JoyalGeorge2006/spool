name: Spool exact motion candidate real theme launch capture with foreground assertions no release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  candidate48:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - uses: actions/download-artifact@v4
      with:
        name: spool48-motion-final4-signed-exactsource-NOT-PUBLISHED
        path: candidate
        run-id: 44354668626
        github-token: ${{ github.token }}
    - name: Prepare same signed APK capture with full launch window and actual UI assertions
      run: "set -euo pipefail\nmkdir -p verification /tmp/candidate-out\napk=$(find candidate -path '*/tmp/candidate-out/spool.apk' -print -quit)\ntest -s \"$apk\"\
        \ncp \"$apk\" /tmp/candidate-out/spool.apk\necho 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules\n\
        sudo udevadm control --reload-rules\nsudo udevadm trigger --name-match=kvm\ncat > /tmp/accept-spool48.sh <<'ACCEPT'\nset -euo pipefail\nadb root\nadb wait-for-device\n\
        test \"$(adb shell id -u | tr -dc '0-9')\" = 0\nadb shell getprop > verification/device-properties.txt\nadb install -r --no-streaming /tmp/candidate-out/spool.apk\
        \ | tee verification/install48.txt\ngrep -q Success verification/install48.txt\nadb shell dumpsys package app.spool.music > verification/package48.txt\ngrep\
        \ -q 'versionCode=48' verification/package48.txt\ntrue\ntrue\nadb shell am force-stop com.google.android.apps.nexuslauncher\nadb shell am start -n app.spool.music/com.music.bitchord.MainActivity\n\
        sleep 12\nadb shell pidof app.spool.music | tee verification/pid48.txt\ntest -s verification/pid48.txt\nadb shell screencap -p /sdcard/final48.png\nadb pull\
        \ /sdcard/final48.png verification/final48.png\nadb shell dumpsys activity activities > verification/activities.txt\nadb logcat -d -b all > verification/logcat.txt\n\
        \nfor mode in light dark reduced; do\n  if [ \"$mode\" = dark ]; then adb shell cmd uimode night yes; else adb shell cmd uimode night no; fi\n  if [ \"$mode\"\
        \ = reduced ]; then adb shell settings put global animator_duration_scale 0; else adb shell settings put global animator_duration_scale 1; fi\n  adb shell\
        \ am force-stop com.google.android.apps.nexuslauncher\n  adb shell am force-stop app.spool.music\n  adb shell screenrecord --time-limit 12 /sdcard/launch-$mode.mp4\
        \ > verification/record-$mode.log 2>&1 &\n  recorder=$!\n  sleep 0.4\n  adb shell am start -W -n app.spool.music/com.music.bitchord.MainActivity > verification/launch-$mode.txt\n\
        \  wait \"$recorder\"\n  adb pull /sdcard/launch-$mode.mp4 verification/launch-$mode.mp4\n  adb shell screencap -p /sdcard/post-$mode.png\n  adb pull /sdcard/post-$mode.png\
        \ verification/post-$mode.png\n  adb shell dumpsys activity activities > verification/activity-$mode.txt\n  grep 'topResumedActivity=.*app.spool.music' verification/activity-$mode.txt\n\
        \  adb shell uiautomator dump /sdcard/ui.xml\n  adb pull /sdcard/ui.xml verification/ui-$mode.xml\n  grep -q 'package=\"app.spool.music\"' verification/ui-$mode.xml\n\
        \  if grep -qi 'not responding' verification/ui-$mode.xml; then exit 1; fi\ndone\nACCEPT\n"
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
        script: bash /tmp/accept-spool48.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: motion-runtime5-exact-final4-NOT-RELEASE
        path: verification
        retention-days: 14
