name: Spool future OTA candidate compile and regression tests, no release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Restore exact code47 source and candidate-only OTA overlay
      run: "set -euo pipefail\ncurl -fL https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.9/spool-v1.9.9-source.tar.gz -o /tmp/baseline.tar.gz\necho\
        \ '3ffb4a494d3eb3ff7a43016bd1b869d8ad8b4957796a208ccdbaec5550f53aea  /tmp/baseline.tar.gz' | sha256sum -c -\ntar xzf /tmp/baseline.tar.gz\npython3 - <<'PYOVERLAY'\n\
        import base64,lzma,tarfile,io\nb=lzma.decompress(base64.b64decode(''))\n\
        with tarfile.open(fileobj=io.BytesIO(b)) as t:\n    for m in t.getmembers():\n        assert not m.name.startswith('/') and '..' not in m.name.split('/')\
        \ and m.isfile()\n    t.extractall('.')\nPYOVERLAY\nchmod +x gradlew\n"
    - name: Compile and run update regressions
      run: 'mkdir -p verification

        ./gradlew :app:compileProdDebugKotlin :app:compileProdDebugJavaWithJavac -Pbitchord.bundleWear=false --stacktrace > verification/compile.log 2>&1

        ./gradlew :app:testProdDebugUnitTest -Pbitchord.bundleWear=false --tests ''com.music.bitchord.AppUpdateSafetyTest'' --stacktrace > verification/tests.log
        2>&1

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ota-candidate-round1
        path: 'verification

          app/build/test-results

          app/build/outputs/roborazzi'
        retention-days: 7
