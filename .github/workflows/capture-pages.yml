name: Deliver verified Spool v77 APK without rebuild
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: Spool-v77-APK-and-source
        run-id: '44228978469'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: downloaded
    - name: Verify exact APK and create unpublished delivery asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        apk=$(find downloaded -name spool.apk -type f | head -1)

        test -n "$apk"

        echo "38a9e47786af002d18924ec6e5203ca8834a858be70e17fe1b8bb022d35828e0  $apk"
        | sha256sum -c -

        cp "$apk" Spool-Mobile-Profile-Developer-Related-v77.apk

        gh release create spool-profile-developer-related-v77 --repo JoyalGeorge2006/spool
        --draft --target 61a8f668a218e1599e274379ac261696d019ec9a --title ''Spool
        v77 Profile Developer Related'' --notes ''Current built APK requested for
        handover. Android package/signer checks passed. Related light/dark/error and
        Profile/navigation fixture checks passed. Large-text Related and About capture
        selector failures remain unresolved; not physical-phone/live-provider acceptance.
        In-app updater remains disabled; separate update-feature build is planned.''
        Spool-Mobile-Profile-Developer-Related-v77.apk

        gh release view spool-profile-developer-related-v77 --repo JoyalGeorge2006/spool
        --json url,assets,isDraft

        '
    permissions:
      contents: write
      actions: read
