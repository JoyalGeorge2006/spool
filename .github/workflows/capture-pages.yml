name: Spool focused debug sharp measured vector reveal no signed candidate
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  candidate48:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Restore verified source and final candidate overlay
      run: "set -euo pipefail\ncurl -fL https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.9/spool-v1.9.9-source.tar.gz -o /tmp/baseline.tar.gz\necho\
        \ '3ffb4a494d3eb3ff7a43016bd1b869d8ad8b4957796a208ccdbaec5550f53aea  /tmp/baseline.tar.gz' | sha256sum -c -\nfind . -mindepth 1 -maxdepth 1 ! -name .git !\
        \ -name .github -exec rm -rf {} +\ntar xzf /tmp/baseline.tar.gz\npython3 - <<'PYOVERLAY'\nimport base64,lzma,tarfile,io\nb=lzma.decompress(base64.b64decode(''))\n\
        with tarfile.open(fileobj=io.BytesIO(b)) as t:\n    for m in t.getmembers():\n        assert not m.name.startswith('/') and '..' not in m.name.split('/')\
        \ and m.isfile()\n    t.extractall('.')\nPYOVERLAY\nchmod +x gradlew\n"
    - name: Build debug-only measured launch probe
      run: 'set -euo pipefail

        mkdir -p verification

        ./gradlew :app:assembleProdDebug :app:testProdDebugUnitTest -Pbitchord.bundleWear=false --tests ''com.music.bitchord.SpoolLaunchTest'' --tests ''com.music.bitchord.SpoolStartupThemeTest''
        --stacktrace > verification/build.log 2>&1

        cp -r app/build/test-results/testProdDebugUnitTest verification/unit-results

        apk=$(find app/build/outputs/apk -name ''*.apk'' -print -quit)

        cp "$apk" /tmp/probe.apk

        echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        cat > /tmp/probe.sh <<''PROBE''

        set -euo pipefail

        adb root

        adb wait-for-device

        adb shell wm size 480x960

        adb shell wm density 200

        adb install --no-streaming /tmp/probe.apk

        adb shell am start -n app.spool.music/com.music.bitchord.MainActivity

        sleep 8

        adb shell am force-stop app.spool.music

        adb shell "printf ''<map><string name=\"theme_mode\">LIGHT</string><boolean name=\"onboarding_complete\" value=\"true\" /></map>'' > /data/user/0/app.spool.music/shared_prefs/bitchord_settings.xml"

        adb shell cmd uimode night yes

        adb shell settings put global animator_duration_scale 1

        # First launch migrates saved app theme into Android''s per-package mode.

        adb shell am start -W -n app.spool.music/com.music.bitchord.MainActivity > verification/migration-launch.txt

        sleep 5

        adb shell am force-stop app.spool.music

        adb logcat -c

        adb shell screenrecord --bit-rate 2000000 --time-limit 12 /sdcard/probe.mp4 > verification/record.log 2>&1 &

        recorder=$!

        sleep .4

        adb shell am start -W -n app.spool.music/com.music.bitchord.MainActivity > verification/launch.txt

        wait "$recorder"

        adb pull /sdcard/probe.mp4 verification/probe.mp4

        adb pull /data/user/0/app.spool.music/files/launch-icon.png verification/launch-icon.png

        adb logcat -d -b all > verification/logcat.txt

        adb shell dumpsys gfxinfo app.spool.music framestats > verification/gfx.txt

        PROBE

        '
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
        script: bash /tmp/probe.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: motion-debug13-measured-vector-firstdraw-NO-RELEASE
        path: verification
        retention-days: 14
