name: v7 page captures from preserved APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Source run id with the raw-apk-splits artifact
        required: true

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v4

    - name: Download preserved x86 split
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh run download "${{ inputs.run_id }}" -n raw-apk-splits -D "$RUNNER_TEMP/splits" --repo JoyalGeorge2006/spool
        mkdir -p "$RUNNER_TEMP/apk-out" "$RUNNER_TEMP/pages"
        cp "$RUNNER_TEMP/splits"/*-x86_64-debug.apk "$RUNNER_TEMP/apk-out/spool-x86.apk"
        ls -la "$RUNNER_TEMP/apk-out/"

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Capture every page on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_6
        force-avd-creation: true
        script: |
          echo  | base64 -d > /tmp/cap.sh
          bash /tmp/cap.sh

    - name: Upload page captures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: page-captures
        path: ${{ runner.temp }}/pages/
        if-no-files-found: ignore
