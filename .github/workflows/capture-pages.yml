name: Publish approved persistent banner dismissal1.9.14 stable latest
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Verify staged target and catalog before authorized stable publication
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        repo=JoyalGeorge2006/spool

        tag=v1.9.14

        test "$(gh api repos/$repo/releases/latest --jq .tag_name)" = v1.9.13

        gh api repos/$repo/releases --paginate --jq ''.[] | select(.tag_name=="v1.9.14" and .draft==true)'' > /tmp/release-before.json

        test "$(jq -s length /tmp/release-before.json)" = 1

        python - <<''PY''

        import json

        r=json.load(open(''/tmp/release-before.json''));assert r[''tag_name'']==''v1.9.14'' and r[''draft''] and not r[''prerelease''];assert r[''target_commitish'']==''main''

        a={x[''name'']:x for x in r[''assets'']};assert set(a)=={''spool.apk'',''spool51-52.spdelta'',''spool-ota-v1.json'',''spool-v1.9.14-source.tar.gz''}

        assert a[''spool.apk''][''size'']==153636328 and a[''spool.apk''][''digest'']==''sha256:3346078286acfac862cc7ca43dac40dd1f618155a4de1aa6a4f063c3b624e847''

        assert a[''spool51-52.spdelta''][''size'']==10888141 and a[''spool51-52.spdelta''][''digest'']==''sha256:121ab061c354e1b18a45ca0a4e5fc04e906e60325f1b9140665050a2db9956f1''

        assert all(x[''state'']==''uploaded''for x in a.values())

        PY

        mkdir /tmp/release-check

        gh release download "$tag" --repo "$repo" --pattern spool-ota-v1.json --dir /tmp/release-check

        python - <<''PY''

        import json,hashlib,pathlib

        r=json.load(open(''/tmp/release-before.json''));a={x[''name'']:x for x in r[''assets'']};p=pathlib.Path(''/tmp/release-check/spool-ota-v1.json'');assert a[p.name][''size'']==p.stat().st_size
        and a[p.name][''digest'']==''sha256:''+hashlib.sha256(p.read_bytes()).hexdigest();c=json.loads(p.read_text());assert c[''schema'']==1 and len(c[''patches''])==1;d=c[''patches''][0]

        expected=dict(format=''spdelta-1'',layout=''standalone'',package=''app.spool.music'',target_version=''1.9.14'',target_code=52,base_code=51,min_sdk=26,abi=''arm64-v8a'',base_size=153636328,base_sha256=''e0d47be8219145011114ea6e5568fecc559910edc9282d0176b50f75e42a708f'',target_size=153636328,target_sha256=''3346078286acfac862cc7ca43dac40dd1f618155a4de1aa6a4f063c3b624e847'',patch_size=10888141,patch_sha256=''121ab061c354e1b18a45ca0a4e5fc04e906e60325f1b9140665050a2db9956f1'',patch_asset_id=str(a[''spool51-52.spdelta''][''id'']))

        assert d==expected

        print(''Exact published-catalog candidate and latest baseline verified'')

        PY

        gh release edit "$tag" --repo "$repo" --draft=false --prerelease=false --latest

        gh api repos/$repo/releases/latest > /tmp/release-after.json

        jq -e ''.tag_name=="v1.9.14" and .draft==false and .prerelease==false'' /tmp/release-after.json

        cat /tmp/release-after.json

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spool52-stable-publication-metadata
        path: '/tmp/release-before.json

          /tmp/release-after.json

          /tmp/release-check/spool-ota-v1.json'
        retention-days: 14
