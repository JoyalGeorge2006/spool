name: Verify keyboard on approved integrated source (no release)
on:
  workflow_dispatch:
  push:
    branches: [spool-song-menu-cleanup]
    paths: [.github/workflows/spool-keyboard-retry.yml]
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          cat > /tmp/platform.gradle <<'INIT'
          allprojects { afterEvaluate { p -> def a = p.extensions.findByName('android'); if(a != null) a.compileSdkVersion('android-37.0') } }
          INIT
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile before emulator boot
        run: |
          ./gradlew --init-script /tmp/platform.gradle :app:assembleDevDebug :app:assembleDevDebugAndroidTest -Pandroid.injected.build.abi=x86_64 --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/dev/debug/app-dev-debug.apk
            adb install -r app/build/outputs/apk/androidTest/dev/debug/app-dev-debug-androidTest.apk
            adb shell ime enable com.google.android.inputmethod.latin/com.android.inputmethod.latin.LatinIME || true
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell am instrument -w -r -e class com.music.bitchord.ListenSearchKeyboardTest app.spool.music.dev.test/androidx.test.runner.AndroidJUnitRunner | tee keyboard-instrumentation.log
            adb pull /sdcard/Android/data/app.spool.music.dev/files/. keyboard-screens/ || true
            grep -q 'OK (1 test)' keyboard-instrumentation.log
      - name: Retain actual screen evidence
        if: always()
        run: |
          mkdir -p keyboard-screens
          adb pull /sdcard/Android/data/app.spool.music.dev/files/. keyboard-screens/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listen-search-keyboard-proof
          path: |
            keyboard-instrumentation.log
            keyboard-screens/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
