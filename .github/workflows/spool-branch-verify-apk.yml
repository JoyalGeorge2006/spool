name: Verify branch debug APK (no release)
# Test-APK artifact for the isolated verification branch only. Internal debug
# signing via the repo's persisted debug keystore secrets (same as the main
# build-apk workflow); falls back to the generated debug key when the secrets
# are absent. Never touches release signing, tags, or releases.
on:
  push:
    branches: [spool-verify-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Android platform, NDK and compileSdk remap (same as the 2.1.1 build)
      shell: bash
      run: |
        set -euo pipefail
        SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SM" ] || SM="$(command -v sdkmanager)"
        "$SM" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
        cat > /tmp/platform.gradle <<'INIT'
        allprojects {
          afterEvaluate { p ->
            def android = p.extensions.findByName('android')
            if (android != null) android.compileSdkVersion('android-37.0')
          }
        }
        INIT
    - name: Restore the persisted debug keystore
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: |
        if [ -n "$SPOOL_DEBUG_KEYSTORE_B64" ]; then
          echo "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore
        fi
    - name: Assemble dev debug APK
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        timeout 1500 ./gradlew --init-script /tmp/platform.gradle :app:assembleDevDebug --no-daemon --stacktrace
    - name: Record APK identity
      run: |
        sha256sum app/build/outputs/apk/dev/debug/*.apk
        echo "built from commit $(git rev-parse HEAD)"
    - name: Upload the APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spool-verify-dev-debug-apk
        path: app/build/outputs/apk/dev/debug/*.apk
        if-no-files-found: error
