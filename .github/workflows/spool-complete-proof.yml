name: Render complete menu actions and corrected Library proof
on:
  push:
    branches: [spool-song-menu-cleanup]
    paths: [.github/workflows/spool-complete-proof.yml]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Update focused visual tests only
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import gzip,base64
          Path('app/src/test/java/com/music/bitchord/SparkRatingMotionTest.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          Path('app/src/test/java/com/music/bitchord/StableMenuRowsTest.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          Path('app/src/test/java/com/music/bitchord/LibrarySpacingProofTest.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          PYTEST
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/test
          git commit -m 'Show complete menu actions and themed Library in verification fixtures'
          git push origin HEAD:spool-song-menu-cleanup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          cat > /tmp/platform.gradle <<'INIT'
          allprojects { afterEvaluate { p -> def a = p.extensions.findByName('android'); if(a != null) a.compileSdkVersion('android-37.0') } }
          INIT
      - name: Render complete action menus and Library
        run: |
          ./gradlew --init-script /tmp/platform.gradle :app:testDevDebugUnitTest --tests com.music.bitchord.SparkRatingMotionTest --tests com.music.bitchord.StableMenuRowsTest --tests com.music.bitchord.LibrarySpacingProofTest --no-daemon --stacktrace 2>&1 | tee complete-proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-menu-library-proof
          path: |
            **/build/outputs/roborazzi/
            **/build/test-results/
            complete-proof.log
