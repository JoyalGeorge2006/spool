        #!/usr/bin/env bash
        set -euo pipefail
        export SMOKE_OUT="$RUNNER_TEMP/device-evidence"
        mkdir -p "$SMOKE_OUT"
        trap 'adb logcat -b all -d > "$SMOKE_OUT/final-logcat.txt"; adb logcat -b crash -d > "$SMOKE_OUT/final-crashes.txt"; adb shell dumpsys package app.spool.music > "$SMOKE_OUT/package.txt"' EXIT
        adb install "$RUNNER_TEMP/spool-v2.1.0.apk"
        python3 /tmp/spool-device-smoke.py --prepare-baseline
        adb shell am force-stop app.spool.music
        # Fresh emulator only. Reproduce a completed older transfer surviving upgrade.
        adb root
        adb wait-for-device
        python3 - <<'STALE'
        import json,uuid
        record=dict(schema=1,token=str(uuid.uuid4()),phase='installed',id=-1,version='2.0.0',
            apk='https://github.com/JoyalGeorge2006/spool/releases/download/v2.0.0/spool.apk',
            release='https://github.com/JoyalGeorge2006/spool/releases/tag/v2.0.0',sha='a'*64,size=10000,
            notes='',releaseId='',assetId='',legacy=False,message='',session=-1,installToken='')
        open('/tmp/stale-update.json','w').write(json.dumps(record))
        STALE
        adb shell mkdir -p /data/user/0/app.spool.music/no_backup
        adb push /tmp/stale-update.json /data/user/0/app.spool.music/no_backup/spool-update-v1.json
        app_uid=$(adb shell stat -c %u /data/user/0/app.spool.music | tr -d '\r')
        adb shell chown "$app_uid:$app_uid" /data/user/0/app.spool.music/no_backup/spool-update-v1.json
        adb shell restorecon /data/user/0/app.spool.music/no_backup/spool-update-v1.json
        adb pull /data/user/0/app.spool.music/no_backup/spool-update-v1.json "$SMOKE_OUT/seeded-update-record.json"
        adb install -r "$RUNNER_TEMP/apk-out/Spool-2.1.1-universal.apk"
        adb shell pm grant app.spool.music android.permission.READ_MEDIA_AUDIO
        adb shell pm grant app.spool.music android.permission.POST_NOTIFICATIONS
        python3 - <<'AUDIO'
        import wave
        with wave.open('/tmp/SpoolSmoke.wav','wb') as f:
            f.setnchannels(1);f.setsampwidth(2);f.setframerate(8000);f.writeframes(bytes(8000*2*120))
        AUDIO
        adb shell mkdir -p /sdcard/Music
        adb push /tmp/SpoolSmoke.wav /sdcard/Music/SpoolSmoke.wav
        adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Music/SpoolSmoke.wav
        adb logcat -b all -c
        python3 /tmp/spool-device-smoke.py --remaining
        test -s "$SMOKE_OUT/PASS"
        adb logcat -b crash -d > "$SMOKE_OUT/crash-gate.txt"
        if grep -qE 'FATAL EXCEPTION|Fatal signal|ANR in app.spool.music' "$SMOKE_OUT/crash-gate.txt"; then
          echo '::error::Crash or ANR after upgrade';exit 1
        fi
        DEVICE
        bash -n /tmp/spool-device-smoke.sh
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Upgrade, real navigation, Back and Android IME acceptance
      id: smoke
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_6
        ram-size: 2048M
        heap-size: 256M
        disk-size: 4096M
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader -camera-back none -no-snapshot -memory 2048 -cores 2
        force-avd-creation: true
        script: bash /tmp/spool-device-smoke.sh
    - name: Preserve device and build diagnostics on every outcome
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spool-2.1.1-device-evidence
        path: |
          ${{ runner.temp }}/device-evidence/
          /tmp/android-runner/
          /tmp/badging.txt
          /tmp/certs.txt
        if-no-files-found: warn
