name: spool bounded lower-layout and native last-row audit (no release)
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Materialize exact final source
      id: source
      run: 'set -euo pipefail

        git fetch origin 9f40c70e614d4e4d978d58295f59ab12ee07b493

        git checkout FETCH_HEAD -- . '':!.github''

        test "$(git rev-parse FETCH_HEAD)" = 9f40c70e614d4e4d978d58295f59ab12ee07b493

        echo  | base64 -d | gzip -d > /tmp/final.patch

        echo ''ed5d0418bd196378789e623ac7c163b0fac26637f2b5f30565e3899846c1c6aa  /tmp/final.patch'' | sha256sum -c -

        git apply /tmp/final.patch

        grep -n ''SEPARATELY_PROVIDED_UPDATES", "true"'' app/build.gradle.kts

        grep -cn ''externallyProvided'' app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt

        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"

        mkdir -p native/lame

        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

        '
    - name: Restore persisted signing key
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Build the final prod APKs
      id: compile
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: 'chmod +x gradlew

        ./gradlew :app:assembleProdDebug -Pbitchord.bundleWear=false

        '
    - name: Record bounded lower-layout fixture states
      if: always() && steps.source.outcome == 'success' && steps.compile.outcome == 'success'
      timeout-minutes: 15
      run: ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false --tests 'com.music.bitchord.LowerLayoutScreenshotTest.*'
    - name: Upload page screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: page-screenshots
        path: app/build/outputs/roborazzi/
        if-no-files-found: ignore
    - name: Enable KVM
      if: always() && steps.source.outcome == 'success' && steps.compile.outcome == 'success'
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Emulator instrumented suite + launch smoke
      if: always() && steps.source.outcome == 'success' && steps.compile.outcome == 'success'
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        script: 'bash -c ''set +e; mkdir -p /tmp/native-surface-evidence; adb logcat -b all -v threadtime > /tmp/native-logcat.txt 2>&1 & log_pid=$!; (while adb get-state; do adb pull /data/local/tmp/spool-audit /tmp/native-surface-evidence/; adb pull /sdcard/Download/SpoolSurfaceAudit /tmp/native-surface-evidence/; sleep 2; done) > /tmp/capture-copy.log 2>&1 & copy_pid=$!; ./gradlew :app:connectedProdDebugAndroidTest -Pbitchord.bundleWear=false -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.SpoolServiceIntegrationTest#playbackSettingsBothThemesNativeAudit; test_status=$?; adb pull /data/local/tmp/spool-audit /tmp/native-surface-evidence/; adb pull /sdcard/Download/SpoolSurfaceAudit /tmp/native-surface-evidence/; kill "$copy_pid"; wait "$copy_pid"; find /tmp/native-surface-evidence -type f -print; exit "$test_status"''

          '
    - name: Collect native host crash diagnostics regardless of emulator outcome
      if: always()
      run: 'mkdir -p /tmp/native-host-diagnostics

        sudo coredumpctl list --no-pager > /tmp/native-host-diagnostics/coredumps.txt 2>&1 || true

        sudo coredumpctl info --no-pager > /tmp/native-host-diagnostics/core-info.txt 2>&1 || true

        sudo journalctl -b --no-pager -n 700 > /tmp/native-host-diagnostics/journal.txt 2>&1 || true

        ps -ef > /tmp/native-host-diagnostics/processes.txt

        free -m > /tmp/native-host-diagnostics/memory.txt

        adb devices -l > /tmp/native-host-diagnostics/adb-devices.txt 2>&1 || true

        sudo dmesg --ctime > /tmp/native-host-diagnostics/kernel.txt 2>&1 || true

        '
    - name: Upload launch evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: prod-launch-evidence
        path: '/tmp/prod-launch.png

          /tmp/capture-copy.log

          /tmp/native-surface-evidence/

          /tmp/native-host-diagnostics/

          /tmp/native-logcat.txt

          /tmp/android-runner/

          app/build/reports/androidTests/

          '
        if-no-files-found: ignore
'on':
  workflow_dispatch: null
