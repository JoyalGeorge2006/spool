name: spool final prod APK (separate install, no release)
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - name: Materialize exact final source
      id: source
      run: 'set -euo pipefail

        git fetch origin 9f40c70e614d4e4d978d58295f59ab12ee07b493

        git checkout FETCH_HEAD -- . '':!.github''

        test "$(git rev-parse FETCH_HEAD)" = 9f40c70e614d4e4d978d58295f59ab12ee07b493

        echo  | base64 -d | gzip -d > /tmp/final.patch

        echo ''4509ef08d949596383aa98c0a45bb8889fc25ec904929b970c281638f9ada64b  /tmp/final.patch'' | sha256sum -c -

        git apply /tmp/final.patch

        grep -n ''SEPARATELY_PROVIDED_UPDATES", "true"'' app/build.gradle.kts

        grep -cn ''externallyProvided'' app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt

        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"

        mkdir -p native/lame

        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

        '
    - name: Restore persisted signing key
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: 'test -n "$SPOOL_DEBUG_KEYSTORE_B64"

        printf ''%s'' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore

        test -s spool-debug.keystore

        chmod 600 spool-debug.keystore

        '
    - name: Build the final prod APKs
      id: compile
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: 'chmod +x gradlew

        ./gradlew :app:assembleProdDebug -Pbitchord.bundleWear=false

        '
    - name: Record full-player directional gesture and final-row layout probes
      if: always() && steps.source.outcome == 'success' && steps.compile.outcome == 'success'
      timeout-minutes: 15
      run: ./gradlew :app:recordRoborazziProdDebug -Pbitchord.bundleWear=false --tests 'com.music.bitchord.PlayerGestureRegressionTest.*' --tests 'com.music.bitchord.SettingsScrollScreenshotTest.*'
    - name: Upload page screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: page-screenshots
        path: app/build/outputs/roborazzi/
        if-no-files-found: ignore
    - name: Run unit, JVM and screenshot suites
      timeout-minutes: 15
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
        SPOOL_ONLINE_TESTS: 1
      run: "./gradlew :app:testProdDebugUnitTest :shared:jvmTest :sharedUi:jvmTest --continue -Pbitchord.bundleWear=false\necho '--- VersionResolutionOnlineTest execution proof ---'\nif ls shared/build/test-results/jvmTest/TEST-*VersionResolutionOnlineTest*.xml 1>/dev/null 2>&1; then\n  grep -h 'testcase\\|ONLINE-PROBE\\|SKIP:' shared/build/test-results/jvmTest/TEST-*VersionResolutionOnlineTest*.xml || true\nelse\n  echo 'PROBE XML MISSING - probe did not execute'\n  exit 1\nfi\n"
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: 'app/build/reports/tests/

          shared/build/reports/tests/

          sharedUi/build/reports/tests/

          app/build/outputs/roborazzi/

          '
        if-no-files-found: ignore
    - name: Fail-safe raw APK splits artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: raw-apk-splits
        path: app/build/outputs/apk/prod/debug/*.apk
        if-no-files-found: ignore
    - name: Verify package, updater guard and signer
      run: 'set -euo pipefail

        bc=$(find app/build/generated -name BuildConfig.java -path ''*prod*'' | head -1)

        echo "BuildConfig: $bc"

        grep -n ''SEPARATELY_PROVIDED_UPDATES = true'' "$bc"

        aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)

        signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)

        mkdir -p "$RUNNER_TEMP/apk-out"

        cp app/build/outputs/apk/prod/debug/*-arm64-v8a-debug.apk "$RUNNER_TEMP/apk-out/spool.apk"

        cp app/build/outputs/apk/prod/debug/*-universal-debug.apk "$RUNNER_TEMP/apk-out/spool-universal.apk"

        cp app/build/outputs/apk/prod/debug/*-x86_64-debug.apk "$RUNNER_TEMP/apk-out/spool-x86.apk"

        "$aapt" dump badging "$RUNNER_TEMP/apk-out/spool.apk" | head -3 | tee /tmp/badging.txt

        grep -q "package: name=''app.spool.music''" /tmp/badging.txt

        if grep -q "package: name=''app.spool.music.dev''" /tmp/badging.txt; then echo "::error::wrong package"; exit 1; fi

        "$signer" verify --verbose --print-certs "$RUNNER_TEMP/apk-out/spool.apk" | tee /tmp/certs.txt

        grep -qi ''a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee'' /tmp/certs.txt

        "$signer" verify --verbose --print-certs "$RUNNER_TEMP/apk-out/spool-universal.apk" | grep -qi ''a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee''

        test "$(unzip -l "$RUNNER_TEMP/apk-out/spool.apk" | grep -c ''lib/arm64-v8a/'')" -gt 0

        sha256sum "$RUNNER_TEMP/apk-out/"*.apk | tee /tmp/apk-sha256.txt

        '
    - name: Upload final APKs
      uses: actions/upload-artifact@v4
      with:
        name: spool-final-apk
        path: '${{ runner.temp }}/apk-out/spool.apk

          ${{ runner.temp }}/apk-out/spool-universal.apk

          /tmp/apk-sha256.txt

          /tmp/badging.txt

          /tmp/certs.txt

          '
    - name: Enable KVM
      if: always() && steps.source.outcome == 'success' && steps.compile.outcome == 'success'
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Emulator instrumented suite + launch smoke
      if: always() && steps.source.outcome == 'success' && steps.compile.outcome == 'success'
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        script: 'bash -c ''set +e; mkdir -p /tmp/native-surface-evidence; adb logcat -b all -v threadtime > /tmp/native-logcat.txt 2>&1 & log_pid=$!; (while adb get-state; do adb pull /data/local/tmp/spool-audit /tmp/native-surface-evidence/; adb pull /sdcard/Download/SpoolSurfaceAudit /tmp/native-surface-evidence/; sleep 2; done) > /tmp/capture-copy.log 2>&1 & copy_pid=$!; ./gradlew :app:connectedProdDebugAndroidTest -Pbitchord.bundleWear=false; test_status=$?; adb pull /data/local/tmp/spool-audit /tmp/native-surface-evidence/; adb pull /sdcard/Download/SpoolSurfaceAudit /tmp/native-surface-evidence/; kill "$copy_pid"; wait "$copy_pid"; find /tmp/native-surface-evidence -type f -print; exit "$test_status"''

          '
    - name: Collect native host crash diagnostics regardless of emulator outcome
      if: always()
      run: 'mkdir -p /tmp/native-host-diagnostics

        sudo coredumpctl list --no-pager > /tmp/native-host-diagnostics/coredumps.txt 2>&1 || true

        sudo coredumpctl info --no-pager > /tmp/native-host-diagnostics/core-info.txt 2>&1 || true

        sudo journalctl -b --no-pager -n 700 > /tmp/native-host-diagnostics/journal.txt 2>&1 || true

        ps -ef > /tmp/native-host-diagnostics/processes.txt

        free -m > /tmp/native-host-diagnostics/memory.txt

        adb devices -l > /tmp/native-host-diagnostics/adb-devices.txt 2>&1 || true

        sudo dmesg --ctime > /tmp/native-host-diagnostics/kernel.txt 2>&1 || true

        '
    - name: Upload launch evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: prod-launch-evidence
        path: '/tmp/prod-launch.png

          /tmp/capture-copy.log

          /tmp/native-surface-evidence/

          /tmp/native-host-diagnostics/

          /tmp/native-logcat.txt

          /tmp/android-runner/

          app/build/reports/androidTests/

          '
        if-no-files-found: ignore
'on':
  workflow_dispatch: null
