name: Accept exact signed Spool 2.1.1 candidate on emulator
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Download pinned signed candidate without rebuilding
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api repos/JoyalGeorge2006/spool/actions/runs/44772488230 > /tmp/build-run.json
        python3 - <<'PIN'
        import json
        r=json.load(open('/tmp/build-run.json'));assert r['head_sha']=='7ca3eb95605e9ff4f6206dfbb4cbc06fba23e47f'
        PIN
        gh run download 44772488230 --repo JoyalGeorge2006/spool --name spool-2.1.1-candidate-diagnostic-only --dir "$RUNNER_TEMP/candidate"
        mkdir -p "$RUNNER_TEMP/apk-out" "$RUNNER_TEMP/source-out"
        python3 - <<'FILES'
        from pathlib import Path
        import os,hashlib,shutil
        root=Path(os.environ['RUNNER_TEMP']);candidate=root/'candidate'
        for line in next(candidate.rglob('SHA256SUMS.txt')).read_text().splitlines():
            digest,name=line.split(maxsplit=1);name=Path(name.strip()).name
            source=next(candidate.rglob(name));assert hashlib.sha256(source.read_bytes()).hexdigest()==digest
            dest=root/('source-out' if name.endswith('.tar.gz') else 'apk-out')/name;shutil.copy2(source,dest)
        shutil.copy2(next(candidate.rglob('SHA256SUMS.txt')),root/'apk-out/SHA256SUMS.txt')
        FILES
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Download and verify the published 2.1.0 universal for upgrade test
      run: |
        set -euo pipefail
        curl -fL -o "$RUNNER_TEMP/spool-v2.1.0.apk" https://github.com/JoyalGeorge2006/spool/releases/download/v2.1.0-theme-preview/Spool-2.1.0-universal.apk
        echo '4a5993dc5cd3947c1f11ecc4bf1da1796e2db1c98ea539be924f0399b21da933  '"$RUNNER_TEMP/spool-v2.1.0.apk" | sha256sum -c -
