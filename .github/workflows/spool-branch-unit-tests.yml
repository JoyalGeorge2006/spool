name: Unit tests on a Spool branch (no APK, no release)
# Test-only verification for the taste-aware moods branch. Builds nothing
# shippable: no assemble*, no signing, no release upload. Compares the branch
# against its base so failures that predate the change are visible as such.
# Platform prep mirrors the 2.1.1 build workflow: platforms;android-37.0 plus
# an init script remapping compileSdk, since AGP has no stable android-37 id.
on:
  push:
    branches: [taste-aware-moods]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag under test
        required: true
        default: taste-aware-moods
      base:
        description: Base ref for the comparison run
        required: true
        default: v2.1.1
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [branch, base]
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.target == 'branch' && inputs.ref || inputs.base }}
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Android platform, NDK and compileSdk remap (same as the 2.1.1 build)
      shell: bash
      run: |
        set -euo pipefail
        SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SM" ] || SM="$(command -v sdkmanager)"
        "$SM" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
        cat > /tmp/platform.gradle <<'INIT'
        allprojects {
          afterEvaluate { p ->
            def android = p.extensions.findByName('android')
            if (android != null) android.compileSdkVersion('android-37.0')
          }
        }
        INIT
    - name: Unit tests (shared JVM + app dev unit tests)
      run: ./gradlew --init-script /tmp/platform.gradle :shared:jvmTest :app:testDevDebugUnitTest --no-daemon
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-tests-${{ matrix.target }}
        path: |
          **/build/test-results/
          **/build/reports/tests/
          **/build/outputs/roborazzi/
        if-no-files-found: warn
