name: Targeted player visible-tab selector verification, no release
on:
  push:
    branches: [taste-aware-moods]
    paths: ['.github/workflows/spool-branch-unit-tests.yml']
permissions:
  contents: read
jobs:
  player-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        ref: e290e8c945cc51d744445ebffb3cdf6c483eff17
        path: product
    - uses: actions/checkout@v4
      with:
        ref: dbb0572512f3a8462075ba311f41b9935540db40
        path: test-source
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Android platform, NDK and compileSdk remap (same as the 2.1.1 build)
      shell: bash
      run: |
        set -euo pipefail
        SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SM" ] || SM="$(command -v sdkmanager)"
        "$SM" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
        cat > /tmp/platform.gradle <<'INIT'
        allprojects {
          afterEvaluate { p ->
            def android = p.extensions.findByName('android')
            if (android != null) android.compileSdkVersion('android-37.0')
          }
        }
        INIT
    - name: Verify immutable product and exact approved test overlay
      working-directory: product
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = e290e8c945cc51d744445ebffb3cdf6c483eff17
        test -z "$(git status --porcelain)"
        test "$(git -C ../test-source rev-parse HEAD)" = dbb0572512f3a8462075ba311f41b9935540db40
        echo '38f14126e33ef82ef7a41a65eb2ba0b3cba68320daaf3e844e092129de5e2002  ../test-source/app/src/test/java/com/music/bitchord/PlayerContextLayerDiscriminatorTest.kt' | sha256sum -c -
        cp ../test-source/app/src/test/java/com/music/bitchord/PlayerContextLayerDiscriminatorTest.kt app/src/test/java/com/music/bitchord/PlayerContextLayerDiscriminatorTest.kt
        git diff --stat
    - name: Exact five-method class only
      working-directory: product
      shell: bash
      run: |
        set -euo pipefail
        timeout 1500 ./gradlew --init-script /tmp/platform.gradle :app:testDevDebugUnitTest --tests com.music.bitchord.PlayerContextLayerDiscriminatorTest --no-daemon 2>&1 | tee player-selector-gradle.log
    - name: Reconcile exact class methods and retained PNG pairs
      if: always()
      working-directory: product
      shell: bash
      run: |
        python3 - <<'PYTHON'
        import hashlib,json,pathlib,xml.etree.ElementTree as ET
        root=pathlib.Path('.')
        expected={'unchangedAutoBoundary','forcedParentOffscreenBoundary','forcedParentOffscreenExactSemanticsDiagnostic','forcedParentOffscreenExactVisibleTouchDiagnostic','zeroAreaDuplicateCannotBeAVisibleTab'}
        files=list(root.glob('app/build/test-results/testDevDebugUnitTest/TEST-*.xml'))
        cases=[]
        for file in files:
            cases.extend(ET.parse(file).getroot().iter('testcase'))
        assert len(cases)==5 and {c.attrib['name'] for c in cases}==expected
        assert all(c.attrib['classname']=='com.music.bitchord.PlayerContextLayerDiscriminatorTest' for c in cases)
        assert all(not any(c.find(tag) is not None for tag in ('failure','error','skipped')) for c in cases)
        names={'player_context_layer_'+mode+suffix+'.png' for mode in ('auto','offscreen','offscreen_semantics','offscreen_exact_touch') for suffix in ('','_artwork')}
        shots=[p for p in root.glob('app/build/outputs/roborazzi/**/*.png') if p.name in names]
        assert len(shots)==8 and {p.name for p in shots}==names
        rows=[]
        for p in shots:
            b=p.read_bytes();assert b[:8]==b'\x89PNG\r\n\x1a\n' and len(b)>100
            rows.append(dict(path=str(p),bytes=len(b),sha256=hashlib.sha256(b).hexdigest()))
        (root/'player-selector-reconciliation.json').write_text(json.dumps(dict(methods=sorted(expected),screenshots=rows),indent=2))
        PYTHON
    - name: Evidence only, no APKs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: player-selector-five-method-evidence
        path: |
          product/app/build/test-results/testDevDebugUnitTest/
          product/app/build/reports/tests/testDevDebugUnitTest/
          product/app/build/outputs/roborazzi/
          product/player-selector-gradle.log
          product/player-selector-reconciliation.json
          product/**/hs_err_pid*.log
        if-no-files-found: warn
