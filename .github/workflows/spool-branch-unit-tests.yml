name: Unit tests on a Spool branch (no APK, no release)
# Test-only verification for the taste-aware moods branch. Builds nothing
# shippable: no assemble*, no signing, no release upload. Compares the branch
# against its base so failures that predate the change are visible as such.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag under test
        required: true
        default: taste-aware-moods
      base:
        description: Base ref for the comparison run
        required: true
        default: v2.1.1
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [branch, base]
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.target == 'branch' && inputs.ref || inputs.base }}
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - uses: android-actions/setup-android@v3
    - name: Install Android platforms (compileSdk 37 is beta; alias the beta platform)
      run: |
        yes | sdkmanager "platforms;android-36" "platforms;android-37.2-beta3" "build-tools;36.0.0" >/dev/null
        [ -d "$ANDROID_HOME/platforms/android-37" ] || ln -sfn "$ANDROID_HOME/platforms/android-37.2-beta3" "$ANDROID_HOME/platforms/android-37"
    - name: Unit tests (shared JVM + app debug unit tests)
      run: ./gradlew :shared:jvmTest :app:testDebugUnitTest --no-daemon
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-tests-${{ matrix.target }}
        path: |
          **/build/test-results/**/TEST-*.xml
          **/build/reports/tests/**
        if-no-files-found: warn
