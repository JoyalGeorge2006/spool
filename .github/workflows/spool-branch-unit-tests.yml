name: Unit tests on a Spool branch (no APK, no release)
# Test-only verification for the taste-aware moods branch. Builds nothing
# shippable: no assemble*, no signing, no release upload. Compares the branch
# against its base so failures that predate the change are visible as such.
# Platform prep mirrors the 2.1.1 build workflow: platforms;android-37.0 plus
# an init script remapping compileSdk, since AGP has no stable android-37 id.
on:
  push:
    branches: [taste-aware-moods]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag under test
        required: true
        default: taste-aware-moods
      base:
        description: Base ref for the comparison run
        required: true
        default: v2.1.1
      include_base:
        description: Also run the unresolved v2.1.1 comparison lane explicitly
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Pushes and normal dispatch verify the full branch suite only.
        # The baseline remains unresolved, not a passing/waived comparison.
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_base == true && '["branch","base"]' || '["branch"]') }}
    steps:
    - uses: actions/checkout@v4
      with:
        # On push, inputs.* are empty: branch tests the pushed SHA, base tests
        # the real v2.1.1 baseline (previously both legs silently tested the
        # same pushed SHA).
        ref: ${{ matrix.target == 'branch' && (inputs.ref || github.sha) || (inputs.base || 'v2.1.1') }}
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Android platform, NDK and compileSdk remap (same as the 2.1.1 build)
      shell: bash
      run: |
        set -euo pipefail
        SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SM" ] || SM="$(command -v sdkmanager)"
        "$SM" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
        cat > /tmp/platform.gradle <<'INIT'
        allprojects {
          afterEvaluate { p ->
            def android = p.extensions.findByName('android')
            if (android != null) android.compileSdkVersion('android-37.0')
          }
        }
        INIT
    - name: Record exact checkout
      run: |
        echo "matrix target: ${{ matrix.target }}"
        echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
    - name: Runner diagnostics (sizes any memory decision with facts)
      run: |
        nproc
        free -h
        java -version 2>&1
        java -XX:+PrintFlagsFinal -version 2>&1 | grep -E 'MaxHeapSize|MaxRAM' || true
    - name: Unit tests (shared JVM + app dev unit tests)
      # timeout bounds a hung test VM at 25 min so artifacts still upload
      # instead of dying at the 60-min job cap; the exit code is preserved.
      run: timeout 1500 ./gradlew --init-script /tmp/platform.gradle :shared:jvmTest :app:testDevDebugUnitTest --no-daemon
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-tests-${{ matrix.target }}
        path: |
          **/build/test-results/
          **/build/reports/tests/
          **/build/outputs/roborazzi/
          **/hs_err_pid*.log
          **/replay_pid*.log
        if-no-files-found: warn
