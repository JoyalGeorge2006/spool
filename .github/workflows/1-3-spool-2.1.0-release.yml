name: spool 2.1.0 prerelease from verified artifact

# Publishes the ALREADY-BUILT, already-verified spool 2.1.0 APK artifact from a
# green spool-2.1.0-build run as a GitHub prerelease with the matching source
# tarball. Nothing is rebuilt here: the exact verified APK bytes are downloaded
# from the source run and pinned by sha256 before publishing.
#
# This workflow ONLY runs on manual dispatch. Dispatching it is the
# publication act; it stays on the repo inert until then.
#
# Matching source: the exact source the APK was built from is re-materialized
# in-runner with the same pinned recipe as the build run (v2.0.0 production
# tarball, sha256-verified; reviewed spool-edits-18 patch, sha256-verified;
# two-line version bump with greps), its git write-tree must equal
# expected_tree, and the resulting tree is published as
# spool-v2.1.0-source.tar.gz alongside the APKs.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Green 2.1.0 build run id carrying the spool-2.1.0-apk artifact
        required: true
        type: string
        default: '44737391641'
      artifact_name:
        description: Artifact name in that run
        required: true
        type: string
        default: 'spool-2.1.0-apk'
      expected_tree:
        description: Reviewed materialized-source tree hash (must match the build run)
        required: true
        type: string
        default: 'c2130cdf3c858f3d14322fb1fd97b6b2e7a68640'
      expected_arm64_sha256:
        description: sha256 of spool.apk (arm64) recorded in the build run log
        required: true
        type: string
        default: 'a04f0563b915afe674c1674a887528ba9582fbcde8236d3cb21f1b55e36d1884'
      expected_universal_sha256:
        description: sha256 of spool-universal.apk recorded in the build run log
        required: true
        type: string
        default: '52b0f3804e2c9e7860fdd89c174c8a5bce2501312f36ee9b95d2b7fd89e2f563'
      tag:
        description: Release tag to create
        required: true
        type: string
        default: 'v2.1.0-theme-preview'
      release_name:
        description: Release title
        required: true
        type: string
        default: 'spool 2.1.0 Material You preview'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v4

    - name: Download the verified APK artifact from the build run
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh run download "${{ inputs.run_id }}" -n "${{ inputs.artifact_name }}" -D "$RUNNER_TEMP/apk" --repo JoyalGeorge2006/spool
        ls -la "$RUNNER_TEMP/apk"
        mkdir -p "$RUNNER_TEMP/out"
        cp "$RUNNER_TEMP/apk/spool.apk" "$RUNNER_TEMP/out/Spool-2.1.0-arm64-v8a.apk"
        cp "$RUNNER_TEMP/apk/spool-universal.apk" "$RUNNER_TEMP/out/Spool-2.1.0-universal.apk"

    - name: Verify APK bytes, identity and signing certificate (fail closed)
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/out"
        echo "${{ inputs.expected_arm64_sha256 }}  Spool-2.1.0-arm64-v8a.apk" | sha256sum -c -
        echo "${{ inputs.expected_universal_sha256 }}  Spool-2.1.0-universal.apk" | sha256sum -c -
        AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
        "$AAPT" dump badging Spool-2.1.0-arm64-v8a.apk | head -2 | tee /tmp/badging.txt
        grep -q "package: name='app.spool.music'" /tmp/badging.txt
        grep -q "versionCode='57'" /tmp/badging.txt
        grep -q "versionName='2.1.0'" /tmp/badging.txt
        test "$(unzip -l Spool-2.1.0-arm64-v8a.apk | grep -c 'lib/arm64-v8a/')" -gt 0
        SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
        "$SIGNER" verify --verbose --print-certs Spool-2.1.0-arm64-v8a.apk | tee /tmp/certs.txt
        grep -qi 'a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee' /tmp/certs.txt
        "$SIGNER" verify --verbose --print-certs Spool-2.1.0-universal.apk \
          | grep -qi 'a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee'
        echo "APK verification passed: bytes, package, version 57/2.1.0, signing cert all match the verified build"

    - name: Verify the reviewed patch file byte-for-byte (sha256 pinned)
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        PATCH_FILE=$(ls "$GITHUB_WORKSPACE"/*spool-edits-18.patch)
        echo "reviewed patch: $PATCH_FILE"
        echo "4a3584edfd28e11424d0e927dbf8a58a95f050e9372a4197ee4043e9bdbd8852  $PATCH_FILE" | sha256sum -c -
        echo "PATCH_FILE=$PATCH_FILE" >> "$GITHUB_ENV"

    - name: Materialize exact matching source and assert its tree hash
      run: |
        set -euo pipefail
        for part in aa ab ac ad; do
          curl -fsSL -o "/tmp/spool-2.0.0-source.tar.gz.part-$part" "https://github.com/JoyalGeorge2006/spool/releases/download/v2.0.0/spool-v2.0.0-source.tar.gz.part-$part"
        done
        cat /tmp/spool-2.0.0-source.tar.gz.part-aa /tmp/spool-2.0.0-source.tar.gz.part-ab /tmp/spool-2.0.0-source.tar.gz.part-ac /tmp/spool-2.0.0-source.tar.gz.part-ad > /tmp/spool-source.tar.gz
        echo '938ca5b092ea53dba19d6078ffd6655bce56aca8d50ad923e88463d0a6720c37  /tmp/spool-source.tar.gz' | sha256sum -c -
        SRC="$RUNNER_TEMP/asset"
        mkdir -p "$SRC"
        tar xzf /tmp/spool-source.tar.gz -C "$SRC"
        cd "$SRC"
        git init -q
        git apply "$PATCH_FILE"
        test "$(grep -c '^extra\["bitchordVersionCode"\] = 56$' build.gradle.kts)" -eq 1
        test "$(grep -c '^extra\["bitchordVersionName"\] = "2.0.0"$' build.gradle.kts)" -eq 1
        sed -i -e 's/^extra\["bitchordVersionCode"\] = 56$/extra["bitchordVersionCode"] = 57/' \
               -e 's/^extra\["bitchordVersionName"\] = "2.0.0"$/extra["bitchordVersionName"] = "2.1.0"/' \
               build.gradle.kts
        git add -A
        actual="$(git write-tree)"
        echo "materialized tree: $actual"
        echo "expected tree:     ${{ inputs.expected_tree }}"
        test "$actual" = "${{ inputs.expected_tree }}"
        tar czf "$RUNNER_TEMP/out/spool-v2.1.0-source.tar.gz" -C "$RUNNER_TEMP" asset
        sha256sum "$RUNNER_TEMP/out/spool-v2.1.0-source.tar.gz" | tee /tmp/src-sha256.txt

    - name: Create the prerelease with APKs and matching source
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/out"
        SRC_SHA=$(cut -d' ' -f1 /tmp/src-sha256.txt)
        {
          printf '%s\n' 'spool 2.1.0 preview build: Material You theme styles (Tonal Spot / Expressive / Vibrant, Expressive default for Material You), softer card edges and fainter settings dividers.'
          printf '\n'
          printf '%s\n' 'Phone install: Spool-2.1.0-arm64-v8a.apk (Pixel 7 and most modern phones). Spool-2.1.0-universal.apk covers all ABIs. Installs over spool 2.0.0 (same package app.spool.music, same signing certificate, versionCode 57).'
          printf '\n'
          printf '%s\n' "Verification (build run ${{ inputs.run_id }}): 47/47 unit and screenshot tests, release APK signed with the production key (cert SHA-256 a736ba238a0f10d07f9197ca9ba51eb26f46576ba428ed12723434da47b11dee), upgrade smoke over the shipped 2.0.0 install passed."
          printf '\n'
          printf '%s\n' "Matching source: spool-v2.1.0-source.tar.gz (sha256 ${SRC_SHA}) is the exact source these APKs were built from: the v2.0.0 production source plus the reviewed spool-edits-18 patch and the 2.1.0 version bump (tree c2130cdf3c858f3d14322fb1fd97b6b2e7a68640)."
          printf '\n'
          printf '%s\n' "APK sha256: ${{ inputs.expected_arm64_sha256 }} (arm64), ${{ inputs.expected_universal_sha256 }} (universal)."
        } > /tmp/notes.md
        cat /tmp/notes.md
        gh release create "${{ inputs.tag }}" --repo JoyalGeorge2006/spool \
          --title "${{ inputs.release_name }}" \
          --notes-file /tmp/notes.md \
          --prerelease \
          Spool-2.1.0-arm64-v8a.apk Spool-2.1.0-universal.apk spool-v2.1.0-source.tar.gz
        gh release view "${{ inputs.tag }}" --repo JoyalGeorge2006/spool --json url,isPrerelease,assets
