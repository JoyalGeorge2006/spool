name: Build modded APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Apply the spool patch (MP3 export + retheme)
      run: |
        curl -sL -o /tmp/spool.patch "https://drive.google.com/uc?export=download&id=1Wv1z9IZP8r1j9cApVxkXfIudON-uadIY"
        git apply --exclude='native/lame/*' /tmp/spool.patch
        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

    - name: Restore the persisted debug keystore
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: |
        if [ -n "$SPOOL_DEBUG_KEYSTORE_B64" ]; then
          echo "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore
        fi

    - name: Build the APK
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDevDebug

    - name: Record v6 screenshots
      run: ./gradlew :app:recordRoborazziDevDebug --tests 'com.music.bitchord.V6ScreenshotTest'

    - name: Upload v6 screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v6-screenshots
        path: app/build/outputs/roborazzi/

    - name: Upload screenshot test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: v6-test-reports
        path: app/build/test-results/testDevDebugUnitTest/

    - name: Upload the APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spool-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk
