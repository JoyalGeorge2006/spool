name: Build modded APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Apply the MP3-export patch
      run: |
        curl -sL -o /tmp/mp3.patch "https://drive.google.com/uc?export=download&id=1BjauESDBcDycJJSKhhAHUpRPIepki5rE"
        git apply --exclude='native/lame/*' /tmp/mp3.patch
        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

    - name: Build the APK
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDevDebug

    - name: Upload the APK
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk
