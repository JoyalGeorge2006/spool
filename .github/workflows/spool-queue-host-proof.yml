name: Verify approved queue notice over Library host
on:
  workflow_dispatch:
  push:
    branches: [spool-song-menu-cleanup]
    paths: [.github/workflows/spool-queue-host-proof.yml]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Update focused visual tests only
        run: |
          set -o pipefail
          python3 - <<'PYTEST'
          from pathlib import Path
          import gzip,base64
          Path('app/src/test/java/com/music/bitchord/QueueHostProofTest.kt').write_bytes(gzip.decompress(base64.b64decode('')))
          PYTEST
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/test app/src/main/java/com/music/bitchord/ui/components/QueueActionNotice.kt
          git commit -m 'Render queue notice over actual shared mini-player host'
          git push origin HEAD:spool-song-menu-cleanup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android platform
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          cat > /tmp/platform.gradle <<'INIT'
          allprojects { afterEvaluate { p -> def a = p.extensions.findByName('android'); if(a != null) a.compileSdkVersion('android-37.0') } }
          INIT
      - name: Render complete action menus and Library
        run: |
          set -o pipefail
          ./gradlew --init-script /tmp/platform.gradle :app:testDevDebugUnitTest --tests com.music.bitchord.QueueHostProofTest --no-daemon --stacktrace 2>&1 | tee complete-proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-background-proof
          path: |
            **/build/outputs/roborazzi/
            **/build/test-results/
            complete-proof.log
