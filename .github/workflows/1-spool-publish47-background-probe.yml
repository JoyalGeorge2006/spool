name: Publish cumulative1.9.9 exact source and verify background OTA
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  publish-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: JoyalGeorge2006/spool
        run-id: 44245372182
        name: Spool-v78-active-OTA-APK
        path: final
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: JoyalGeorge2006/spool
        run-id: 44245372182
        name: Spool-v78-complete-corresponding-source
        path: source
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: JoyalGeorge2006/spool
        run-id: 44243011057
        name: Spool-v78-active-OTA-APK
        path: baseline
    - name: Prepare release notes and real UI probe
      run: 'python3 - <<''PREP''

        import base64

        open(''/tmp/release-notes.txt'',''wb'').write(base64.b64decode(''''))

        open(''/tmp/ota-ui.py'',''wb'').write(base64.b64decode(''''))

        PREP

        echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Gate exact verified build and publish matching free versioned APK plus source
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\nrepo=JoyalGeorge2006/spool\nstate=$(gh api repos/$repo/actions/runs/44245372182 --jq '.conclusion')\ntest \"$state\" = success\napk=$(find final -name spool.apk -type f | head -1)\nbase=$(find baseline -name spool.apk -type f | head -1)\necho \"4bb7387b1b498d99c67b2bfeb9f70cb7e64f675170c9d8db834e22870189f57d  $apk\" | sha256sum -c -\necho \"c380b0f5ac0a09343f80bfa1307c513422f3c27295b749ec5ee9243da4910ccb  $base\" | sha256sum -c -\necho '3ffb4a494d3eb3ff7a43016bd1b869d8ad8b4957796a208ccdbaec5550f53aea  source/spool-v1.9.9-source.tar.gz' | sha256sum -c -\ncp \"$apk\" spool-v1.9.9_arm64-v8a.apk\ncp \"$base\" /tmp/baseline.apk\ncp source/spool-v1.9.9-source.tar.gz .\nsha256sum spool-v1.9.9_arm64-v8a.apk spool-v1.9.9-source.tar.gz > SHA256SUMS\nif gh release view v1.9.9 --repo \"$repo\" > /tmp/existing-release.txt 2>&1; then\n echo 'Matching version already exists; refusing overwrite';cat /tmp/existing-release.txt;exit 1\nfi\ngh release create v1.9.9 --repo \"$repo\" --target \"$GITHUB_SHA\" --title 'Spool v78 - App updates (1.9.9)' --notes-file /tmp/release-notes.txt spool-v1.9.9_arm64-v8a.apk spool-v1.9.9-source.tar.gz SHA256SUMS\ngh release view v1.9.9 --repo \"$repo\" --json url,isDraft,isPrerelease,tagName,assets > /tmp/published-release.json\nmkdir -p verification\ncp /tmp/published-release.json verification/\ncat /tmp/published-release.json\n"
    - name: Real44to47 updater continues with process absent then restores and installs
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 37.2-beta3
        arch: x86_64
        target: google_apis_ps16k
        profile: pixel_7
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
        script: python3 /tmp/ota-ui.py > verification/ota-ui-probe.txt 2>&1; status=$?; cat verification/ota-ui-probe.txt; adb logcat -d -b all > verification/ota-logcat.txt; exit $status
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Spool-v78-published-real-OTA-evidence
        path: verification
        retention-days: 30
