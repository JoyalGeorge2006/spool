name: spool verification (no release publication)

on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run the independent complete app and shared unit test suites'
        type: boolean
        default: false
      skip_captures:
        description: 'Reuse unchanged UI captures when only non-UI source changed'
        type: boolean
        default: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Fetch pinned v1.9.17 source and apply blur edits
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/spool-source.tar.gz "https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.17/spool-v1.9.17-source.tar.gz"
        echo '8af044da1ce03348a42531b28fd7216056bb914640dd669233f66c95d7011bb7  /tmp/spool-source.tar.gz' | sha256sum -c -
        SRC="$RUNNER_TEMP/asset"
        mkdir -p "$SRC"
        tar xzf /tmp/spool-source.tar.gz -C "$SRC"
        cd "$SRC"
        git init -q
        git apply "$GITHUB_WORKSPACE/spool-edits-ktor.patch"
        curl -fsSL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1
        echo "SRC_DIR=$SRC" >> "$GITHUB_ENV"

    - name: Prove the task graph builds no APK
      run: |
        cd "$SRC_DIR"
        chmod +x gradlew
        ./gradlew :app:compileDevDebugKotlin :app:compileDevDebugUnitTestKotlin --dry-run | tee /tmp/tasks.txt
        if grep -qiE 'assemble|Apk|androidTest' /tmp/tasks.txt; then
          echo "::error::APK-producing task in graph, refusing to run"; exit 1
        fi

    - name: Compile Home sources and screenshot-test sources
      run: |
        cd "$SRC_DIR"
        ./gradlew :app:compileDevDebugKotlin :app:compileDevDebugUnitTestKotlin

  fullsuite:
    if: inputs.full_suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Fetch pinned v1.9.17 source and apply blur edits
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/spool-source.tar.gz "https://github.com/JoyalGeorge2006/spool/releases/download/v1.9.17/spool-v1.9.17-source.tar.gz"
        echo '8af044da1ce03348a42531b28fd7216056bb914640dd669233f66c95d7011bb7  /tmp/spool-source.tar.gz' | sha256sum -c -
        SRC="$RUNNER_TEMP/asset"
        mkdir -p "$SRC"
        tar xzf /tmp/spool-source.tar.gz -C "$SRC"
        cd "$SRC"
        git init -q
        git apply "$GITHUB_WORKSPACE/spool-edits-ktor.patch"
        curl -fsSL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1
        echo "SRC_DIR=$SRC" >> "$GITHUB_ENV"

    # One step per module, each if: always(): Gradle fail-fast inside a single
    # invocation let a sharedUi failure block :app:testDevDebugUnitTest from
    # ever starting (run 44682926167). Split so every module executes and
    # reports; any failure still fails the job.
    - name: App unit test suite (changed module)
      if: always()
      timeout-minutes: 60
      run: |
        cd "$SRC_DIR"
        ./gradlew :app:testDevDebugUnitTest -Pbitchord.bundleWear=false

    - name: sharedUi unit test suite (changed module; 2 RelatedMusicPanelTest failures tracked pre-existing on base, run 44682302890)
      if: always()
      timeout-minutes: 60
      run: |
        cd "$SRC_DIR"
        ./gradlew :sharedUi:jvmTest -Pbitchord.bundleWear=false

    - name: shared data-layer unit tests (tracked base toolchain failure)
      if: always()
      timeout-minutes: 60
      run: |
        cd "$SRC_DIR"
        ./gradlew :shared:jvmTest -Pbitchord.bundleWear=false

    - name: Upload full suite results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-suite-results
        path: |
          ${{ env.SRC_DIR }}/app/build/test-results/**/*.xml
          ${{ env.SRC_DIR }}/sharedUi/build/test-results/**/*.xml
          ${{ env.SRC_DIR }}/shared/build/test-results/**/*.xml
        if-no-files-found: ignore

