name: v6 screenshots (tests only, no APK)

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Apply the spool patch
      run: |
        curl -sL -o /tmp/spool.patch "https://drive.google.com/uc?export=download&id=1Wv1z9IZP8r1j9cApVxkXfIudON-uadIY"
        git apply --exclude='native/lame/*' /tmp/spool.patch
        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

    - name: Prove the task graph builds no APK
      run: |
        chmod +x gradlew
        ./gradlew :app:recordRoborazziDevDebug --tests 'com.music.bitchord.V6ScreenshotTest' --dry-run > /tmp/tasks.txt
        cat /tmp/tasks.txt
        if grep -qiE 'assemble|apk|androidTest' /tmp/tasks.txt; then
          echo "::error::APK-producing task in graph, refusing to run"; exit 1
        fi

    - name: Record v6 screenshots
      run: ./gradlew :app:recordRoborazziDevDebug --tests 'com.music.bitchord.V6ScreenshotTest'

    - name: Upload v6 screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v6-screenshots
        path: app/build/outputs/roborazzi/

    - name: Upload screenshot test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: v6-test-reports
        path: app/build/test-results/testDevDebugUnitTest/
