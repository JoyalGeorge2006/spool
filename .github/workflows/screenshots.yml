name: spool verification (no release publication)

on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run the independent complete app and shared unit test suites'
        type: boolean
        default: false
      skip_captures:
        description: 'Reuse unchanged UI captures when only non-UI source changed'
        type: boolean
        default: false

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Apply and push exact patched source (unverified until checks pass)
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/spool.patch "https://drive.google.com/uc?export=download&id=1Wv1z9IZP8r1j9cApVxkXfIudON-uadIY"
        echo '8b4775c8ae05dfd916155126f604d78c25a826b477d18c185d659c7724fc48be  /tmp/spool.patch' | sha256sum -c -
        git apply --exclude='native/lame/*' --exclude='README.md' --exclude='docs/assets/spool-logo.svg' /tmp/spool.patch
        git config user.email "actions@github.com"
        git config user.name "github-actions"
        git checkout -B v6-source
        git fetch origin v6-source
        git checkout FETCH_HEAD -- .github
        git add -A -- . ':!*.apk'
        git commit -m "Source snapshot - validation pending"
        git push -f origin v6-source

  compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Apply the spool patch
      run: |
        curl -sL -o /tmp/spool.patch "https://drive.google.com/uc?export=download&id=1Wv1z9IZP8r1j9cApVxkXfIudON-uadIY"
        echo '8b4775c8ae05dfd916155126f604d78c25a826b477d18c185d659c7724fc48be  /tmp/spool.patch' | sha256sum -c -
        git apply --exclude='native/lame/*' --exclude='README.md' --exclude='docs/assets/spool-logo.svg' /tmp/spool.patch
        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

    - name: Prove the task graph builds no APK
      run: |
        chmod +x gradlew
        ./gradlew :app:compileDevDebugKotlin :app:compileDevDebugUnitTestKotlin --dry-run | tee /tmp/tasks.txt
        if grep -qiE 'assemble|Apk|androidTest' /tmp/tasks.txt; then
          echo "::error::APK-producing task in graph, refusing to run"; exit 1
        fi

    - name: Compile Home sources and screenshot-test sources
      run: ./gradlew :app:compileDevDebugKotlin :app:compileDevDebugUnitTestKotlin

  fullsuite:
    if: inputs.full_suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Apply the spool patch
      run: |
        curl -sL -o /tmp/spool.patch "https://drive.google.com/uc?export=download&id=1Wv1z9IZP8r1j9cApVxkXfIudON-uadIY"
        echo '8b4775c8ae05dfd916155126f604d78c25a826b477d18c185d659c7724fc48be  /tmp/spool.patch' | sha256sum -c -
        git apply --exclude='native/lame/*' --exclude='README.md' --exclude='docs/assets/spool-logo.svg' /tmp/spool.patch
        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

    - name: Full unit test suite (candidate gate)
      timeout-minutes: 60
      run: ./gradlew :app:testDevDebugUnitTest :shared:jvmTest -Pbitchord.bundleWear=false

    - name: Upload full suite results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-suite-results
        path: |
          app/build/test-results/**/*.xml
          shared/build/test-results/**/*.xml
        if-no-files-found: ignore

  shots:
    if: ${{ !inputs.skip_captures }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Apply the spool patch
      run: |
        curl -sL -o /tmp/spool.patch "https://drive.google.com/uc?export=download&id=1Wv1z9IZP8r1j9cApVxkXfIudON-uadIY"
        echo '8b4775c8ae05dfd916155126f604d78c25a826b477d18c185d659c7724fc48be  /tmp/spool.patch' | sha256sum -c -
        git apply --exclude='native/lame/*' --exclude='README.md' --exclude='docs/assets/spool-logo.svg' /tmp/spool.patch
        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

    - name: Prove the screenshot task graph builds no APK
      run: |
        chmod +x gradlew
        ./gradlew :app:recordRoborazziDevDebug -Pbitchord.bundleWear=false --dry-run | tee /tmp/tasks.txt
        if grep -qiE 'assemble|Apk|androidTest' /tmp/tasks.txt; then
          echo "::error::APK-producing task in graph, refusing to run"; exit 1
        fi

    - name: Focused import cancellation regression tests
      run: |
        ./gradlew :shared:jvmTest --tests '*SpotifyImportCancellationTest*'
        python3 - <<'CHECK'
        import glob, xml.etree.ElementTree as E
        expected = {'normalBodyIsReturnedIntact', 'cancellationBeforeHeadersCancelsCall', 'cancellationDuringTricklingBodyCancelsCallAndClosesResponse'}
        passed = set()
        for path in glob.glob('shared/build/test-results/jvmTest/*.xml'):
            for t in E.parse(path).iter('testcase'):
                if 'SpotifyImportCancellationTest' in t.get('classname', '') and not any(t.find(x) is not None for x in ['failure','error','skipped']):
                    passed.add(t.get('name', '').split('[')[0])
        assert expected <= passed, f'Missing/nonpassing tests: {expected-passed}'
        print('All three focused import tests passed, none skipped')
        CHECK

    - name: Queue Undo and motion regression tests
      run: ./gradlew :app:testDevDebugUnitTest -Pbitchord.bundleWear=false --tests '*QueueUndoPositionTest*' --tests '*SpoolMotionPolicyTest*' --tests '*QueueUndoRestoreTest*'

    # Targeted visual verification: only the V6ScreenshotTest capture class.
    # A targeted green is a capture pass, never a full-suite pass; the full
    # suite runs when this workflow is dispatched with full_suite=true.
    - name: Record v6 screenshots (targeted captures)
      if: ${{ !cancelled() }}
      timeout-minutes: 60
      run: |
        cat > /tmp/capture-diagnostics.gradle <<'GRADLE'
        allprojects {
          tasks.withType(Test).configureEach {
            testLogging { events 'started', 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
          }
        }
        GRADLE
        ./gradlew --init-script /tmp/capture-diagnostics.gradle :app:recordRoborazziDevDebug -Pbitchord.bundleWear=false --tests 'com.music.bitchord.V6ScreenshotTest.player_*' --tests 'com.music.bitchord.V6ScreenshotTest.settings_player_overflow_*' &
        gradle_pid=$!
        (
          sleep 360
          if kill -0 "$gradle_pid" 2>/dev/null; then
            echo 'CAPTURE WATCHDOG: worker thread stacks after 360 seconds'
            jps -lv
            for worker in $(jps -l | awk '/GradleWorkerMain/ {print $1}'); do
              jcmd "$worker" Thread.print || true
            done
          fi
        ) &
        watchdog_pid=$!
        set +e
        wait "$gradle_pid"
        result=$?
        kill "$watchdog_pid" 2>/dev/null || true
        wait "$watchdog_pid" 2>/dev/null || true
        exit "$result"


    - name: Fail-safe roborazzi PNG artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v6-shots-png
        path: |
          app/build/outputs/roborazzi/*.png
          app/build/test-results/testDevDebugUnitTest/*.xml
        if-no-files-found: ignore


  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Apply the spool patch
      run: |
        curl -sL -o /tmp/spool.patch "https://drive.google.com/uc?export=download&id=1Wv1z9IZP8r1j9cApVxkXfIudON-uadIY"
        echo '8b4775c8ae05dfd916155126f604d78c25a826b477d18c185d659c7724fc48be  /tmp/spool.patch' | sha256sum -c -
        git apply --exclude='native/lame/*' --exclude='README.md' --exclude='docs/assets/spool-logo.svg' /tmp/spool.patch
        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1

    - name: Restore the persisted signing key
      env:
        SPOOL_DEBUG_KEYSTORE_B64: ${{ secrets.SPOOL_DEBUG_KEYSTORE_B64 }}
      run: |
        test -n "$SPOOL_DEBUG_KEYSTORE_B64"
        printf '%s' "$SPOOL_DEBUG_KEYSTORE_B64" | base64 -d > spool-debug.keystore
        test -s spool-debug.keystore
        chmod 600 spool-debug.keystore

    - name: Build the spool APK (verification test build)
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDevDebug

    - name: Fail-safe raw APK splits artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: raw-apk-splits
        path: app/build/outputs/apk/dev/debug/*.apk
        if-no-files-found: ignore

    - name: Collect the APKs (outside the source checkout)
      run: |
        ls -la app/build/outputs/apk/dev/debug/
        mkdir -p "$RUNNER_TEMP/apk-out"
        cp app/build/outputs/apk/dev/debug/*-universal-debug.apk "$RUNNER_TEMP/apk-out/spool-universal.apk"
        cp app/build/outputs/apk/dev/debug/*-x86_64-debug.apk "$RUNNER_TEMP/apk-out/spool-x86.apk"
        cp app/build/outputs/apk/dev/debug/*-arm64-v8a-debug.apk "$RUNNER_TEMP/apk-out/spool.apk"
        ls -la "$RUNNER_TEMP/apk-out/"
        test "$(unzip -l "$RUNNER_TEMP/apk-out/spool.apk" | grep -c 'lib/arm64-v8a/')" -gt 0
        test "$(unzip -l "$RUNNER_TEMP/apk-out/spool-universal.apk" | grep -c 'lib/arm64-v8a/')" -gt 0

    - name: Upload spool.apk
      uses: actions/upload-artifact@v4
      with:
        name: spool-apk
        path: ${{ runner.temp }}/apk-out/spool.apk

    # Release publication intentionally absent. Verification artifacts only.

    - name: Download actual v116 upgrade fixture
      uses: actions/download-artifact@v4
      with:
        name: raw-apk-splits
        run-id: 43747139582
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/prior-v116

    - name: Normalize emulator fixture signature to the candidate key
      env:
        SPOOL_DEBUG_STORE_PASSWORD: ${{ secrets.SPOOL_DEBUG_STORE_PASSWORD }}
        SPOOL_DEBUG_KEY_PASSWORD: ${{ secrets.SPOOL_DEBUG_KEY_PASSWORD }}
      run: |
        signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
        fixture=$(find "$RUNNER_TEMP/prior-v116" -name '*-x86_64-debug.apk' -print -quit)
        test -n "$signer" && test -n "$fixture"
        "$signer" sign --ks spool-debug.keystore --ks-key-alias spooldebug --ks-pass env:SPOOL_DEBUG_STORE_PASSWORD --key-pass env:SPOOL_DEBUG_KEY_PASSWORD "$fixture"
        "$signer" verify --verbose --print-certs "$fixture"
        "$signer" verify --verbose --print-certs "$RUNNER_TEMP/apk-out/spool.apk"

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Emulator smoke test (install + launch)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        script: |
          adb install -r "$RUNNER_TEMP/apk-out/spool-x86.apk"
          adb shell monkey -p app.spool.music.dev -c android.intent.category.LAUNCHER 1
          sleep 20
          adb shell pidof app.spool.music.dev
          bash scripts/spool-launcher-smoke.sh "$RUNNER_TEMP/apk-out/spool-x86.apk" "$(find "$RUNNER_TEMP/prior-v116" -name '*-x86_64-debug.apk' -print -quit)"
          adb exec-out screencap -p > "$RUNNER_TEMP/launch.png"

    - name: Upload launch screenshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: launch-screenshot
        path: ${{ runner.temp }}/launch.png
        if-no-files-found: ignore
