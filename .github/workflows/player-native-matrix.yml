name: Native player evidence (capture only)
on:
  workflow_dispatch:
jobs:
  shots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - surface: lyrics
            test: player_pane_lyrics
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Apply the spool patch
      run: |
        git fetch origin 9f40c70e614d4e4d978d58295f59ab12ee07b493
        git checkout FETCH_HEAD -- . ':!.github'
        test "$(git rev-parse FETCH_HEAD)" = 9f40c70e614d4e4d978d58295f59ab12ee07b493
        curl -sL -o /tmp/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        mkdir -p native/lame
        tar xzf /tmp/lame.tar.gz -C native/lame --strip-components=1


    - name: Capture both themes of the native surface
      timeout-minutes: 25
      run: |
        chmod +x gradlew
        cat > /tmp/capture-diagnostics.gradle <<'GRADLE'
        allprojects {
          tasks.withType(Test).configureEach {
            testLogging { events 'started', 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
          }
        }
        GRADLE
        ./gradlew --init-script /tmp/capture-diagnostics.gradle :app:recordRoborazziDevDebug -Pbitchord.bundleWear=false --tests 'com.music.bitchord.V6ScreenshotTest.${{ matrix.test }}_light' --tests 'com.music.bitchord.V6ScreenshotTest.${{ matrix.test }}_dark'

    - name: Upload native PNGs and test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-${{ matrix.surface }}
        path: |
          app/build/outputs/roborazzi/*.png
          app/build/test-results/testDevDebugUnitTest/*.xml
        if-no-files-found: ignore
